# cargo-deny configuration file
# See https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
# Transitive unmaintained crates (gtk3, bincode, unic-*, etc.) are tracked but not gate CI.
unmaintained = "none"
ignore = [
  "RUSTSEC-2023-0071",
  "RUSTSEC-2024-0436",
]
unused-ignored-advisory = "allow"

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "bzip2-1.0.6",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
highlight = "all"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = [
  "https://github.com/rust-lang/crates.io-index"
]
allow-git = []

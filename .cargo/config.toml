[alias]
# Dedicated vox-schola binary (Candle QLoRA + CUDA by default) — fastest incremental (~15 s).
vox-schola-dev       = "run -p vox-schola --"

[build]
# i9-14900KS has 32 logical threads; 24 leaves headroom for llvm-cov instrumentation.
# Baseline warm build-only: 57s at jobs=8; expect ~25-35s at jobs=24.
jobs = 24
rustdocflags = ["-D", "warnings"]

[target.x86_64-pc-windows-msvc]
# lld-link is available (C:\Program Files\LLVM\bin\lld-link.exe) but causes
# permission-denied errors on Windows when overwriting locked test binaries.
# Keeping MSVC linker (default). Revisit when lld-link Windows file-locking is fixed.
rustflags = ["-C", "link-arg=/DEBUG:NONE", "-C", "link-arg=/STACK:8388608"]

[env]
# Pin every cargo build/test invocation (including scripts) to a single `target/`
# dir per checkout, instead of letting tools scatter `target-agent/`,
# `target-doc-inv/`, etc. across the tree.
#
# `relative = true` resolves the path against the directory of *this* config
# file. Because each git worktree is a full checkout that contains its own
# `.cargo/config.toml`, this resolves to `<that-worktree>/target` — i.e. each
# worktree gets its OWN target dir. This is per-worktree by design, NOT a single
# root target shared across worktrees: concurrent agents building in different
# worktrees must not contend on one shared target lock. To actually share one
# target you would need an absolute path here (or in ~/.cargo/config.toml).
#
# Trade-off: N worktrees → N full targets (10–90 GB each; ~65% is incremental
# cache). That disk cost is reclaimed by a periodic sweep, not by sharing — see
# docs/superpowers/specs/2026-06-05-target-artifact-gc-design.md.
CARGO_TARGET_DIR = { value = "target", relative = true }

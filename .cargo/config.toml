[alias]
# Dedicated vox-schola binary (Candle QLoRA + CUDA by default) — fastest incremental (~15 s).
vox-schola-dev       = "run -p vox-schola --"

# vox-gui specifically cannot link with the workspace-default lld-link (see the
# [target.x86_64-pc-windows-msvc] comment below) — use these instead of plain
# `cargo build/test/check -p vox-gui`.
gui-build = "build -p vox-gui --config target.x86_64-pc-windows-msvc.linker=\"link.exe\""
gui-test  = "test -p vox-gui --config target.x86_64-pc-windows-msvc.linker=\"link.exe\""
gui-check = "check -p vox-gui --config target.x86_64-pc-windows-msvc.linker=\"link.exe\""

# ---------------------------------------------------------------------------
# Optional: sccache (shared compiler cache across worktrees / CI)
# ---------------------------------------------------------------------------
# Opt in locally — do NOT commit a hard `rustc-wrapper = "sccache"` here:
# hosted CI runners and fresh agent shells lack the binary, and cargo dies
# with `could not execute process \`sccache ... rustc -vV\`` before any build.
# Install: cargo install sccache  (or your OS package manager)
# Enable per-shell: $env:RUSTC_WRAPPER = "sccache"   (or export RUSTC_WRAPPER)
# Or per-user: add `[build] rustc-wrapper = "sccache"` to ~/.cargo/config.toml
#
[build]
jobs = 24
rustdocflags = ["-D", "warnings"]

# Bumped from cargo's default of 2 after a self-hosted nightly CI runner hit
# terminal registry-download failures (connection reset / SSL EOF, 2026-07-27)
# during a sustained network disruption on the host — a bigger retry budget
# is a cheap way to ride out a longer blip. Root cause was self-inflicted
# (a concurrent `docker build` saturating the runner's WSL2 network stack),
# not a recurring registry issue — see docs/src/ci/runner-contract.md.
[net]
retry = 6

# ---------------------------------------------------------------------------
# Linux: optional faster linker (lld)
# ---------------------------------------------------------------------------
# Install: sudo apt install lld   (Debian/Ubuntu) or equivalent on your distro
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.x86_64-pc-windows-msvc]
# lld-link (LLVM 22, on PATH) — ADOPTED 2026-06-30. The historical "permission-denied
# overwriting a locked test binary" error was the zombie-test-process / orphan class
# (handles held by stale `target/**/deps/*.exe` test processes), not an intrinsic
# lld-link bug; fixed via the orphan cleanup + process-hygiene work. Re-verified:
# 15/15 trivial-crate relinks + 5/5 real-crate (run-the-tests) relinks, zero lock.
# lld-link links the large (~115 MB) vox binaries much faster than MSVC link.exe.
# `vox doctor`'s linker check guards lld-link being MISSING from PATH — it does not,
# and cannot cheaply, catch the class of failure below.
#
# NOTE this default does not cover vox-gui (2026-08-30 investigation). Its link
# needs BOTH ucrt.lib (dynamic CRT import stubs — required by aws-lc-sys/zstd-sys,
# whose objects reference _wassert/clock/bsearch/qsort_s/clearerr as
# __declspec(dllimport)) AND libucrt.lib (static CRT math — required directly by
# Rust's own f64/f32 intrinsics and by candle-core's float path). link.exe
# reconciles the overlap between those two libraries (e.g. both define _wctype)
# silently; lld-link 22.1.8 hard-errors on it, and no combination of
# /DEFAULTLIB / /NODEFAULTLIB / /FORCE:MULTIPLE resolved it — each fix surfaced a
# new lld-link-specific error on a different symbol (_wctype, then 13 undefined
# math intrinsics with libucrt.lib excluded, then __acrt_iob_func "was replaced"
# once /FORCE:MULTIPLE was added). Verified pre-existing, not caused by any
# change to this workspace's Rust code. Use `cargo gui-build` / `cargo gui-test` /
# `cargo gui-check` (below) for vox-gui, which override to link.exe — plain
# `cargo build/test -p vox-gui` will fail to link.
linker = "lld-link"
rustflags = ["-C", "link-arg=/DEBUG:NONE", "-C", "link-arg=/STACK:8388608"]

[env]
SCCACHE_DIR = { value = ".sccache", relative = true }
# Pin every cargo build/test invocation (including scripts) to a single `target/`
# dir per checkout, instead of letting tools scatter `target-agent/`,
# `target-doc-inv/`, etc. across the tree.
#
# `relative = true` resolves the path against the directory of *this* config
# file. Because each git worktree is a full checkout that contains its own
# `.cargo/config.toml`, this resolves to `<that-worktree>/target` — i.e. each
# worktree gets its OWN target dir. This is per-worktree by design, NOT a single
# root target shared across worktrees: concurrent agents building in different
# worktrees must not contend on one shared target lock. To actually share one
# target you would need an absolute path here (or in ~/.cargo/config.toml).
#
# Trade-off: N worktrees → N full targets (10–90 GB each; ~65% is incremental
# cache). That disk cost is reclaimed by a periodic sweep, not by sharing — see
# docs/superpowers/specs/2026-06-05-target-artifact-gc-design.md.
CARGO_TARGET_DIR = { value = "target", relative = true }
# Tauri workspace: embed the Windows common-controls v6 manifest on bin targets.
# Without this, `vox-gui.exe` fails at startup with STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139).
# See https://github.com/tauri-apps/tauri/issues/13948
__TAURI_WORKSPACE__ = "true"

# Per-thread stack size for spawned threads (incl. every `cargo test` thread).
# The `[target.x86_64-pc-windows-msvc]` `/STACK:8388608` linker arg above only
# sizes the MAIN thread; the libtest harness runs each test on a SPAWNED thread
# whose stack is governed by RUST_MIN_STACK (default 2 MiB). Building the full
# clap command tree (`VoxCliRoot::command()`, e.g. in `command_catalog` /
# `command_compliance` help-rendering tests) overflows 2 MiB on Windows
# (STATUS_STACK_OVERFLOW), aborting `cargo test -p vox-cli --lib`. 8 MiB matches
# the linker /STACK and Linux CI's default, so the suite runs everywhere.
RUST_MIN_STACK = "8388608"

[package]
name = "vox-workspace"
version = "1.0.0"
kind = "workspace"
repository = "https://github.com/vox-foundation/vox"

# Rust crate graph (build, `cargo metadata`, CI): **root `Cargo.toml` is authoritative**
# (`members = ["crates/*"]`, `exclude` includes `crates/vox-codegen-html`, `crates/vox-dei`, `crates/vox-py`, `crates/vox-wasm`). `vox-codegen-html` was retired; use `vox-ssg` + React stack (ADR 010).
#
# This `[workspace]` section is only for `vox-package::VoxWorkspace` discovery of optional per-crate
# `crates/<name>/Vox.toml` manifests. The glob yields members when those files exist; it does not
# replace Cargo workspace membership.
[workspace]
members = ["crates/*/Vox.toml"]

# ── CodeRabbit Review Configuration ──────────────────────────────────────────
# Tier determines rate-limit defaults; CLI flags override these per-invocation.
#
# Pro tier: 150 files/review, 5 reviews/hour → 720s minimum between PRs.
#
# Run a full-codebase review from scratch:
#   vox review coderabbit semantic-submit --full-repo --execute
#
# Resume an interrupted run:
#   vox review coderabbit semantic-submit --full-repo --resume --execute
[review.coderabbit]
tier = "pro"
# delay_between_prs_secs auto-populates from `tier` when omitted.
# Slice size: owner-observed Pro cap is 150 files/PR; we ride the cap exactly.
max_files_per_pr = 150
# Not our code / generated / agent artifacts — never burn review quota on these.
exclude_prefixes = [
    "docs/",
    "mens/data/",
    ".vox-research-data/",
    "patches/",        # vendored third-party crate copies
    "assets/skills/",  # imported skill bundles (third-party content)
    ".vox/",           # local agent/audit artifacts
    ".cursor/",        # editor agent artifacts + audit dumps
    "graphify-out/",   # generated graph reports
]
# Fail planning if the unassigned group grows past 5% of included files —
# forces new top-level dirs into contracts/review/coderabbit-semantic-groups.v1.yaml.
max_unassigned_ratio = 0.05




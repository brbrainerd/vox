# Mix configuration for the mono-harness union corpus (B1 corpus).
# Merges vox_tool_selection + vox_argument_generation in curriculum order.
# Source: generated by corpus::harness_union (interleaved, 2:2 ratio).
output: mens/data/train_mixed_harness.jsonl

curriculum_schedule:
  phase_1:
    description: "simple tool-selection (4 candidates) interleaved with flat arg-gen (Tier 1-2)"
    sel_candidate_count: 4
    arg_schema_tier_max: 2
  phase_2:
    description: "medium selection (6 candidates) interleaved with typed arg-gen (Tier 3)"
    sel_candidate_count: 6
    arg_schema_tier_max: 3
  phase_3:
    description: "large catalog selection (10 candidates) with nested/optional arg-gen (Tier 4-5)"
    sel_candidate_count: 10
    arg_schema_tier_max: 5

sources:
  - path: mens/data/mix_sources/tool_selection_synth.jsonl
    weight: 3.0
    optional: true
    record_format: tool_selection
  - path: mens/data/mix_sources/argument_generation_synth.jsonl
    weight: 3.0
    optional: true
    record_format: argument_generation

# Mix configuration for the vox_argument_generation training spoke (B1 corpus).
# Source: generated by corpus::argument_generation_synth (rule-based, no LLM).
output: mens/data/train_mixed_argument_generation.jsonl

curriculum_schedule:
  phase_1:
    description: "single required string — flat schema, one field"
    schema_tier: 1
  phase_2:
    description: "multiple required fields — flat schema, 2-3 string fields"
    schema_tier: 2
  phase_3:
    description: "mixed types — string + integer, type-checked validation"
    schema_tier: 3
  phase_4:
    description: "nested object properties — recursive schema validation"
    schema_tier: 4
  phase_5:
    description: "optional fields — required subset + optional extras"
    schema_tier: 5

sources:
  - path: mens/data/mix_sources/argument_generation_synth.jsonl
    weight: 4.0
    optional: true
    record_format: argument_generation

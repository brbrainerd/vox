# Mix configuration for the vox_tool_selection training spoke (B1 corpus).
# Source: generated by corpus::tool_selection_synth (rule-based, no LLM).
output: mens/data/train_mixed_tool_selection.jsonl

curriculum_schedule:
  phase_1:
    description: "single-tool tasks — model sees one candidate and must confirm"
    candidate_count: 1
  phase_2:
    description: "4-candidate selection — chosen + 3 hard negatives from same category"
    candidate_count: 4
  phase_3:
    description: "large-catalog hard-negatives — 10 candidates including cross-category distractors"
    candidate_count: 10

sources:
  - path: mens/data/mix_sources/tool_selection_synth.jsonl
    weight: 4.0
    optional: true
    record_format: tool_selection

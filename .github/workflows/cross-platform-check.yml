name: Cross-Platform Check (Windows + macOS + Ubuntu)
on:
  # No `paths:` filter here (deliberately — see `path-check` job below): a
  # path-filtered `pull_request` trigger means the workflow never runs at all
  # on a non-matching PR, so it can never post a status — which makes its
  # per-leg contexts (and any summary job) permanently unusable as a required
  # check (a PR that doesn't touch the filtered paths would block forever).
  # `path-check` reinstates the same path scoping *inside* the workflow so the
  # two expensive matrix jobs still skip on irrelevant PRs, while the summary
  # job itself always runs and reports.
  pull_request:
  merge_group:
  schedule:
    - cron: '0 4 * * 1'   # Weekly Monday belt-and-suspenders run (full Win/macOS)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Reinstates the old `paths:` filter as an in-workflow check (see the `on:`
  # comment above) so the two heavy matrix jobs below still skip cheaply on a
  # PR that doesn't touch Rust/build-graph paths. Hosted because it's a single
  # `git diff`, not a build (row in github-hosted-exceptions.md already covers
  # every ubuntu-latest job in this file).
  path-check:
    name: Detect relevant changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.check.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          if ! git diff --name-only "${BASE}...HEAD" > /tmp/changed.txt 2>/dev/null; then
            git diff --name-only HEAD~1...HEAD > /tmp/changed.txt
          fi
          echo "Changed files:"
          cat /tmp/changed.txt
          if grep -qE '^(crates/|Cargo\.toml$|Cargo\.lock$|\.cargo/|rust-toolchain\.toml$|\.config/hakari\.toml$|contracts/|examples/golden/)' /tmp/changed.txt; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  cross-check:
    name: Cross-Platform (Win/macOS/Ubuntu)
    needs: path-check
    # Non-PR events (merge_group/schedule/workflow_dispatch) always run full —
    # `path-check` only exists for `pull_request` and reports `skipped` there,
    # so the first clause covers those; PRs run only when `path-check` found a
    # relevant file.
    if: github.event_name != 'pull_request' || needs.path-check.outputs.relevant == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            sccache_gha: "true"
          - os: macos-latest
            target: aarch64-apple-darwin
            sccache_gha: "true"
          # Moved off the self-hosted fleet (runner-remediation Task 11) so this
          # merge_group leg stops contending for the 6-runner pool. GHA sccache
          # backend ON — the self-hosted /cache/sccache volume doesn't exist on
          # ubuntu-latest and actions/cache doesn't cache SCCACHE_DIR.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            sccache_gha: "true"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: ${{ matrix.sccache_gha }}
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - name: Install system deps (Linux — GTK/wry required)
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y libdbus-1-dev pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # Per-PR depth (cheap): prove the whole workspace COMPILES on every OS.
      # vox-gui is a Tauri bin needing the pnpm-built ui/dist at compile time, so
      # it is excluded here and covered separately (Phase 5 / release-gui.yml).
      - name: cargo check (workspace) — every event
        run: cargo check --workspace --exclude vox-gui --target ${{ matrix.target }}

      # Per-PR test signal, kept cheap: only the platform-sensitive crates.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # Per-PR: only the Linux (self-hosted) leg runs the platform nextest. Win/macOS
      # legs do ONLY the cheap `cargo check` above on PRs (the per-PR cfg(windows)/
      # cfg(macos) compile proof); their full test run is deferred to merge_group +
      # the weekly schedule. Coverage deferred: full Win/macOS nextest moves off per-PR.
      - name: nextest (platform-sensitive crates) — Linux per-PR; all OS off-PR
        if: runner.os == 'Linux' || github.event_name != 'pull_request'
        run: |
          cargo nextest run -p vox-config
          cargo nextest run -p vox-config --features llm-egress
          cargo nextest run -p vox-cli-core
          cargo nextest run -p vox-populi --lib

      # Full depth (thorough but amortized): full clippy + full nextest run on
      # merge_group (once per merge batch) AND on the weekly schedule (the true
      # full Win/macOS sweep) — not on every PR push.
      - name: clippy (workspace, -D warnings) — merge_group + weekly
        if: github.event_name == 'merge_group' || github.event_name == 'schedule'
        run: cargo clippy --workspace --exclude vox-gui --target ${{ matrix.target }} -- -D warnings

      - name: nextest (workspace) — merge_group + weekly
        if: github.event_name == 'merge_group' || github.event_name == 'schedule'
        run: cargo nextest run --workspace --exclude vox-gui

      - name: sccache stats
        if: always()
        run: sccache --show-stats
      # Portability report (os_compat.py) removed from the per-merge path — the weekly
      # os-compat-report.yml is the canonical portability scan.

  # The `cross-check` job above builds with `--workspace`, which unifies Cargo
  # features across the entire graph — so a crate that under-declares a feature
  # still compiles there. `vox-gamify` used `vox_db::paths` (gated behind vox-db's
  # `host-integration`) without enabling it, and only broke when built from a graph
  # that excludes vox-cli: `cargo install --path crates/vox-ml-cli` failed on a
  # fresh macOS clone while all of CI stayed green.
  #
  # Build the installable leaf binaries STANDALONE (`-p`, no `--workspace`) so
  # feature unification cannot mask an under-declared dependency again.
  standalone-installables:
    name: Standalone installable crates (no feature unification)
    needs: path-check
    if: github.event_name != 'pull_request' || needs.path-check.outputs.relevant == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Install system deps (Linux — GTK/wry required)
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y libdbus-1-dev pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      # `-p` with no `--workspace`: each is a separate feature resolution, which is
      # what `cargo install --path` does. `--all-targets` because plain `cargo check`
      # skips tests and benches, where feature-gated code also rots.
      - name: cargo check (standalone, per-crate)
        shell: bash
        run: |
          set -euo pipefail
          cargo check --all-targets -p vox-ml-cli
          cargo check --all-targets -p vox-ml-cli --features populi
          cargo check --all-targets -p vox-gamify
          cargo check --all-targets -p vox-orchestrator-d
          # Installed by `vox plugin install`; both under-declared
          # vox-db/host-integration and compiled only under feature unification.
          cargo check --all-targets -p vox-plugin-mens-candle-metal
          cargo check --all-targets -p vox-plugin-mens-candle-cuda

      # NOTE: the vox-gui asset guards deliberately do NOT run here. Compiling any
      # vox-gui target runs tauri-build, which embeds the gitignored `ui/dist` — it
      # does not exist on a fresh checkout without a pnpm build, which is why the
      # workspace check above excludes vox-gui too. Those guards live in
      # gui-cross-build.yml, after its frontend build step.

  # Single stable context for branch protection. `cross-check` and
  # `standalone-installables` are matrix jobs whose GitHub-reported context
  # names embed the OS/target/sccache-flag tuple (e.g. "Cross-Platform
  # (Win/macOS/Ubuntu) (windows-latest, x86_64-pc-windows-msvc, true)") — those
  # names change whenever a leg is added, renamed, or re-flagged, so they can
  # never be required without branch protection silently going stale. This
  # job's `name:` is a fixed string with no matrix interpolation, so it is the
  # only context that should ever be marked required for this workflow.
  #
  # `if: always()` + explicit success-or-skipped check (mirrors ci.yml's
  # `ci-summary`) so this job runs — and reports correctly — even when
  # `path-check` skipped the heavy jobs on an irrelevant PR, or when a leg
  # genuinely failed.
  cross-platform-summary:
    name: Cross-Platform Check
    needs: [path-check, cross-check, standalone-installables]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All needed jobs succeeded or were skipped
        run: |
          set -euo pipefail
          fail=0
          for r in \
            "${{ needs.path-check.result }}" \
            "${{ needs.cross-check.result }}" \
            "${{ needs.standalone-installables.result }}"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::a needed job did not succeed (result: $r)"
              fail=1
            fi
          done
          exit $fail

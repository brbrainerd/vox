name: Cross-Platform Check (Windows + macOS + Ubuntu)
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'   # Weekly Monday belt-and-suspenders run
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cross-check:
    name: Cross-Platform (Win/macOS/Ubuntu)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cross-

      # Per-PR depth (cheap): prove the whole workspace COMPILES on every OS.
      # vox-gui is a Tauri bin needing the pnpm-built ui/dist at compile time, so
      # it is excluded here and covered separately (Phase 5 / release-gui.yml).
      - name: cargo check (workspace) — every event
        run: cargo check --workspace --exclude vox-gui --target ${{ matrix.target }}

      # Per-PR test signal, kept cheap: only the platform-sensitive crates.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: nextest (platform-sensitive crates) — PR/push
        if: github.event_name != 'merge_group'
        run: |
          cargo nextest run -p vox-config
          cargo nextest run -p vox-cli-core
          cargo nextest run -p vox-populi --lib

      # Merge-queue depth (thorough but amortized): full clippy + full nextest run
      # ONCE per merge batch, so hosted Windows (2x) / macOS (10x) minutes are not
      # spent on every push to a PR.
      - name: clippy (workspace, -D warnings) — merge_group only
        if: github.event_name == 'merge_group'
        run: cargo clippy --workspace --exclude vox-gui --target ${{ matrix.target }} -- -D warnings

      - name: nextest (workspace) — merge_group only
        if: github.event_name == 'merge_group'
        run: cargo nextest run --workspace --exclude vox-gui

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      # Non-blocking portability report — only on Linux, always exits 0.
      - name: Run portability scanner (os_compat.py)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          mkdir -p graphify-out
          python scripts/coverage-graph/os_compat.py
        working-directory: ${{ github.workspace }}

      - name: Upload portability report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: os-compat-report
          path: graphify-out/OS_COMPATIBILITY.md
          if-no-files-found: warn

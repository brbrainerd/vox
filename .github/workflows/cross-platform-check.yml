name: Cross-Platform Check (Windows + macOS)
on:
  schedule:
    - cron: '0 4 * * 1'   # Weekly Monday
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cross-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      # Shared compile cache via the GitHub Actions cache service (see
      # ci-fallback-hosted.yml `gate` for rationale).
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9


      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cross-
      
      - name: cargo check (workspace)
        # vox-gui is a Tauri bin: `tauri::generate_context!()` requires the built
        # frontend (`frontendDist = "ui/dist"`) at compile time, which this
        # lightweight cross-compile sanity check does not produce. Its full build
        # (incl. the pnpm frontend) is covered by release-gui.yml, so exclude it
        # here rather than add a node/pnpm toolchain to every cross-check run.
        run: cargo check --workspace --exclude vox-gui --target ${{ matrix.target }}
      
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      
      - name: nextest (platform-sensitive crates)
        run: |
          cargo nextest run -p vox-config
          cargo nextest run -p vox-cli-core
          cargo nextest run -p vox-populi --lib

      - name: sccache stats
        if: always()
        run: sccache --show-stats

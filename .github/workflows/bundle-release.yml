name: Build Distribution Bundles

# Triggered on published releases and manually via workflow_dispatch.
# Produces one tarball per (bundle-id x platform) matrix cell, verifies
# each with `vox bundle verify`, and uploads as release artifacts.
#
# Matrix: 7 bundles x 2 platforms = 14 jobs per run.
# vox-ml-metal (Apple Metal) and vox-mobile (alpha, v0.8) are excluded — see
# MATRIX_EXCLUDED_BUNDLES in crates/vox-cli/src/commands/ci/release_build.rs.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-bundles:
    name: ${{ matrix.bundle }} @ ${{ matrix.target }}
    runs-on: ${{ fromJson(matrix.runs_on) }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        bundle:
          - vox-base
          - vox-dev
          - vox-edge
          - vox-fullstack
          - vox-mesh
          - vox-ml
          - vox-server
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
        include:
          - target: x86_64-unknown-linux-gnu
            runs_on: '["self-hosted","linux","x64","docker"]'
          - target: x86_64-pc-windows-msvc
            runs_on: '["windows-latest"]'
    steps:
      - uses: actions/checkout@v7
        # fetch-depth: 0 — vox-build-meta derives the build number from
        # `git rev-list --count HEAD`; checkout defaults to depth 1, which
        # made every shipped binary report `+build.1`.
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        # Pinned, not @stable: shipped artifacts must be built by the same compiler
        # CI gates use (rust-toolchain.toml). @stable also imports each new
        # release's lint wave — see AGENTS.md §Perennial Bug Patterns.
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo Registry & Target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bundle-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bundle-
            ${{ runner.os }}-cargo-

      - name: Build vox CLI
        run: cargo build --profile dist --locked -p vox-cli --target ${{ matrix.target }}

      - name: Set VOX_BIN
        # `vox bundle build` tars std::env::current_exe() as bin/vox, so the
        # bundler MUST run from the --profile dist binary above, not a
        # `cargo run --release` (thin-LTO) build — otherwise every tarball
        # ships a non-dist binary.
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "VOX_BIN=target/${{ matrix.target }}/dist/vox.exe" >> "$GITHUB_ENV"
          else
            echo "VOX_BIN=target/${{ matrix.target }}/dist/vox" >> "$GITHUB_ENV"
          fi
        shell: bash

      - name: Apply bundle (install plugins into VOX_PLUGINS_DIR)
        # For bundles with plugins, pre-install them into a local dir so
        # `vox bundle build` can find them.  vox-base has no plugins and
        # this step is a no-op for it.
        env:
          VOX_PLUGINS_DIR: ${{ github.workspace }}/bundle-plugins
        run: |
          "$VOX_BIN" bundle apply ${{ matrix.bundle }} --yes
        shell: bash
        continue-on-error: true   # warn but proceed; build step reports missing plugins

      - name: Build bundle tarball
        env:
          VOX_PLUGINS_DIR: ${{ github.workspace }}/bundle-plugins
          BUNDLE_ARTIFACT: ${{ matrix.bundle }}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
        run: |
          "$VOX_BIN" \
            bundle build ${{ matrix.bundle }} \
            --out "$BUNDLE_ARTIFACT"
        shell: bash

      - name: Verify bundle integrity
        env:
          VOX_PLUGINS_DIR: ${{ github.workspace }}/bundle-plugins
          BUNDLE_ARTIFACT: ${{ matrix.bundle }}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
        run: |
          "$VOX_BIN" bundle verify "$BUNDLE_ARTIFACT"
        shell: bash

      - name: Checksum bundle
        env:
          BUNDLE_ARTIFACT: ${{ matrix.bundle }}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
        run: |
          ls -lh "$BUNDLE_ARTIFACT"
          sha256sum "$BUNDLE_ARTIFACT" > "$BUNDLE_ARTIFACT.sha256"
        shell: bash

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.bundle }}-${{ matrix.target }}
          path: |
            ${{ matrix.bundle }}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            ${{ matrix.bundle }}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
          retention-days: 30

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          # No public release is published from this repo; drafts are promoted by hand.
          draft: true
          prerelease: true
          files: |
            ${{ matrix.bundle }}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            ${{ matrix.bundle }}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

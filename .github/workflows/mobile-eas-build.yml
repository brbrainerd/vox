name: Mobile EAS Build (RN/Expo)

# Builds the React-Native/Expo mobile target end to end:
#   1. `bundle` job (ALWAYS runs, no account needed) — generates the Expo app
#      with `vox build --target=mobile`, installs deps, and runs `expo export`
#      to prove the generated app bundles. This is the real CI gate.
#   2. `eas-build` job (runs ONLY when the `EXPO_TOKEN` secret is configured) —
#      submits a cloud build on EAS to produce an installable APK.
#
# Setup for the optional EAS job is documented in
# docs/src/architecture/mobile-eas-ci-setup-2026.md.

on:
  merge_group:
  push:
    paths:
      - 'apps/vox-mental-tracker/**'
      - 'crates/vox-codegen/**'
      - 'crates/vox-codegen-ts/**'
      - 'crates/vox-runtime-rn/**'
      - 'clients/runtime-rn/**'
      - '.github/workflows/mobile-eas-build.yml'
  pull_request:
    paths:
      - 'apps/vox-mental-tracker/**'
      - 'crates/vox-codegen/**'
      - 'crates/vox-codegen-ts/**'
      - 'crates/vox-runtime-rn/**'
      - 'clients/runtime-rn/**'
      - '.github/workflows/mobile-eas-build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Gate that needs no Expo account: prove the generated app bundles. ──────
  bundle:
    name: Generate + export Expo bundle
    # Tier: heavy (self-hosted). merge_group + 'full-ci' label only.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install system deps (dbus, required by wry/keyring on Linux)
        run: sudo apt-get update -y && sudo apt-get install -y libdbus-1-dev pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Build vox CLI
        run: cargo build -p vox-cli

      - name: Generate Expo app (vox build --target=mobile)
        run: |
          ./target/debug/vox build apps/vox-mental-tracker/src/main.vox \
            --target=mobile -o "$RUNNER_TEMP/voxapp"

      - name: Swap @vox/runtime-rn for the CI JS shim
        # The real runtime is a native uniffi module; the JS shim lets the bundle
        # resolve without a native build. The shim lives in the repo so CI and
        # local runs share it. See docs/src/architecture/mobile-eas-ci-setup-2026.md.
        run: |
          cp -r ci/expo-bundle-shim/vox-runtime-rn "$RUNNER_TEMP/voxapp/shims-vox-runtime-rn"
          node -e '
            const fs = require("fs");
            const p = require("path").join(process.env.RUNNER_TEMP, "voxapp", "package.json");
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.dependencies["@vox/runtime-rn"] = "file:./shims-vox-runtime-rn";
            delete j.dependencies["@vox/runtime-types"];
            fs.writeFileSync(p, JSON.stringify(j, null, 2));
          '

      - name: Install JS deps
        working-directory: ${{ runner.temp }}/voxapp
        run: |
          npm install --no-audit --no-fund
          # `expo-file-system` is required by the @vox/runtime-rn CI shim
          # (shims-vox-runtime-rn/index.js) for its durable NDJSON journal.
          # `expo install --fix` pins the SDK-compatible version into package.json
          # but does NOT always install it ("added as a dependency ... but it
          # doesn't seem to be installed"), so run `npm install` afterward to
          # actually materialize it in node_modules — otherwise Metro can't
          # resolve it at export time.
          npx expo install expo-asset expo-status-bar react-native expo-file-system --fix || true
          npm install --no-audit --no-fund

      - name: Export bundle (proves the app compiles + bundles)
        working-directory: ${{ runner.temp }}/voxapp
        run: npx expo export --platform android --output-dir dist

      - name: Assert bundle artifact exists
        working-directory: ${{ runner.temp }}/voxapp
        run: test -d dist && test -n "$(ls -A dist)"

  # ── Cloud APK build: only when an Expo account token is wired up. ─────────
  eas-build:
    name: EAS cloud build (Android APK)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    needs: bundle
    # NOTE: the `secrets` context is NOT allowed in a job-level `if:` (GitHub
    # rejects the workflow), so gate on the event here and check EXPO_TOKEN in a
    # step guard below. The job still skips cleanly until the maintainer adds the
    # EXPO_TOKEN secret.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check EXPO_TOKEN is configured
        id: guard
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "EXPO_TOKEN secret not configured — skipping EAS build."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v7
      - if: steps.guard.outputs.enabled == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.guard.outputs.enabled == 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Build vox CLI + generate Expo app
        if: steps.guard.outputs.enabled == 'true'
        run: |
          cargo build -p vox-cli
          ./target/debug/vox build apps/vox-mental-tracker/src/main.vox \
            --target=mobile -o "$RUNNER_TEMP/voxapp"

      - name: Install eas-cli
        if: steps.guard.outputs.enabled == 'true'
        run: npm install -g eas-cli

      - name: EAS build (preview / Android APK)
        if: steps.guard.outputs.enabled == 'true'
        working-directory: ${{ runner.temp }}/voxapp
        run: eas build --platform android --profile preview --non-interactive --no-wait

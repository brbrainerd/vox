# PR mutation testing (merge-blocking on survivors): fires when compiler or codegen crates change.
# Results are uploaded as a workflow artifact; `cargo mutants` failures fail the job (no continue-on-error).
name: Mutation (PR, vox-compiler + vox-codegen)

on:
  merge_group:
  pull_request:
    paths:
      - "crates/vox-compiler/**"
      - "crates/vox-codegen/**"
      - "crates/vox-codegen-ts/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_LOCKED: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cargo-mutants:
    name: cargo-mutants (${{ matrix.crate }})
    # Tier: heavy (self-hosted). merge_group + 'full-ci' label only; skip routine PR pushes.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: [self-hosted, linux, x64]
    # Diff-scoped (see "Compute diff" + --in-diff below), so this is normally
    # tens of mutants, not the full crate's 4453 -- 45m is generous headroom
    # even for a large PR, while still catching a real hang far faster than
    # the 120m stopgap this replaced.
    timeout-minutes: 45
    # Hard gate: mutation survivors on vox-compiler or vox-codegen mean tests
    # exist but don't catch the mutations — the test suite is decorative, not
    # protective.  AGENTS.md §Test-First Policy notes that r_test (test pass
    # rate) is 30% of the GRPO reward; untested mutations weaken the model.
    # If a mutation is known-irrelevant, add it to .cargo/mutants.toml rather
    # than reverting to continue-on-error.
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: vox-compiler
            path_filter: "crates/vox-compiler/**"
          - crate: vox-codegen
            path_filter: |
              crates/vox-codegen/**
              crates/vox-codegen-ts/**
    steps:
      - uses: actions/checkout@v7
        with:
          # Need the merge-base commit to compute a real diff for --in-diff
          # scoping below (see "Compute diff" step) -- a shallow checkout only
          # has HEAD.
          fetch-depth: 0

      - name: Check if crate was changed
        id: changed
        uses: tj-actions/changed-files@v47
        with:
          files: ${{ matrix.path_filter }}

      - name: Skip if crate unchanged
        if: steps.changed.outputs.any_changed == 'false'
        run: echo "No changes in ${{ matrix.crate }} — skipping mutants."

      - name: Compute diff for --in-diff scoping
        # Unscoped full-crate mutation testing doesn't fit a reasonable
        # merge-blocking timeout (4453 mutants for vox-compiler alone; see
        # the 2026-07-29 investigation in mutation-nightly.yml and
        # docs/superpowers/plans/2026-07-29-mutation-nightly-shard-rotation.md).
        # Unlike the nightly job, this one is merge-blocking, so it can't use
        # day-of-year shard rotation -- it needs to test exactly the mutants
        # touching this PR/merge_group's actual diff, every time.
        # `cargo mutants --in-diff` takes a real diff file (not a file list),
        # so compute one against the correct base for each trigger.
        id: diffbase
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.merge_group.base_sha }}"
          fi
          DIFF_FILE="mutants-diff-${{ matrix.crate }}.diff"
          git diff "${BASE_SHA}"...HEAD -- ${{ matrix.path_filter }} > "$DIFF_FILE"
          echo "diff_file=${DIFF_FILE}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: steps.changed.outputs.any_changed == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (dbus/GTK for wry/keyring/soup on Linux)
        if: steps.changed.outputs.any_changed == 'true'
        run: sudo apt-get update -y && sudo apt-get install -y libdbus-1-dev pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Cache Cargo Registry & Target
        if: steps.changed.outputs.any_changed == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mutants-${{ matrix.crate }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mutants-${{ matrix.crate }}-

      - name: Install cargo-nextest
        if: steps.changed.outputs.any_changed == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install cargo-mutants
        if: steps.changed.outputs.any_changed == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Run mutants (package ${{ matrix.crate }})
        # emission_ladder_test shells out to rustc per case (~293s for the
        # whole file locally) -- excluded from the mutants inner loop only,
        # same as mutation-nightly.yml; the real `cargo test` gate still runs
        # it every time.
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          mkdir -p mutants-out/${{ matrix.crate }}
          cargo mutants -p ${{ matrix.crate }} --no-times --jobs 2 \
            --output mutants-out/${{ matrix.crate }} \
            --in-diff ${{ steps.diffbase.outputs.diff_file }} \
            -- -E 'not binary(emission_ladder_test)'

      - name: Upload mutants report
        if: steps.changed.outputs.any_changed == 'true' && always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-${{ matrix.crate }}-pr${{ github.event.pull_request.number }}
          path: mutants-out/${{ matrix.crate }}/
          retention-days: 14

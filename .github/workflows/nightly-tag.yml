# Cuts a nightly prerelease tag from `main` when there are new commits, so the
# existing tag-triggered release pipeline (release-binaries.yml,
# release-installers.yml, release-gui.yml — all `on: push: tags: v*`) builds
# and publishes it with NO duplicated build logic here. This workflow's only
# job is to decide "is a nightly needed" and, if so, create + push the tag.
#
# Tag shape: v<workspace-version>-nightly.<build-number>, e.g.
# v0.6.0-nightly.4821. version-tag-guard.yml already accepts this: it strips
# everything from the first '-' before comparing to Cargo.toml, so any
# `-nightly.N` suffix passes the same way `-rc.N` does. build-number is
# `git rev-list --count HEAD`, the same VOX_BUILD_NUMBER convention used
# elsewhere in this repo for monotonic, collision-free build numbering.
#
# KNOWN LIMITATION — read before assuming this cascades automatically:
# a tag pushed using the default GITHUB_TOKEN does NOT fire other workflows'
# `on: push` triggers (GitHub's loop-prevention rule for the built-in token).
# So pushing the tag with GITHUB_TOKEN would create it but NOT trigger the
# release-*.yml builds. This workflow therefore pushes with a PAT from the
# `NIGHTLY_TAG_TOKEN` secret when present (same pattern as
# `SSOT_AUTOREGEN_TOKEN` — see AGENTS.md "Do not hand-regenerate SSOT after a
# merge"). Without that secret configured, the tag step is skipped and the
# job just logs what a human needs to do — it does not silently no-op.
name: Nightly Tag

on:
  schedule:
    # 08:00 UTC daily. Skips itself below when there's nothing new since the
    # last nightly tag, so an idle repo does not spam tags/releases.
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-tag
  cancel-in-progress: false

jobs:
  cut-nightly-tag:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Check whether NIGHTLY_TAG_TOKEN is configured
        id: token
        shell: bash
        run: |
          if [ -n "${{ secrets.NIGHTLY_TAG_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NIGHTLY_TAG_TOKEN is not set — nightly tagging is disabled. A repo admin must add a PAT (repo scope) as the NIGHTLY_TAG_TOKEN secret; GITHUB_TOKEN cannot be used here because tags it pushes do not trigger the release-*.yml workflows (GitHub's loop-prevention rule)."
          fi

      - name: Determine whether a new nightly is needed
        if: steps.token.outputs.present == 'true'
        id: check
        shell: bash
        run: |
          set -euo pipefail
          last_nightly_sha="$(git rev-list -1 --tags='v*-nightly.*' 2>/dev/null || true)"
          head_sha="$(git rev-parse HEAD)"
          if [ -n "$last_nightly_sha" ] && [ "$last_nightly_sha" = "$head_sha" ]; then
            echo "No commits since the last nightly tag — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute nightly tag
        if: steps.token.outputs.present == 'true' && steps.check.outputs.skip == 'false'
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(
            awk '
              /^\[workspace\.package\]/ { in_wp = 1; next }
              /^\[/                     { in_wp = 0 }
              in_wp && /^[[:space:]]*version[[:space:]]*=/ {
                gsub(/.*=[[:space:]]*"/, "")
                gsub(/".*/, "")
                print
                exit
              }
            ' Cargo.toml
          )"
          build_number="$(git rev-list --count HEAD)"
          tag="v${cargo_version}-nightly.${build_number}"
          echo "Computed nightly tag: ${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create and push nightly tag
        if: steps.token.outputs.present == 'true' && steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.NIGHTLY_TAG_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.tag }}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git config user.name "vox-nightly-bot"
          git config user.email "actions@github.com"
          git tag "${tag}"
          git push origin "${tag}"
          echo "Pushed ${tag} — release-binaries.yml / release-installers.yml / release-gui.yml will pick it up."

      - name: Prune old nightly tags and releases (keep newest 5)
        if: steps.token.outputs.present == 'true' && steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.NIGHTLY_TAG_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Oldest-first list, drop the newest 5, delete the rest. Best-effort:
          # a release that never finished publishing (no release object yet)
          # still gets its bare tag cleaned up via `git push --delete`.
          old_tags="$(git tag -l 'v*-nightly.*' --sort=creatordate | head -n -5 || true)"
          for t in $old_tags; do
            echo "Pruning old nightly: $t"
            gh release delete "$t" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null \
              || git push origin ":refs/tags/$t" 2>/dev/null \
              || echo "  (already gone)"
          done

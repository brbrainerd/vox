name: Mobile E2E - Android
# Heavy GitHub-hosted macOS job. Per the tier note it runs only in the merge queue
# and on 'full-ci'-labeled PRs — NOT on every direct push to main. The former `push:`
# trigger cold-compiled vox-cli on macos-13 with no cache and no timeout, so a routine
# main push could run for hours. Removed `push:`; added a build cache and a timeout.
on:
  merge_group:
  pull_request:
    paths:
      - 'apps/vox-mental-tracker/**'
      - 'crates/vox-cli/**'
      - 'crates/vox-codegen/**'
      - 'crates/vox-codegen-ts/**'
      - 'crates/vox-tauri-codegen/**'
      - '.github/workflows/mobile-e2e-android.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  android-e2e:
    # Tier: heavy (GitHub-hosted macOS). merge_group + 'full-ci' label only; skip routine PR pushes.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: macos-13
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: cd apps/vox-mental-tracker && pnpm install --frozen-lockfile
      - name: Build vox CLI
        run: cargo build -p vox-cli
      - name: Build web bundle
        run: cd apps/vox-mental-tracker && pnpm build
      - name: Tauri mobile codegen (Android)
        run: |
          cd apps/vox-mental-tracker
          ../../target/debug/vox compile --target mobile-android -o dist src/main.vox
      - name: Verify generated Tauri workspace
        run: test -f target/generated/src-tauri/tauri.conf.json
      - name: Run Playwright (web)
        run: cd apps/vox-mental-tracker && pnpm e2e

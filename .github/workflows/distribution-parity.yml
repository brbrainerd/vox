# Distribution SSOT parity gate (Track 0). Hosted-only so it never depends on
# the self-hosted fleet. Make this a required check to enforce.
name: distribution-parity

on:
  pull_request:
    paths:
      - "contracts/distribution/**"
      - "contracts/toolchain/**"
      - "crates/_public.toml"
      - "crates/voxup/**"
      - ".github/workflows/distribution-parity.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: distribution-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Install system deps (libdbus etc. — voxup pulls keyring/wry on Linux)
        run: sudo apt-get update -y && sudo apt-get install -y libdbus-1-dev pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Run distribution SSOT parity tests
        run: cargo test -p voxup --test distribution_parity --locked

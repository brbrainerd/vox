name: Release GUI

on:
  push:
    tags:
      - 'v*'
  # Allow on-demand signing/build verification without cutting a release tag.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-tauri:
    name: Build Tauri GUI
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      # Job-level, NOT step-level: a step's `if:` is evaluated before that
      # step's own env: block exists, so a step-scoped var reads empty in
      # its own condition and the step is silently skipped forever. The
      # `secrets` context is not available in `if:` at all, which is why
      # this env hop exists -- it just has to happen one scope up.
      AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
    # No job-level permissions override: this job only builds and signs, and
    # inherits the workflow's top-level `contents: read`. It must never hold
    # a write-scoped token for a ~240-minute job that runs `pnpm install`
    # and the full Rust dependency graph. The `publish` job below (short,
    # download-and-attach only) is the sole holder of `contents: write`.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v7
        # fetch-depth: 0 — vox-build-meta derives the build number from
        # `git rev-list --count HEAD`; checkout defaults to depth 1, which
        # made every shipped binary report `+build.1`.
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        # Pinned, not the floating alias: dtolnay/rust-toolchain's floating
        # form exports RUSTUP_TOOLCHAIN, which OVERRIDES rust-toolchain.toml —
        # so the shipped GUI would be built by whatever stable is current,
        # not the channel every CI gate ran against. See AGENTS.md's
        # Perennial Bug Patterns for the toolchain-bump lint-wave class this
        # avoids.
        uses: ./.github/actions/setup-rust
        with:
          # universal-apple-darwin is a Tauri meta-target, not a real rustup
          # triple. The x86_64-apple-darwin cross target is added separately
          # below via `rustup target add` (not here) because this repo pins
          # its toolchain via rust-toolchain.toml (channel 1.96.0) — `rustup
          # target add`, run with no channel argument, always targets whatever
          # toolchain cargo will actually use (the pinned one), avoiding a
          # mismatch between this action's `@stable` alias and that pin.
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin' || matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # Pinned to 11 to match the other eighteen workflows using
      # pnpm/action-setup, and to match crates/vox-gui/ui/pnpm-workspace.yaml,
      # which carries pnpm-11-only settings (`allowBuilds`, and the `overrides`
      # block that pnpm 11 reads from this file instead of package.json#pnpm).
      # This step used to be `npm install -g pnpm`, which resolves to whatever
      # is latest and left the workflow's pnpm major unpinned -- it was the sole
      # workflow not pinning, and the reason it had never succeeded.
      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        # libasound2-dev: vox-gui's cpal mic-capture (desktop speech-to-text) pulls
        # alsa-sys, whose build script needs the ALSA dev headers (see the same
        # note in gui-cross-build.yml — this workflow was missing it).
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Typecheck frontend (tsc --noEmit)
        working-directory: ./crates/vox-gui/ui
        run: |
          pnpm install
          pnpm typecheck

      - name: Build frontend
        working-directory: ./crates/vox-gui/ui
        run: pnpm build

      # vox-gui's tauri.conf.json declares `externalBin: ["../../target/release/vox"]`
      # (a Tauri sidecar) — tauri-action does not build or universalize this binary
      # itself, so it must be staged at the triple-suffixed sidecar path before
      # "Build Tauri Application" or crates/vox-gui/build.rs panics. See the
      # "vox-gui sidecar missing" entry in AGENTS.md's Perennial Bug Patterns.
      - name: Build vox CLI sidecar (release, macOS universal)
        if: matrix.target == 'universal-apple-darwin'
        run: |
          # rustup target add (no channel arg) always targets whatever
          # toolchain cargo will actually use here — the repo's pinned
          # rust-toolchain.toml channel, matching the toolchain installed by
          # the pinned dtolnay/rust-toolchain step above. Installing this via
          # the action's `targets:` input instead left x86_64-apple-darwin's
          # core/std missing at build time.
          rustup target add x86_64-apple-darwin
          cargo build -p vox-cli --profile dist --target aarch64-apple-darwin
          cargo build -p vox-cli --profile dist --target x86_64-apple-darwin
          mkdir -p "$(dirname target/release/vox-universal-apple-darwin)"
          # Universal builds compile each arch separately (TARGET=<real triple>),
          # so the per-arch sidecar names must exist for cargo/build.rs, and the
          # lipo'd universal name must exist for the final bundling pass.
          cp target/aarch64-apple-darwin/dist/vox target/release/vox-aarch64-apple-darwin
          cp target/x86_64-apple-darwin/dist/vox target/release/vox-x86_64-apple-darwin
          lipo -create -output target/release/vox-universal-apple-darwin \
            target/aarch64-apple-darwin/dist/vox \
            target/x86_64-apple-darwin/dist/vox

      - name: Build vox CLI sidecar (release)
        if: matrix.target != 'universal-apple-darwin'
        run: cargo build -p vox-cli --profile dist --target ${{ matrix.target }}

      - name: Stage Tauri external sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force (Split-Path "target/release/vox-${{ matrix.target }}.exe") | Out-Null
          Copy-Item target/${{ matrix.target }}/dist/vox.exe target/release/vox-${{ matrix.target }}.exe -Force

      - name: Stage Tauri external sidecar (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$(dirname "target/release/vox-${{ matrix.target }}")"
          cp target/${{ matrix.target }}/dist/vox target/release/vox-${{ matrix.target }}

      # Build-only: `tagName`/`releaseName`/`releaseId` are deliberately
      # omitted. Per tauri-action's docs, omitting all three makes it build
      # the app without creating or uploading to a GitHub release — this job
      # has no `contents: write` token to do that with. The `publish` job
      # below uploads the bundle (via actions/upload-artifact here) to the
      # release instead.
      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple Developer secrets (for macOS Gatekeeper bypass)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: ./crates/vox-gui
          args: ${{ matrix.target == 'universal-apple-darwin' && '--target universal-apple-darwin' || '' }}

      - name: Note unsigned MSI (no signing cert configured)
        if: runner.os == 'Windows' && env.AZURE_CODE_SIGNING_ACCOUNT == ''
        run: echo "::warning::AZURE_CODE_SIGNING_ACCOUNT is not set -- the MSI in this release is UNSIGNED."

      # Note: Windows Azure Trusted Signing integration
      - name: Sign Windows Installer
        if: runner.os == 'Windows' && env.AZURE_CODE_SIGNING_ACCOUNT != ''
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: 'https://cus.codesigning.azure.net/'
          # v2.0.0 renamed `code-signing-account-name` → `signing-account-name`.
          signing-account-name: ${{ env.AZURE_CODE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          # crates/vox-gui/src-tauri does NOT exist — tauri.conf.json lives
          # directly at crates/vox-gui/, and the build output goes to the
          # workspace-level target/ (the workspace-root CARGO_TARGET_DIR set in
          # .cargo/config.toml). The old path could never contain an MSI, so
          # this step silently signed nothing and Windows installers shipped
          # unsigned.
          files-folder: ./target/release/bundle/msi
          files-folder-filter: msi

      - name: Upload GUI bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: gui-bundle-${{ matrix.target }}
          path: crates/vox-gui/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build-tauri
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: gui-bundle-*
          path: release-artifacts

      - name: Create release with assets
        uses: softprops/action-gh-release@v3
        with:
          name: 'Vox Desktop App ${{ github.ref_name }}'
          body: 'Native graphical environment and visualizer for Vox.'
          draft: true
          prerelease: false
          files: release-artifacts/**/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

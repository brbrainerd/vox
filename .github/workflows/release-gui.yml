name: Release GUI

on:
  push:
    tags:
      - 'v*'
  # Allow on-demand signing/build verification without cutting a release tag.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-tauri:
    name: Build Tauri GUI
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # universal-apple-darwin is a Tauri meta-target, not a real rustup
          # triple — install the two real Apple triples the lipo step below
          # builds against instead.
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Typecheck frontend (tsc --noEmit)
        working-directory: ./crates/vox-gui/ui
        run: |
          pnpm install
          pnpm typecheck

      - name: Build frontend
        working-directory: ./crates/vox-gui/ui
        run: pnpm build

      # vox-gui's tauri.conf.json declares `externalBin: ["../../target/release/vox"]`
      # (a Tauri sidecar) — tauri-action does not build or universalize this binary
      # itself, so it must be staged at the triple-suffixed sidecar path before
      # "Build Tauri Application" or crates/vox-gui/build.rs panics. See the
      # "vox-gui sidecar missing" entry in AGENTS.md's Perennial Bug Patterns.
      - name: Build vox CLI sidecar (release, macOS universal)
        if: matrix.target == 'universal-apple-darwin'
        run: |
          cargo build -p vox-cli --release --target aarch64-apple-darwin
          cargo build -p vox-cli --release --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/vox-universal-apple-darwin \
            target/aarch64-apple-darwin/release/vox \
            target/x86_64-apple-darwin/release/vox

      - name: Build vox CLI sidecar (release)
        if: matrix.target != 'universal-apple-darwin'
        run: cargo build -p vox-cli --release --target ${{ matrix.target }}

      - name: Stage Tauri external sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/release | Out-Null
          Copy-Item target/${{ matrix.target }}/release/vox.exe target/release/vox-${{ matrix.target }}.exe -Force

      - name: Stage Tauri external sidecar (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p target/release
          cp target/${{ matrix.target }}/release/vox target/release/vox-${{ matrix.target }}

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple Developer secrets (for macOS Gatekeeper bypass)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: ./crates/vox-gui
          tagName: ${{ github.ref_name }}
          releaseName: 'Vox Desktop App ${{ github.ref_name }}'
          releaseBody: 'Native graphical environment and visualizer for Vox.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target == 'universal-apple-darwin' && '--target universal-apple-darwin' || '' }}

      # Note: Windows Azure Trusted Signing integration
      - name: Sign Windows Installer
        if: runner.os == 'Windows'
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: 'https://cus.codesigning.azure.net/'
          # v2.0.0 renamed `code-signing-account-name` → `signing-account-name`.
          signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ./crates/vox-gui/src-tauri/target/release/bundle/msi
          files-folder-filter: msi

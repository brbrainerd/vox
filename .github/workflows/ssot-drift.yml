name: SSOT Drift Checker

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-versions:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6
      - name: Check for hardcoded versions
        run: |
          # Fails if any crate Cargo.toml has a hardcoded version instead of workspace inheritance
          if grep -rnE '^version\s*=\s*"[^"]+"' crates/*/Cargo.toml; then
            echo "::error title=SSOT Drift::Found hardcoded versions in crate Cargo.toml files. Use 'version.workspace = true'."
            exit 1
          fi
          echo "All crates use workspace versioning."

  # check-dashboard-ssot: retired 2026-05-30. The legacy vox-dashboard crate was
  # migrated into the Tauri vox-gui surface (ADR-037), which is hand-authored
  # React (crates/vox-gui/ui/) with no .vox->generated/ pipeline, so the
  # generated/-SSoT guard no longer applies. GUI drift is now enforced by
  # `vox ci gui-catalog-parity`, `gui-surface-coverage`, and `gui-version-sync`.

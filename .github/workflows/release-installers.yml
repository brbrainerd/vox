name: Release Installers

# The build/syntax-check jobs (voxup build, install.sh/.ps1 syntax, MSI/DEB/brew
# packaging) run on every `v*` tag push and are useful signal on their own.
#
# The "E2E — ... (tag runs only)" steps below are a different story: they download
# the *just-tagged* release from GitHub Releases (voxup install / install.sh /
# install.ps1 full bootstrap). release-binaries.yml and bundle-release.yml publish
# with `draft: true` (required — see AGENTS.md release-safety rule), so at tag-push
# time there is no public release for them to fetch: `/releases/latest` 404s, or an
# `-rc.<n>` tag never resolves at all. That is unfixable without publishing a real
# release automatically, which is forbidden. Making these E2E steps green would mean
# either faking a release (defeats the point of the test) or auto-publishing
# (forbidden) — so instead of failing on every tag push (5/5 measured), they now
# require an explicit manual opt-in via workflow_dispatch, to be run by a release
# manager once an actual public release exists to test against.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      run_e2e_downloads:
        description: "Run the GitHub-Releases-downloading E2E steps (voxup install, install.sh/.ps1 full bootstrap). Only meaningful once a real, non-draft release exists for the target tag."
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-voxup-installer:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        # fetch-depth: 0 — vox-build-meta derives the build number from
        # `git rev-list --count HEAD`; checkout defaults to depth 1, which
        # made every shipped binary report `+build.1`.
        with:
          fetch-depth: 0
      - name: Install Rust
        # Pinned, not @stable: shipped artifacts must be built by the same compiler
        # CI gates use (rust-toolchain.toml). @stable also imports each new
        # release's lint wave — see AGENTS.md §Perennial Bug Patterns.
        uses: ./.github/actions/setup-rust
      - name: Install system deps (libdbus/GTK)
        # voxup pulls in glib-sys transitively -- same gap build-linux-deb
        # already has a fix for. Linux-only; macOS doesn't need it.
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y libdbus-1-dev pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Build voxup
        run: cargo build --release -p voxup
      - name: Smoke — voxup --help (all branches)
        run: |
          ./target/release/voxup --help
          ./target/release/voxup install --help
          ./target/release/voxup update --help
          ./target/release/voxup proxy --help

      - name: E2E — voxup install (downloads from GitHub, manual opt-in only)
        if: github.event_name == 'workflow_dispatch' && inputs.run_e2e_downloads == true
        run: |
          export HOME=/tmp/fake_home
          mkdir -p $HOME
          ./target/release/voxup install default
          if [ ! -f "$HOME/.vox/bin/vox" ]; then
            echo "FAIL: ~/.vox/bin/vox not found"
            exit 1
          fi
          version=$("$HOME/.vox/bin/vox" --version 2>&1)
          echo "Installed: $version"
          if ! echo "$version" | grep -qE '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: --version did not return semver"
            exit 1
          fi

      - name: E2E — voxup update (no-op, manual opt-in only)
        if: github.event_name == 'workflow_dispatch' && inputs.run_e2e_downloads == true
        run: |
          export HOME=/tmp/fake_home
          ./target/release/voxup update
  build-windows-msi:
    runs-on: windows-latest
    # cargo wix --no-build now runs a real `cargo build --profile dist` first
    # (fat LTO, codegen-units=1) -- a measured 86m on this workspace for the
    # sibling jobs below. 45m was sized when this job had no build step at
    # all (--no-build against nothing); raised to match.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        # fetch-depth: 0 — vox-build-meta derives the build number from
        # `git rev-list --count HEAD`; checkout defaults to depth 1, which
        # made every shipped binary report `+build.1`.
        with:
          fetch-depth: 0
      - name: Install Rust
        # Pinned, not @stable: shipped artifacts must be built by the same compiler
        # CI gates use (rust-toolchain.toml). @stable also imports each new
        # release's lint wave — see AGENTS.md §Perennial Bug Patterns.
        uses: ./.github/actions/setup-rust
      - name: Install cargo-wix
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-wix
      - name: Build the dist binary
        # `--no-build` below expects target/dist/vox.exe + vox-compilerd.exe to
        # already exist. Without this step, `cargo wix` links `light.exe`
        # against nonexistent files and fails with exit 103 (LGHT0103,
        # file-not-found). Features must match the shipped binary --
        # release_build.rs adds `heavy-retrieval` for the real release build.
        run: cargo build --profile dist --locked -p vox-cli --features heavy-retrieval
      - name: Build MSI
        run: cargo wix --no-build --profile dist --package vox-cli
      - name: Upload MSI artifact
        # Built and immediately discarded when the runner tears down unless
        # captured here -- this job previously had no persistence step at
        # all, so it reported green while producing zero durable output.
        uses: actions/upload-artifact@v7
        with:
          name: installer-windows-msi
          path: target/wix/*.msi
          if-no-files-found: error

  build-linux-deb:
    runs-on: ubuntu-latest
    # cargo-deb builds the crate itself (no --no-build), and --profile dist means
    # lto="fat" + codegen-units=1 — a measured 86m on this workspace. 30m was the
    # thin-LTO budget; raised to match the other single-fat-LTO-link jobs.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        # fetch-depth: 0 — vox-build-meta derives the build number from
        # `git rev-list --count HEAD`; checkout defaults to depth 1, which
        # made every shipped binary report `+build.1`.
        with:
          fetch-depth: 0
      - name: Install Rust
        # Pinned, not @stable: shipped artifacts must be built by the same compiler
        # CI gates use (rust-toolchain.toml). @stable also imports each new
        # release's lint wave — see AGENTS.md §Perennial Bug Patterns.
        uses: ./.github/actions/setup-rust
      - name: Install cargo-deb
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Install system deps (libdbus/GTK)
        run: sudo apt-get update -y && sudo apt-get install -y libdbus-1-dev pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Build DEB
        run: cargo deb -p vox-cli --profile dist
      - name: Upload DEB artifact
        # cargo-deb's output path varies with --profile (target/debian/ for
        # the default profile, target/<profile>/debian/ for a custom one) --
        # glob covers both without needing to pin the exact convention.
        uses: actions/upload-artifact@v7
        with:
          name: installer-linux-deb
          path: target/**/debian/*.deb
          if-no-files-found: error

  publish-macos-brew:
    runs-on: macos-latest
    # --profile dist is lto="fat" + codegen-units=1; the 30m budget was sized for
    # thin LTO and would cancel this job before the tarball is ever produced.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        # fetch-depth: 0 — vox-build-meta derives the build number from
        # `git rev-list --count HEAD`; checkout defaults to depth 1, which
        # made every shipped binary report `+build.1`.
        with:
          fetch-depth: 0
      - name: Build Release
        run: cargo build --profile dist --locked -p vox-cli
      - name: Archive and Hash
        run: |
          tar -czvf vox-darwin.tar.gz -C target/dist vox
          shasum -a 256 vox-darwin.tar.gz > checksum.txt
      - name: Upload macOS artifact
        # This job previously ended here with a stub step that only echoed a
        # message -- nothing was ever uploaded anywhere (not to a release,
        # not even as a workflow artifact). This makes the built tarball a
        # real, downloadable asset. It does NOT dispatch to a Homebrew tap
        # repo (vox-foundation/homebrew-vox) -- that integration was never
        # implemented and is out of scope here; tracked as a known gap.
        uses: actions/upload-artifact@v7
        with:
          name: installer-macos-brew
          path: |
            vox-darwin.tar.gz
            checksum.txt
          if-no-files-found: error

  test-bootstrap-unix:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        # fetch-depth: 0 — vox-build-meta derives the build number from
        # `git rev-list --count HEAD`; checkout defaults to depth 1, which
        # made every shipped binary report `+build.1`.
        with:
          fetch-depth: 0

      - name: Verify install.sh POSIX syntax
        run: |
          sh -n scripts/install.sh
          echo "install.sh syntax OK"

      - name: Install Rust
        # Pinned, not @stable: shipped artifacts must be built by the same compiler
        # CI gates use (rust-toolchain.toml). @stable also imports each new
        # release's lint wave — see AGENTS.md §Perennial Bug Patterns.
        uses: ./.github/actions/setup-rust
      - name: Install system deps (libdbus/GTK)
        # voxup pulls in glib-sys transitively -- same gap build-linux-deb
        # already has a fix for. Linux-only; macOS doesn't need it.
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y libdbus-1-dev pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Build voxup (for E2E bootstrap test)
        run: cargo build --release -p voxup

      - name: E2E — install.sh full (manual opt-in only)
        if: github.event_name == 'workflow_dispatch' && inputs.run_e2e_downloads == true
        run: |
          export HOME=/tmp/fake_home_bootstrap
          mkdir -p $HOME
          sh scripts/install.sh
          if [ ! -f "$HOME/.vox/bin/vox" ]; then
            echo "FAIL: ~/.vox/bin/vox not found after install.sh"
            exit 1
          fi
          version=$("$HOME/.vox/bin/vox" --version 2>&1)
          echo "Installed vox: $version"
          if ! echo "$version" | grep -qE '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: vox --version did not return semver"
            exit 1
          fi
          if [ ! -f "$HOME/.vox/bin/voxup" ]; then
            echo "FAIL: ~/.vox/bin/voxup not found — install.rs did not place voxup"
            exit 1
          fi

  test-bootstrap-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        # fetch-depth: 0 — vox-build-meta derives the build number from
        # `git rev-list --count HEAD`; checkout defaults to depth 1, which
        # made every shipped binary report `+build.1`.
        with:
          fetch-depth: 0

      - name: Verify install.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path 'scripts\install.ps1').Path,
              [ref]$null,
              [ref]$errors
          )
          if ($errors) {
              $errors | ForEach-Object { Write-Host "ParseError: $($_.Message)" }
              exit 1
          }
          Write-Host "install.ps1 syntax OK"

      - name: E2E — install.ps1 full (manual opt-in only)
        if: github.event_name == 'workflow_dispatch' && inputs.run_e2e_downloads == true
        shell: pwsh
        run: |
          $fakeHome = "$env:TEMP\fake_home_bootstrap"
          New-Item -ItemType Directory -Force -Path $fakeHome | Out-Null
          $env:USERPROFILE = $fakeHome
          $env:HOMEDRIVE = Split-Path $fakeHome -Qualifier
          $env:HOMEPATH  = Split-Path $fakeHome -NoQualifier
          .\scripts\install.ps1
          $vox = "$fakeHome\.vox\bin\vox.exe"
          if (-not (Test-Path $vox)) {
              Write-Host "FAIL: $vox not found after install.ps1"
              exit 1
          }
          $version = & $vox --version 2>&1
          Write-Host "Installed vox: $version"
          if ($version -notmatch '\d+\.\d+\.\d+') {
            Write-Host "FAIL: vox --version did not return semver"
            exit 1
          }
          $voxup = "$fakeHome\.vox\bin\voxup.exe"
          if (-not (Test-Path $voxup)) {
            Write-Host "FAIL: $voxup not found — install.rs did not place voxup.exe"
            exit 1
          }

  publish:
    name: Attach installers to GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-windows-msi, build-linux-deb, publish-macos-brew]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: installer-artifacts

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          # Not installer-artifacts/*/* -- confirmed via a real tag push that
          # the .deb artifact preserves cargo-deb's full nested output path
          # (target/<target-triple>/debian/*.deb) inside the uploaded
          # artifact, so a 2-level glob silently missed it entirely and
          # fail_on_unmatched_files: false let the job report success anyway
          # with the .deb never attached to the release.
          files: installer-artifacts/**/*
          fail_on_unmatched_files: false
          # This job attaches to the SAME tag's release release-binaries.yml
          # publishes -- softprops/action-gh-release is idempotent per tag,
          # whichever workflow's publish job runs first creates the release,
          # the other appends. Same "latest" exposure this repo's other
          # publish job guards against (see release-binaries.yml's publish
          # step comment) -- a hyphenated tag (v1.2.3-rc1, v0.0.0-test) is a
          # prerelease and never becomes "latest"; a plain tag is real.
          # No public release is published from this repo; drafts are
          # promoted by hand. release-binaries.yml carries the same guard.
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}

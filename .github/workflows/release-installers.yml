name: Release Installers

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-voxup-installer:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build voxup
        run: cargo build --release -p voxup
      - name: Smoke — voxup --help (all branches)
        run: |
          ./target/release/voxup --help
          ./target/release/voxup install --help
          ./target/release/voxup update --help
          ./target/release/voxup proxy --help

      - name: E2E — voxup install (downloads from GitHub, tag runs only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          export HOME=/tmp/fake_home
          mkdir -p $HOME
          ./target/release/voxup install default
          if [ ! -f "$HOME/.vox/bin/vox" ]; then
            echo "FAIL: ~/.vox/bin/vox not found"
            exit 1
          fi
          version=$("$HOME/.vox/bin/vox" --version 2>&1)
          echo "Installed: $version"
          if ! echo "$version" | grep -qE '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: --version did not return semver"
            exit 1
          fi

      - name: E2E — voxup update (no-op, tag runs only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          export HOME=/tmp/fake_home
          ./target/release/voxup update
  build-windows-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-wix
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-wix
      - name: Build MSI
        run: cargo wix --no-build --package vox-cli
        # Note: In a real pipeline, `cargo build --release --locked -p vox-cli` 
        # would be run first to populate target/release/vox.exe.

  build-linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deb
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Build DEB
        run: cargo deb -p vox-cli

  publish-macos-brew:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Release
        run: cargo build --release --locked -p vox-cli
      - name: Archive and Hash
        run: |
          tar -czvf vox-darwin.tar.gz -C target/release vox
          shasum -a 256 vox-darwin.tar.gz > checksum.txt
      - name: Upload to Homebrew Tap
        run: |
          echo "Simulating Homebrew Tap update..."
          # Logic to dispatch repository event to vox-foundation/homebrew-vox

name: Setup Pipeline E2E

on:
  push:
    branches: [main]
    paths:
      - 'scripts/setup.vox'
      - 'scripts/**/setup*.vox'
      - '.github/workflows/setup-e2e.yml'
  schedule:
    - cron: '0 2 * * *' # Run nightly (cross-platform clean-room; not per-PR)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-setup:
    name: Clean Room Setup + Idempotency
    runs-on: ${{ matrix.os }}
    # Backstop for a hang GitHub's own default (360m) doesn't catch fast enough
    # (2026-07-29 incident: the windows-latest Idempotency step ran past 2h
    # with no job-level timeout at all, squatting a runner slot). 90m gives
    # room for a genuinely cold clean-room Windows build (measured: first run
    # alone took 57m) plus the second run, while still bounding a real hang.
    # The Linux-only `timeout 600s` wrapper below stays as a tighter
    # inner guard where it's available; this is the guard for every OS.
    timeout-minutes: 90
    strategy:
      # Run all three OSes to completion — a failure on one must not cancel the
      # others (that previously hid per-OS clean-room failures behind a single
      # fail-fast cancellation).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # Strip pre-installed toolchains to ensure setup.vox works from scratch
      - name: Strip runner (Clean Room)
        shell: bash
        run: |
          rustup self uninstall -y || true
          rm -rf ~/.cargo || true
          # Node and other pre-installed tools might exist, but setup.vox should 
          # detect them or reinstall/warn if incorrect. 

      - name: Bootstrap vox runtime
        # Since we removed rustup, we need it just enough to run `cargo run -p vox-cli`
        # In reality, users have the CLI binary from voxup, or they use cargo. 
        # For this test, we re-install the bare minimum stable rust to compile vox-cli.
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env" || export PATH="$HOME/.cargo/bin:$PATH"
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps (libdbus/GTK)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update -y && sudo apt-get install -y libdbus-1-dev pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Run setup.vox (First run - Provision)
        shell: bash
        run: |
          source "$HOME/.cargo/env" || export PATH="$HOME/.cargo/bin:$PATH"
          cargo run -p vox-cli --features script-execution -- run scripts/setup.vox

      - name: Run setup.vox (Second run - Idempotency)
        # The second run re-runs the full script (including `cargo check
        # --workspace`, which is cached but not instant, plus install-hooks). The
        # timeout is a hang safety-net, not a speed assertion — 10s was far too
        # short and killed a healthy run. 600s is generous while still catching a
        # genuine hang. (`timeout` is GNU coreutils; skip it on Windows bash.)
        shell: bash
        run: |
          source "$HOME/.cargo/env" || export PATH="$HOME/.cargo/bin:$PATH"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            timeout 600s cargo run -p vox-cli --features script-execution -- run scripts/setup.vox
          else
            cargo run -p vox-cli --features script-execution -- run scripts/setup.vox
          fi

      # `populi` is a NON-DEFAULT feature of vox-ml-cli, so a bare
      # `cargo install --path crates/vox-ml-cli` produces a binary whose
      # `populi` subcommand is cfg'd out — the exact rot this branch had to fix,
      # and the reason vox-cli's delegation error path (crates/vox-cli/src/main.rs)
      # spells the `--features populi` install out for the user. This clean-room
      # leg is what stops it rotting again on macOS: install the mesh CLI with
      # the feature on, then prove `vox`'s delegation resolves the subcommand.
      # `vox populi` spawns `vox-ml-cli` from PATH, so the install above is what
      # the delegation actually resolves against.
      - name: Mesh CLI installs and answers
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env" || export PATH="$HOME/.cargo/bin:$PATH"
          cargo install --path crates/vox-ml-cli --features populi --locked --debug
          vox-ml-cli --help | grep -q populi
          # setup.vox does not `cargo install` vox onto PATH, so invoke the debug
          # binary the two runs above already built (vox-cli's `default-run`).
          ./target/debug/vox populi --help

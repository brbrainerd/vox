name: Setup Pipeline E2E

on:
  push:
    branches: [main]
    paths:
      - 'scripts/setup.vox'
      - 'scripts/**/setup*.vox'
      - '.github/workflows/setup-e2e.yml'
  schedule:
    - cron: '0 2 * * *' # Run nightly (cross-platform clean-room; not per-PR)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-setup:
    name: Clean Room Setup + Idempotency
    runs-on: ${{ matrix.os }}
    strategy:
      # Run all three OSes to completion — a failure on one must not cancel the
      # others (that previously hid per-OS clean-room failures behind a single
      # fail-fast cancellation).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      # Strip pre-installed toolchains to ensure setup.vox works from scratch
      - name: Strip runner (Clean Room)
        shell: bash
        run: |
          rustup self uninstall -y || true
          rm -rf ~/.cargo || true
          # Node and other pre-installed tools might exist, but setup.vox should 
          # detect them or reinstall/warn if incorrect. 

      - name: Bootstrap vox runtime
        # Since we removed rustup, we need it just enough to run `cargo run -p vox-cli`
        # In reality, users have the CLI binary from voxup, or they use cargo. 
        # For this test, we re-install the bare minimum stable rust to compile vox-cli.
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env" || export PATH="$HOME/.cargo/bin:$PATH"
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Run setup.vox (First run - Provision)
        shell: bash
        run: |
          source "$HOME/.cargo/env" || export PATH="$HOME/.cargo/bin:$PATH"
          cargo run -p vox-cli --features script-execution -- run scripts/setup.vox

      - name: Run setup.vox (Second run - Idempotency)
        # The second run re-runs the full script (including `cargo check
        # --workspace`, which is cached but not instant, plus install-hooks). The
        # timeout is a hang safety-net, not a speed assertion — 10s was far too
        # short and killed a healthy run. 600s is generous while still catching a
        # genuine hang. (`timeout` is GNU coreutils; skip it on Windows bash.)
        shell: bash
        run: |
          source "$HOME/.cargo/env" || export PATH="$HOME/.cargo/bin:$PATH"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            timeout 600s cargo run -p vox-cli --features script-execution -- run scripts/setup.vox
          else
            cargo run -p vox-cli --features script-execution -- run scripts/setup.vox
          fi

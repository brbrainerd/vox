name: Docs Link Checker

on:
  # push:main dropped (runner-remediation Task 9) — link checking is a network
  # job that belongs on the nightly schedule, not on every main push.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-links:
    # Moved off self-hosted (runner-remediation Task 9) — lychee is a pure
    # network job; local exclude-paths become harmless no-ops on a clean clone.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Exclude gitignored trees that exist locally (worktrees, npm) so `**/*.md` matches a clean clone.
          # NOTE: lychee's --exclude-path takes regex, not shell globs; `**` is invalid regex.
          args: --root-dir . --verbose --no-progress --max-retries 5 --retry-wait-time 5 --timeout 40 --exclude-path docs/src/archive --exclude-path '\.claude/' --exclude-path 'assets/skills/' --exclude-path 'node_modules/' '**/*.md'
          fail: true

      - name: Link Checker Guidance
        if: failure()
        run: |
          echo "::error title=Link Checker Failure::Broken links were detected. Please review the output above."
          echo "::notice title=Whitelist Guidance::To ignore a persistent or archival link, add it to the project whitelist."
          echo "Whitelist Location: .lycheeignore"
          echo "Action Required: Decide if the link should be fixed in Markdown or added to the whitelist for archival maintenance."

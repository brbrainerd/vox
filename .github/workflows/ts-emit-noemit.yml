name: TS emit typecheck
on:
  push:
    branches: [main]
    paths:
      - 'crates/vox-codegen/**'
      - 'crates/vox-codegen-ts/**'
      - 'crates/vox-compiler/**'
      - 'examples/golden-ts/**'
      - 'crates/vox-integration-tests/tests/ts_emit_*.rs'
      - 'crates/vox-integration-tests/ts-noemit-scratch/**'
  pull_request:
    paths:
      - 'crates/vox-codegen/**'
      - 'crates/vox-codegen-ts/**'
      - 'crates/vox-compiler/**'
      - 'examples/golden-ts/**'
      - 'crates/vox-integration-tests/tests/ts_emit_*.rs'
      - 'crates/vox-integration-tests/ts-noemit-scratch/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts-noemit:
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install system deps (dbus/GTK for wry/keyring/soup on Linux)
        run: sudo apt-get update -y && sudo apt-get install -y libdbus-1-dev pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'crates/vox-integration-tests/ts-noemit-scratch/pnpm-lock.yaml'
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - name: Install scratch deps
        run: pnpm install --frozen-lockfile
        working-directory: crates/vox-integration-tests/ts-noemit-scratch
      - name: Run TS emit typecheck (positive gate)
        run: cargo nextest run -p vox-integration-tests --test ts_emit_typecheck_test --run-ignored ignored-only --no-capture
      - name: Run TS emit negative control (proves the gate fails on bad TS)
        run: cargo nextest run -p vox-integration-tests --test ts_emit_negative_control_test --run-ignored ignored-only --no-capture

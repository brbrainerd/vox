# Secret scan (gitleaks)
#
# Scans the repository (and PR/commit history) for committed secrets.
#
# Note: gitleaks-action is free for public repositories. For organization-owned
# repos a GITLEAKS_LICENSE secret may be required; set it as an env var on the
# scan step if your org account needs it.
name: "Secret scan (gitleaks)"

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily at 05:00 UTC.
    - cron: "0 5 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Run the MIT-licensed gitleaks CLI directly rather than
      # `gitleaks/gitleaks-action@v2`, which requires a paid `GITLEAKS_LICENSE`
      # for organization-owned repos. The CLI is the same scanner with no license
      # gate; it fails the job (exit 1) on any finding — exactly what a gate needs.
      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Scan the working tree (`dir`) rather than full history (`git`): a PR gate
      # should flag secrets being *added*, not re-litigate every historical
      # commit. gitleaks auto-discovers `.gitleaks.toml` at the repo root, which
      # allowlists docs/test/fixture placeholders.
      - name: Gitleaks scan
        run: gitleaks dir . --redact --verbose --exit-code 1

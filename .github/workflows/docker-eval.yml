name: Build & Push vox-eval Docker Image

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "patches/**"
      - "vox-eval.compose.yml"
      - ".github/workflows/docker-eval.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: vox-foundation/vox-eval

jobs:
  build-and-push:
    name: Build vox-eval image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=main-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers between builds using the registry
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline
          build-args: |
            VOX_CLI_FEATURES=mcp-server

      # Report-only container vulnerability scan of the image we just pushed.
      # exit-code: '0' means findings are surfaced in the job log but never fail
      # the build. Once the image is clean, tighten this to exit-code: '1' to
      # make CRITICAL/HIGH vulnerabilities merge-blocking.
      - name: Scan image for vulnerabilities (Trivy, report-only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

# CodeQL
#
# Static security analysis for Rust and JavaScript/TypeScript.
#
# Rust CodeQL support is now GA. CodeQL's Rust extractor relies on build tracing,
# so we run an explicit `cargo build` for the rust language instead of autobuild.
# If GitHub's "default setup" for CodeQL is enabled on this repo it can conflict
# with this advanced (workflow-defined) setup; disable the default setup under
# Settings -> Security -> Code scanning if you see duplicate or failing analyses.
name: "CodeQL"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 04:30 UTC.
    - cron: "30 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Cache Rust build
        if: matrix.language == 'rust'
        uses: Swatinem/rust-cache@v2

      # `cargo build --workspace` pulls system libraries transitively:
      #   - `libdbus-sys` (keyring / secret-service, default `keyring-store` feature)
      #   - the GTK/WebKit stack (`webkit2gtk-sys`, `gtk`, `gdk`, …) from the
      #     Tauri GUI backend.
      # ubuntu-latest ships only the runtimes, not the `-dev` headers pkg-config
      # needs, so the build scripts fail without these. The WebKit/GTK set mirrors
      # `release-gui.yml`; other CI lanes run on images that already include them.
      - name: Install system dependencies (rust)
        if: matrix.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libdbus-1-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev

      # CodeQL's Rust extractor uses build tracing, so build explicitly.
      # Exclude `vox-gui`: its `tauri::generate_context!()` macro fails at compile
      # time unless the web frontend (`ui/dist`) has been built first, which this
      # analysis job does not do. vox-gui is a thin Tauri shell — the Rust logic
      # CodeQL needs to analyze lives in the (still-built) backend crates.
      - name: Build (rust)
        if: matrix.language == 'rust'
        run: cargo build --workspace --exclude vox-gui

      - name: Autobuild
        if: matrix.language != 'rust'
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

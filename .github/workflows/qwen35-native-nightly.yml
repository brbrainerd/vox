name: Qwen3.5 Native Nightly

on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  qwen35-native-smoke:
    name: Native Qwen3.5 smoke ladder
    runs-on: [self-hosted, linux]
    # The training step itself is bounded (--max-runtime-secs 300), but build
    # + corpus-prep steps aren't — without this, a hang defaults to GitHub's
    # 360-min job timeout, squatting a scarce self-hosted/GPU runner slot for
    # up to 6h and starving the other nightlies (2026-07-27 audit finding).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build vox-cli
        # GPU training is loaded at runtime via the vox-plugin-mens-candle-cuda
        # cdylib plugin (selected by `--device cuda` below), NOT a vox-cli compile
        # feature. `vox-cli` has no `gpu` feature; the old `--features gpu` was a
        # no-op-at-best / hard cargo error. See build-and-crate-org-improvement-plan-2026-06.md.
        run: cargo build -p vox-cli

      - name: Prepare Mens corpus mix inputs
        run: cargo run -p vox-cli --quiet -- run --interp scripts/ci/corpus_prep.vox

      - name: Mix corpus (strict)
        run: cargo run -p vox-cli --quiet -- mens corpus mix --config mens/config/mix.yaml

      - name: Qwen3.5-0.8B native smoke
        run: |
          cargo run -p vox-cli -- mens train \
            --backend qlora \
            --tokenizer hf \
            --preset qwen_4080_16g \
            --model Qwen/Qwen3.5-0.8B \
            --device cuda \
            --data-dir target/dogfood \
            --output-dir mens/runs/qwen35_native_nightly_0p8b \
            --seq-len 128 \
            --checkpoint-every 1 \
            --max-runtime-secs 300 \
            --require-gpu \
            --qlora-require-full-proxy-stack

      - name: Upload nightly smoke artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: qwen35-native-nightly
          path: |
            mens/runs/qwen35_native_nightly_0p8b/training_manifest.json
            mens/runs/qwen35_native_nightly_0p8b/telemetry.jsonl
            mens/runs/qwen35_native_nightly_0p8b/checkpoint_state.json

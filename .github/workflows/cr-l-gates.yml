# CR-L gate umbrella — runs `vox audit --gate all` on every PR + nightly.
#
# Per `docs/superpowers/specs/2026-05-21-v1-honest-completion-plan.md` §1.3,
# this is the workflow that enforces the v1.0 acceptance bar:
# `cargo run -p vox-cli -- audit --gate all --strict-block-ga` exits 0 iff
# every block-GA gate reports `threshold.met == true && incomplete == false`.
#
# Posts the canonical snapshot (`contracts/reports/_snapshot/<UTC>.json`) and
# every per-gate report (`contracts/reports/<gate>/<UTC>.json`) as workflow
# artifacts so reviewers can audit the numbers without re-running locally.
#
# Two jobs:
#   - `umbrella`: runs `--gate all` with `--strict-block-ga`. Fails the PR
#     if any block-GA gate is unmet. This is the canonical v1.0 gate.
#   - `arch-check-evidence`: runs `vox-arch-check` (which includes the
#     evidence-ledger lint as Rule 14). Defaults to warn-only until the
#     block-GA gates are met by real measurements — see the §10 acceptance
#     of the honest completion plan for the strict-flip trigger.

name: CR-L gates

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'crates/vox-audit/**'
      - 'crates/vox-arch-check/**'
      - 'crates/vox-cli/src/commands/audit.rs'
      - 'contracts/eval/**'
      - 'contracts/reports/evidence-ledger.v1.json'
      - 'docs/src/architecture/vox-as-llm-target-audit-and-plan-2026.md'
      - 'docs/src/architecture/v1-release-criteria.md'
      - '.github/workflows/cr-l-gates.yml'
  schedule:
    # Nightly at 06:00 UTC. Catches the case where a fixture grows stale
    # or a CR-L8 corpus-feedback artifact ages past its 90-day window.
    - cron: '0 6 * * *'

# A schedule-triggered run and a push-to-main-triggered run both resolve
# github.ref to refs/heads/main, so a plain `${{ github.workflow }}-${{ github.ref }}`
# group put the nightly cron leg in the SAME concurrency group as every push to
# main — any merge landing while the nightly run was still going cancelled it
# outright (measured: 28/28 cancelled, ALL-CANCELLED per wf-health-measured.tsv).
# Give scheduled runs their own group so a push to main can no longer cancel
# the nightly leg (or vice versa); PR-triggered runs keep their own
# per-PR-ref group and continue to supersede each other as intended.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  umbrella:
    name: vox audit --gate all --strict-block-ga
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cr-l-gates-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system deps (dbus/GTK required by wry/keyring on Linux)
        # `|| true` on update only: this shared self-hosted runner has other
        # jobs' apt sources registered (e.g. deb.nodesource.com for Node
        # setup), and a transient failure fetching ANY configured repo's
        # metadata fails the whole `apt-get update` even though every
        # package this step installs comes from the official Ubuntu
        # archive. Found live 2026-07-27: nodesource 403'd, and the block
        # this caused (every downstream step in the job skipped) hid the
        # fix for the CR-L product-gate binaries never being built.
        run: sudo apt-get update -y || true; sudo apt-get install -y libdbus-1-dev pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Build vox-cli
        run: cargo build -p vox-cli --bin vox

      - name: Build CR-L product-gate binaries (cr-a1/a2/a4/d3/e1/e2/p1/p2)
        # `vox audit --gate all --strict-block-ga` resolves these as sibling
        # binaries next to `vox` itself (crates/vox-audit/src/ga.rs
        # product_binary_gates: same target/ dir, current_exe()'s parent) --
        # they're feature-gated behind vox-audit's `ci-gates` feature and were
        # never built here, so every one of the 8 product-binary gates
        # silently reported exit_code=-1 ("binary not found") regardless of
        # whether the underlying check actually passed (found live 2026-07-27:
        # cr-d3 passes 100% when run directly, but this workflow's snapshot
        # showed it as unmet/-1 because the binary plain didn't exist).
        run: cargo build -p vox-audit --bins --features ci-gates

      - name: Run audit umbrella (strict)
        id: umbrella
        # CR-L gates that require an LLM panel (CR-L0/L1/L2/L3/L4) operate
        # in corpus-validity mode without OPENROUTER_API_KEY; the snapshot
        # records `incomplete: true` on those rows. `--strict-block-ga`
        # fails only on block-GA gates that are unmet — that's the v1.0
        # acceptance bar.
        run: |
          target/debug/vox audit --gate all --strict-block-ga
        continue-on-error: true

      - name: Upload canonical snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cr-l-gates-snapshot-${{ github.sha }}
          path: |
            contracts/reports/_snapshot/
            contracts/reports/audit-all/

      - name: Upload per-gate reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cr-l-per-gate-reports-${{ github.sha }}
          path: |
            contracts/reports/humaneval/
            contracts/reports/mens-on-distribution/
            contracts/reports/repair-corpus/
            contracts/reports/plan-fidelity/
            contracts/reports/aci-default/
            contracts/reports/retirement/
            contracts/reports/deploy/
            contracts/reports/corpus-feedback/
            contracts/reports/spec-to-app/

      - name: Fail if umbrella reported block-GA violations
        if: steps.umbrella.outcome == 'failure'
        run: |
          echo "::error::vox audit --strict-block-ga reported violations."
          echo "::error::See the cr-l-gates-snapshot artifact for the snapshot JSON."
          echo "::error::Per docs/superpowers/specs/2026-05-21-v1-honest-completion-plan.md §10,"
          echo "::error::no 'v1.0 ready' claim is permitted until this job exits 0."
          exit 1

  arch-check-evidence:
    name: vox-arch-check evidence-ledger lint
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-arch-check-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system deps (dbus/GTK required by wry/keyring on Linux)
        # `|| true` on update only: this shared self-hosted runner has other
        # jobs' apt sources registered (e.g. deb.nodesource.com for Node
        # setup), and a transient failure fetching ANY configured repo's
        # metadata fails the whole `apt-get update` even though every
        # package this step installs comes from the official Ubuntu
        # archive. Found live 2026-07-27: nodesource 403'd, and the block
        # this caused (every downstream step in the job skipped) hid the
        # fix for the CR-L product-gate binaries never being built.
        run: sudo apt-get update -y || true; sudo apt-get install -y libdbus-1-dev pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      # Warn-only until the block-GA gates are met by real measurements
      # (per the honest plan §10 acceptance). Adding `--strict-evidence`
      # then turns missing/stale-artifact findings into a strict failure.
      - name: Run vox-arch-check
        run: cargo run --release -p vox-arch-check

name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs-astro/**'
      - 'crates/vox-doc-pipeline/**'
      - 'examples/**'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Permissions ────────────────────────────────────────────────────────────
# GitHub Pages requires pages: write + id-token: write.
permissions:
  pages: write
  id-token: write

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install system deps (libdbus/GTK)
        run: sudo apt-get update -y && sudo apt-get install -y libdbus-1-dev pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Build Docs Pipeline
        run: cargo build -p vox-doc-pipeline --profile ci
        env:
          RUSTC_WRAPPER: sccache

      - name: Run Docs Pipeline (extract + validate SUMMARY)
        run: cargo run -p vox-doc-pipeline
        env:
          SOURCE_DATE_EPOCH: ${{ github.event.head_commit.timestamp }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install docs-astro deps
        working-directory: docs-astro
        run: pnpm install --frozen-lockfile

      - name: Build Starlight
        working-directory: docs-astro
        run: pnpm build

      - name: Run Lychee Link Checker for UI
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: --root-dir docs-astro/dist --verbose --no-progress --format json --output docs-astro/lychee_report.json 'docs-astro/dist/**/*.html'
          fail: false

      - name: Link Checker Guidance
        run: |
          if grep -q '"errors": [1-9]' docs-astro/lychee_report.json; then
            echo "::warning title=Broken Links Warning::Documentation contains broken links."
            echo "::notice title=Whitelist Guidance::To ignore a persistent or archival link, add it to .lycheeignore."
          fi

      # ── Archive docs artifact ───────────────────────────────────────────
      - name: Archive docs
        run: tar -czf docs.tar.gz docs-astro/dist/

      # ── GitHub Pages Deploy ─────────────────────────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-astro/dist

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ── Cloudflare Pages Deploy (parallel to GH Pages during cutover) ─────────
  # After CF Pages is stable, the GH Pages job above can be removed (see
  # docs/superpowers/plans/2026-05-23-voxlang-hosting-docs-overhaul.md Phase Z).
  deploy-cloudflare:
    name: Deploy to Cloudflare Pages
    needs: build-docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install system deps (libdbus/GTK)
        run: sudo apt-get update -y && sudo apt-get install -y libdbus-1-dev pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Build Docs Pipeline
        run: cargo build -p vox-doc-pipeline --profile ci
        env:
          RUSTC_WRAPPER: sccache

      - name: Run Docs Pipeline (extract + validate SUMMARY)
        run: cargo run -p vox-doc-pipeline
        env:
          SOURCE_DATE_EPOCH: ${{ github.event.head_commit.timestamp }}

      - name: Install docs-astro deps
        working-directory: docs-astro
        run: pnpm install --frozen-lockfile

      - name: Build Starlight
        working-directory: docs-astro
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        working-directory: docs-astro
        run: npx wrangler pages deploy dist --project-name=vox-docs --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  # ── Live site smoke test (runs after CF deploy completes) ────────────────
  smoke-test:
    name: Smoke test live site
    needs: deploy-cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install docs-astro deps
        working-directory: docs-astro
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        working-directory: docs-astro
        run: npx playwright install chromium --with-deps
      - name: Wait for CF Pages propagation
        run: sleep 30
      - name: Run smoke test
        working-directory: docs-astro
        run: npx playwright test tests/smoke.spec.ts
        env:
          BASE_URL: https://voxlang.org

  # ── Failure visibility ─────────────────────────────────────────────────────
  # docs-deploy.yml has no other failure signal anywhere (no if: failure()
  # step, nothing watching it via workflow_run). Without this, a broken
  # deploy fails silently and voxlang.org keeps serving a stale build.
  notify-on-failure:
    name: Notify on docs deploy failure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-docs, deploy-pages, deploy-cloudflare, smoke-test]
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Open or update a tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create docs-deploy-broken --color d73a4a --description "docs-deploy.yml is failing on main" --repo "${{ github.repository }}" 2>/dev/null || true
          existing=$(gh issue list --repo "${{ github.repository }}" --label docs-deploy-broken --state open --json number --jq '.[0].number // empty')
          body="docs-deploy.yml failed on main. Latest failing run: ${RUN_URL}"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "docs-deploy is failing on main" --body "$body" --label docs-deploy-broken
          fi


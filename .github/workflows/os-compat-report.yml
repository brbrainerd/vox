name: OS Compatibility Report
on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday at 06:00 UTC
  workflow_dispatch:
  # push:main dropped (runner-remediation Task 9) — this observational report
  # belongs on the weekly schedule, not contending for self-hosted slots per push.

concurrency:
  group: os-compat-report
  cancel-in-progress: true

jobs:
  scan:
    name: OS compatibility scan
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Run OS compatibility scanner
        run: python scripts/coverage-graph/os_compat.py --repo-root . --out graphify-out/OS_COMPATIBILITY.md

      - name: Upload report artifact
        uses: actions/upload-artifact@v7
        with:
          name: os-compat-report-${{ github.run_number }}
          path: graphify-out/OS_COMPATIBILITY.md
          if-no-files-found: warn

      - name: Print summary
        run: |
          echo "## OS Compatibility Summary" >> $GITHUB_STEP_SUMMARY
          python -c "
          from pathlib import Path
          lines = Path('graphify-out/OS_COMPATIBILITY.md').read_text().splitlines()
          for l in lines[:30]:
              print(l)
          " >> $GITHUB_STEP_SUMMARY || true

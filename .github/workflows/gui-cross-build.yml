name: GUI Cross-Platform Build (Win/macOS/Ubuntu)

on:
  pull_request:
    paths:
      - 'crates/vox-gui/**'
      - '.github/workflows/gui-cross-build.yml'
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Emit the build matrix: Linux (WebKitGTK) every event for per-PR GUI compile signal;
  # Win/macOS only off-PR (merge_group + dispatch) — they cannot run on the Linux fleet
  # and their per-PR cost buys little over the Linux compile.
  matrix-setup:
    name: Compute GUI matrix (Win/macOS off per-PR)
    # Pure-bash compute job — runs on the local fleet per local-first policy.
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - id: gen
        shell: bash
        run: |
          set -euo pipefail
          linux='{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","sidecar_src":"target/x86_64-unknown-linux-gnu/release/vox","sidecar_dst":"target/release/vox-x86_64-unknown-linux-gnu"}'
          win='{"os":"windows-latest","target":"x86_64-pc-windows-msvc","sidecar_src":"target/x86_64-pc-windows-msvc/release/vox.exe","sidecar_dst":"target/release/vox-x86_64-pc-windows-msvc.exe"}'
          mac='{"os":"macos-latest","target":"aarch64-apple-darwin","sidecar_src":"target/aarch64-apple-darwin/release/vox","sidecar_dst":"target/release/vox-aarch64-apple-darwin"}'
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "include=[$linux]" >> "$GITHUB_OUTPUT"
          else
            echo "include=[$linux,$win,$mac]" >> "$GITHUB_OUTPUT"
          fi

  gui-cross-build:
    name: GUI Build (${{ matrix.os }})
    needs: matrix-setup
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix-setup.outputs.include) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-gui-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-gui-

      - name: Install WebKitGTK + ALSA (Ubuntu)
        if: runner.os == 'Linux'
        # libasound2-dev: vox-gui's cpal mic-capture (desktop speech-to-text) pulls
        # alsa-sys, whose build script needs the ALSA dev headers.
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libasound2-dev

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: crates/vox-gui/ui/pnpm-lock.yaml

      - name: GUI frontend build (pnpm)
        run: |
          cd crates/vox-gui/ui
          pnpm install --prefer-offline
          pnpm run build

      # Asset-level guards for the Tauri shell. Lives here rather than in a
      # workspace-check lane because compiling any vox-gui target runs tauri-build,
      # which embeds `ui/dist` — gitignored, so it only exists after the pnpm step
      # above. `png_icons_are_8_bit` catches 16-bit PNGs, which tao rejects inside
      # the macOS did_finish_launching delegate as a non-unwinding panic: the app
      # aborts before a window appears, and Windows never sees it because it loads
      # icon.ico instead.
      - name: Tauri prerequisites (icon bit depth, sidecar paths)
        run: cargo test -p vox-gui --test gui_tauri_prereqs

      - name: Build vox CLI sidecar (release)
        run: cargo build -p vox-cli --release --target ${{ matrix.target }}

      - name: Stage Tauri external sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/release | Out-Null
          Copy-Item ${{ matrix.sidecar_src }} ${{ matrix.sidecar_dst }} -Force

      - name: Stage Tauri external sidecar (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p target/release
          cp ${{ matrix.sidecar_src }} ${{ matrix.sidecar_dst }}

      - name: Build vox-gui (Tauri)
        run: cargo build -p vox-gui

      - name: sccache stats
        if: always()
        run: sccache --show-stats

# CI Fallback (GitHub-hosted)
#
# This is a degraded-mode, GitHub-hosted mirror of the self-hosted `ci.yml` merge
# gate. The primary gate runs on the self-hosted runner fleet ([self-hosted, linux,
# x64]). When that fleet has zero registered runners (or is otherwise down), the
# entire merge gate stalls and *all* merges are blocked. This workflow runs on
# GitHub-hosted `ubuntu-latest` so a runner-fleet outage degrades coverage instead
# of blocking every merge.
#
# It intentionally omits the lanes that require the self-hosted fleet's hardware and
# preinstalled services: GPU jobs, Docker-based integration, Playwright/browser E2E,
# and the heavier audit lanes. Those remain exclusive to the self-hosted gate. This
# fallback covers the portable Rust core: fmt, clippy, unit/integration tests,
# doctests, and supply-chain checks (deny/audit).
name: "CI Fallback (GitHub-hosted)"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-audit

      - name: Check formatting
        # Per-manifest, NOT `cargo fmt --all` (overflows the Windows
        # command-line limit — os error 206 — on this large workspace). Same
        # check on every OS. Local writer: `vox run scripts/fmt.vox`.
        run: |
          fail=0
          for m in crates/*/Cargo.toml; do
            cargo fmt --manifest-path "$m" -- --check || fail=1
          done
          if [ "$fail" != 0 ]; then
            echo "::error::rustfmt found unformatted files — run 'vox run scripts/fmt.vox' to fix"
            exit 1
          fi

      - name: Clippy
        # See ci.yml for rationale: deny all lints except a small cosmetic set;
        # exclude vox-gui (Tauri frontend not built in this lane).
        run: >-
          cargo clippy --workspace --all-targets --exclude vox-gui --
          -D warnings
          -A clippy::items_after_test_module
          -A clippy::collapsible_match
          -A clippy::collapsible_if
          -A clippy::should_implement_trait
          -A clippy::doc_overindented_list_items
          -A clippy::doc_lazy_continuation

      # `--profile ci` excludes slow #[ignore] tests by design; those run on the
      # self-hosted fleet.
      # Exclude vox-gui (Tauri/GTK frontend) to match the Clippy step above: this
      # hosted fallback lane does not build the GUI, and its glib/GTK system deps
      # (libglib-2.0) are not installed on the GitHub-hosted runner.
      - name: Test (nextest)
        run: cargo nextest run --workspace --exclude vox-gui --profile ci
        env:
          INSTA_UPDATE: unseen

      - name: Doctests
        run: cargo test --workspace --exclude vox-gui --doc

      - name: cargo-deny
        run: cargo deny check

      - name: cargo-audit
        run: cargo audit

  # Portable Windows lane: proves the Tauri shell compiles and the binary starts
  # (headless `--print-action-manifest-json`). Catches manifest/sidecar/icon drift
  # that Linux CI excludes when `vox-gui` is omitted from nextest/clippy.
  gui-windows-build-smoke:
    name: GUI Windows build smoke
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: crates/vox-gui/ui/pnpm-lock.yaml

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: GUI frontend build (pnpm)
        run: |
          cd crates/vox-gui/ui
          pnpm install --prefer-offline
          pnpm run build

      - name: Build vox CLI sidecar (release)
        run: cargo build -p vox-cli --release

      - name: Stage Tauri external sidecar
        shell: pwsh
        run: |
          Copy-Item target/release/vox.exe target/release/vox-x86_64-pc-windows-msvc.exe -Force

      - name: Tauri prerequisite tests
        run: cargo test -p vox-gui --test gui_tauri_prereqs

      - name: Build vox-gui (Tauri)
        run: cargo build -p vox-gui

      - name: Headless binary smoke (action manifest)
        shell: pwsh
        run: |
          $out = & target/debug/vox-gui.exe --print-action-manifest-json
          if (-not $out) { throw 'empty action manifest' }
          if ($out -notmatch '"actions"') { throw 'action manifest JSON missing actions key' }

# CI Fallback (GitHub-hosted)
#
# Reachable degraded-mode mirror of the self-hosted `ci.yml` merge gate. The `gate`
# job's `name:` matches the required branch-protection context ("Check, Build, and
# Test (Rust)"), so a green fallback run can SATISFY branch protection when the
# self-hosted fleet is down — apply the `fleet-down` label to a PR (see the
# merge-queue break-glass runbook in docs/src/ci/runner-contract.md).
#
# Triggers: nightly schedule (keeps a recent portable green signal on main),
# workflow_dispatch (manual), and a `fleet-down`-labelled pull_request (outage valve).
#
# It intentionally omits the lanes that require the self-hosted fleet's hardware and
# preinstalled services: GPU jobs, Docker-based integration, Playwright/browser E2E,
# and the heavier audit lanes. Those remain exclusive to the self-hosted gate. This
# fallback covers the portable Rust core: fmt, clippy, unit/integration tests,
# doctests, and supply-chain checks (deny/audit).
#
# All jobs in this workflow — including `gui-windows-build-smoke` — run only on
# nightly schedule, manual dispatch, or PRs labeled `fleet-down`; none run on plain
# PR pushes/synchronize.
name: "CI Fallback (GitHub-hosted)"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'   # Nightly hosted mirror — recent portable green signal on main
  pull_request:
    # `unlabeled` so removing `fleet-down` re-fires the workflow (the gate then skips,
    # leaving the required context to ci.yml's ci-summary). NOTE: a skipped job cannot
    # clear a previously-posted green status, so after removing the label either push a
    # commit (fires `synchronize` → ci-summary re-posts) or use the ruleset-relax in the
    # break-glass runbook. We deliberately do NOT auto-post a failing status here: this
    # job shares the `Check, Build, and Test (Rust)` context name with ci-summary, and a
    # red duplicate on normal PRs would conflict with ci-summary's green.
    types: [labeled, unlabeled, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    # Required-equivalent: matches the branch-protection context so a green run on
    # hosted infra satisfies the gate during a fleet outage. On PRs it only runs when
    # the `fleet-down` label is applied (the outage valve); schedule/dispatch always run.
    name: Check, Build, and Test (Rust)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'fleet-down')
    runs-on: ubuntu-latest
    # TEMPORARY: raised from 45 — this job (fmt + clippy --workspace + nextest
    # --workspace, ~11.2k tests + doctests + deny + audit, all sequential on a
    # 4-core hosted runner) has been cancelled by its own timeout at the exact
    # 45-minute mark on every observed run: main's nightly schedule on 2026-08-23
    # and 2026-08-24, and this PR's fleet-down run on 2026-08-25 — the last one
    # cut mid-`cargo build`, before nextest even started, at a 50% sccache hit
    # rate. Same cold-cache-vs-timeout failure the `gui-windows-build-smoke` job
    # below already documents; mirroring its fix. Revert toward 45 once a few
    # runs confirm the GHA sccache/rust-cache entries are warm and stable.
    timeout-minutes: 90
    env:
      # Shared compile cache via the GitHub Actions cache service. Incremental
      # compilation is disabled because sccache cannot cache incremental
      # artifacts (it would silently fall back to cache misses).
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system deps (dbus/GTK for wry/keyring/soup on Linux)
        # This job excludes vox-gui from clippy, but `cargo clippy --workspace`
        # still resolves/builds every OTHER workspace member's dependency graph,
        # and at least one non-vox-gui crate transitively depends on glib-sys /
        # gobject-sys (GTK bindings) — without these system packages, their
        # build.rs fails via pkg-config before clippy ever runs. Same package
        # list ci.yml's self-hosted jobs already install.
        run: sudo apt-get update -y && sudo apt-get install -y libdbus-1-dev pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-audit

      - name: Check formatting
        # This job runs on ubuntu-latest only (never Windows), so the per-manifest
        # workaround `scripts/fmt.vox` uses to dodge the Windows command-line-length
        # limit (os error 206) doesn't apply here and isn't needed — plain
        # `cargo fmt --all -- --check` is the standard, correct invocation on Linux.
        # The per-manifest loop this replaced also broke outright: it globbed
        # `crates/*/Cargo.toml` on the filesystem, which isn't workspace-exclude-aware
        # and picks up crates/vox-cargo-shim — deliberately excluded from
        # `[workspace]` in the root Cargo.toml (it builds a bin literally named
        # `cargo` for PATH interception, so it can't be entangled in the main
        # workspace's own cargo resolution). `cargo fmt --manifest-path` on an
        # excluded crate fails with "failed to find a workspace root" since it has
        # no enclosing workspace to inherit edition/version from. `--all` operates
        # on cargo's real, exclude-aware member set and doesn't hit this.
        # Local writer: `vox run scripts/fmt.vox`.
        run: |
          if ! cargo fmt --all -- --check; then
            echo "::error::rustfmt found unformatted files — run 'vox run scripts/fmt.vox' to fix"
            exit 1
          fi

      - name: Clippy
        # See ci.yml for rationale: deny all lints except a small cosmetic set;
        # exclude vox-gui (Tauri frontend not built in this lane).
        run: >-
          cargo clippy --workspace --all-targets --exclude vox-gui --
          -D warnings
          -A clippy::items_after_test_module
          -A clippy::collapsible_match
          -A clippy::collapsible_if
          -A clippy::should_implement_trait
          -A clippy::doc_overindented_list_items
          -A clippy::doc_lazy_continuation

      # `--profile ci` excludes slow #[ignore] tests by design; those run on the
      # self-hosted fleet.
      # Exclude vox-gui (Tauri/GTK frontend) to match the Clippy step above: this
      # hosted fallback lane does not build the GUI, and its glib/GTK system deps
      # (libglib-2.0) are not installed on the GitHub-hosted runner.
      - name: Test (nextest)
        run: cargo nextest run --workspace --exclude vox-gui --profile ci
        env:
          INSTA_UPDATE: unseen

      - name: Doctests
        run: cargo test --workspace --exclude vox-gui --doc

      - name: cargo-deny
        run: cargo deny check

      - name: cargo-audit
        run: cargo audit

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # Portable Windows lane: proves the Tauri shell compiles and the binary starts
  # (headless `--print-action-manifest-json`). Catches manifest/sidecar/icon drift
  # that Linux CI excludes when `vox-gui` is omitted from nextest/clippy.
  gui-windows-build-smoke:
    name: GUI Windows build smoke
    # Same outage valve as `gate`: on PRs, hosted Windows compute only runs when
    # the fleet-down label is applied (or on schedule/dispatch). Previously had
    # no condition at all, so it ran on every PR synchronize, burning ~60
    # CI-minutes per push on a job that has never once completed within its
    # timeout from a cold cache.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'fleet-down')
    runs-on: windows-latest
    # TEMPORARY: raised from 60 to seed a Swatinem/rust-cache baseline via one
    # workflow_dispatch run — this job has never completed within 60 min from a
    # cold cache, so no cache has ever been saved. Revert to 60 once a cache
    # exists and incremental runs are confirmed fast.
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: crates/vox-gui/ui/pnpm-lock.yaml

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: GUI frontend build (pnpm)
        run: |
          cd crates/vox-gui/ui
          pnpm install --prefer-offline
          pnpm run build

      - name: Build vox CLI sidecar (release)
        run: cargo build -p vox-cli --release

      - name: Stage Tauri external sidecar
        shell: pwsh
        run: |
          Copy-Item target/release/vox.exe target/release/vox-x86_64-pc-windows-msvc.exe -Force

      - name: Tauri prerequisite tests
        run: cargo test -p vox-gui --test gui_tauri_prereqs

      - name: Build vox-gui (Tauri)
        run: cargo build -p vox-gui

      - name: Headless binary smoke (action manifest)
        shell: pwsh
        run: |
          $out = & target/debug/vox-gui.exe --print-action-manifest-json
          if (-not $out) { throw 'empty action manifest' }
          if ($out -notmatch '"actions"') { throw 'action manifest JSON missing actions key' }

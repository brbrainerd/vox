# Nightly mutation testing (non-blocking): scoped to `vox-compiler` via `.cargo/mutants.toml`.
name: Mutation (nightly, vox-compiler)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

env:
  CARGO_TERM_COLOR: always
  CARGO_LOCKED: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cargo-mutants:
    name: cargo-mutants (vox-compiler)
    runs-on: [self-hosted, linux, x64]
    # Without this, a hang defaults to GitHub's 360-min job timeout, squatting
    # a scarce self-hosted runner slot for up to 6h and starving the other
    # nightlies (2026-07-27 audit finding — this and the Qwen3.5 job were the
    # only two nightlies missing an explicit timeout).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry & Target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mutants-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Run mutants (package vox-compiler)
        # emission_ladder_test shells out to rustc to compile generated code
        # per case (~293s for the whole file locally) -- fine once in normal
        # `cargo test`, but cargo-mutants re-runs the test command for every
        # candidate mutant. At 4453 mutants that dominant cost alone is ~90h
        # sequential and blows through any reasonable job timeout (confirmed:
        # 2026-07-28 run hit the 120m cap after clearing baseline+installs,
        # having barely started). Excluded here only from the mutants inner
        # loop; the real `cargo test` gate still runs it every time.
        run: |
          cargo mutants -p vox-compiler --no-times --jobs 4 \
            -- -E 'not binary(emission_ladder_test)'

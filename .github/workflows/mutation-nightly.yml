# Nightly mutation testing (non-blocking): scoped to `vox-compiler` via `.cargo/mutants.toml`.
name: Mutation (nightly, vox-compiler)

on:
  workflow_dispatch:
  schedule:
    # Moved off 05:17 UTC (measured: 24/29 runs cancelled, ALL-CANCELLED per
    # wf-health-measured.tsv). 05:17 sat inside the densest self-hosted-linux
    # cron cluster in this repo — gitleaks (05:00), then cr-l-gates,
    # ci-fallback-hosted, and link_checker all firing at 06:00 — so a 120-minute
    # mutation run competed with four other nightlies for the same fleet
    # capacity and was starving/being starved (see the job's own
    # "starving the other nightlies" comment below, from a prior 2026-07-27
    # audit of this exact contention pattern). 13:00 UTC has no other
    # self-hosted-linux cron in this repo, giving this job the fleet to itself.
    - cron: "0 13 * * *"

env:
  CARGO_TERM_COLOR: always
  CARGO_LOCKED: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cargo-mutants:
    name: cargo-mutants (vox-compiler)
    runs-on: [self-hosted, linux, x64]
    # Without this, a hang defaults to GitHub's 360-min job timeout, squatting
    # a scarce self-hosted runner slot for up to 6h and starving the other
    # nightlies (2026-07-27 audit finding — this and the Qwen3.5 job were the
    # only two nightlies missing an explicit timeout).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry & Target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mutants-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Run mutants (package vox-compiler)
        # Full-crate mutation testing (4453 mutants as of 2026-07-28) does not
        # fit in a single 120m nightly run at observed throughput (~40
        # mutants/120m at --jobs 4; confirmed --jobs 12 is WORSE -- 25/4453 --
        # because each mutant job runs its own fully-parallel rustc build and
        # 12 concurrent jobs oversubscribe the 24-core runner). Rather than
        # fight per-mutant throughput, shard the corpus with cargo-mutants'
        # native --shard k/n and rotate k by day-of-year, so the schedule
        # cycles through every mutant over ~128 days with zero new runner
        # capacity. n=128 measured ~35 mutants/shard (2026-07-28) -- comfortably
        # inside the 120m budget. Re-measure `--list --shard 0/128 | wc -l`
        # occasionally as the crate grows and bump 128 up if a shard creeps
        # past ~50 mutants.
        #
        # emission_ladder_test shells out to rustc to compile generated code
        # per case (~293s for the whole file locally) -- fine once in normal
        # `cargo test`, but cargo-mutants re-runs the test command for every
        # candidate mutant, so it's excluded from the mutants inner loop only;
        # the real `cargo test` gate still runs it every time.
        # A slow-but-alive run and a genuine hang look identical from outside:
        # `gh run view --log` returns nothing for in-progress jobs (a GitHub
        # API limitation, not fixable here), and cargo-mutants itself only
        # prints one line per COMPLETED mutant -- with each mutant requiring
        # a full from-scratch rebuild of vox-compiler (no incremental cache
        # across mutants), that can be silent for 3+ minutes at a time even
        # when healthy. 2026-07-29: had to `docker exec` into the runner and
        # inspect `ps aux` by hand to confirm a run marked "failure" by a
        # transient runner-network blip was actually still compiling fine.
        # Run cargo-mutants in the background and emit a heartbeat every 5m
        # with elapsed time + mutants completed so far, so that's visible in
        # the live log without needing to do that again.
        run: |
          SHARD_TOTAL=128
          SHARD_INDEX=$(( 10#$(date -u +%j) % SHARD_TOTAL ))
          echo "Mutation shard: ${SHARD_INDEX}/${SHARD_TOTAL} (day-of-year $(date -u +%j))" | tee -a "$GITHUB_STEP_SUMMARY"

          LOG=mutants-run.log
          cargo mutants -p vox-compiler --no-times --jobs 4 \
            --shard "${SHARD_INDEX}/${SHARD_TOTAL}" \
            -- -E 'not binary(emission_ladder_test)' \
            > "$LOG" 2>&1 &
          MUTANTS_PID=$!

          START_TS=$(date +%s)
          while kill -0 "$MUTANTS_PID" 2>/dev/null; do
            sleep 300
            ELAPSED_MIN=$(( ($(date +%s) - START_TS) / 60 ))
            DONE=$(grep -cE "^(MISSED|CAUGHT|TIMEOUT|UNVIABLE)" "$LOG" 2>/dev/null)
            TOTAL=$(grep -oP '(?<=Found )[0-9]+(?= mutants)' "$LOG" | head -1)
            echo "heartbeat: ${ELAPSED_MIN}m elapsed, ${DONE}/${TOTAL:-?} mutants tested so far (still running)"
          done

          wait "$MUTANTS_PID"
          EXIT=$?
          cat "$LOG"
          exit "$EXIT"

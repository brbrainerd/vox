name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run the gate on GitHub merge-queue batches so "Require merge queue" can
  # serialize main and verify each batch once (eliminates the cancel-thrash
  # from rapid direct pushes; the required check name below is unchanged).
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  # Self-hosted runner image sets RUSTC_WRAPPER; repeat here for non-container jobs.
  RUSTC_WRAPPER: sccache
  SCCACHE_DIR: /cache/sccache

jobs:
  # Setup: cache warmup + path-filter computation.  Path-filter outputs let
  # downstream jobs skip Rust-specific steps on docs-only PRs.
  #
  # rust_changed = "true"  → any file under crates/** or Cargo.* changed.
  # docs_changed = "true"  → any file under docs/** or contracts/** changed.
  #
  # On push:main both are always treated as "true" so we never skip gates on
  # the integration branch.  On PRs the filter is computed from the diff.
  setup:
    name: Cache warmup + path filter
    runs-on: [self-hosted, linux, x64]
    # Cold `cargo build -p vox-cli` on ephemeral runners (no actions/cache hit)
    # routinely exceeds 20m; fail-closed at 40m so downstream gates are not skipped.
    timeout-minutes: 40
    outputs:
      cache-key: ${{ steps.k.outputs.key }}
      rust_changed: ${{ steps.filter.outputs.rust }}
      docs_changed: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: k
        run: echo "key=${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}" >> "$GITHUB_OUTPUT"

      # Compute path-filters.  On push:main AND merge_group (the integration
      # paths) always emit true so we never skip gates on the integration branch.
      # (merge_group has no github.base_ref, so the PR-style diff below would be
      # meaningless and could skip `tests` — fail-closed by running everything.)
      - id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "rust=true"  >> "$GITHUB_OUTPUT"
            echo "docs=true"  >> "$GITHUB_OUTPUT"
          else
            # Fetch base ref so the diff is meaningful.
            git fetch origin "${{ github.base_ref }}" --depth=256 2>/dev/null || true
            BASE="origin/${{ github.base_ref }}"
            CHANGED=$(git diff --name-only "${BASE}...HEAD" 2>/dev/null || git diff --name-only HEAD~1...HEAD)
            if echo "$CHANGED" | grep -qE '^(crates/|Cargo\.(toml|lock)|\.cargo/)'; then
              echo "rust=true" >> "$GITHUB_OUTPUT"
            else
              echo "rust=false" >> "$GITHUB_OUTPUT"
            fi
            if echo "$CHANGED" | grep -qE '^(docs/|contracts/|AGENTS\.md|CONTRIBUTING\.md|README\.md)'; then
              echo "docs=true" >> "$GITHUB_OUTPUT"
            else
              echo "docs=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ steps.k.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build vox-cli (warms sccache + downstream artifact)
        run: cargo build -p vox-cli --locked --features completion-toestub
      - name: Upload vox-cli binary
        uses: actions/upload-artifact@v7
        with:
          name: vox-cli-bin
          path: target/debug/vox
          if-no-files-found: error

  # SSOT auto-regenerate (PR helper, NON-required): regenerate the committed SSOT
  # artifacts that guards-fast → `vox ci ssot-drift` verifies, and commit the result back
  # to the PR branch. Removes the manual "regenerate after merge" round-trip — instead of
  # ssot-drift hard-failing and a human running `vox ci <gen> --write` + committing, the bot
  # does it. The generators are DETERMINISTIC (verified locally: a second run yields byte-
  # identical output), so a re-run produces no diff → no commit → the loop self-terminates
  # after at most one regen commit. Nothing `needs:` this job, so it can never block the
  # required "Check, Build, and Test (Rust)" gate. Reuses the vox-cli built by `setup`.
  #
  # DEPLOYMENT PREREQUISITE: set repo secret `SSOT_AUTOREGEN_TOKEN` to a PAT or GitHub App
  # token with `contents: write`. The default GITHUB_TOKEN can push but its pushes do NOT
  # re-trigger workflows, so the required gate would not re-run on the bot's commit (PR would
  # be unmergeable). With the PAT, the bot's push starts a fresh CI run that re-verifies the
  # regenerated files. Without the secret it falls back to GITHUB_TOKEN: the bot still
  # regenerates + commits, but a maintainer must nudge the gate (e.g. close/reopen the PR).
  ssot-autoregen:
    name: SSOT auto-regenerate (PR)
    needs: setup
    # Same-repo PRs only — fork PRs get a read-only token and fall back to manual regen.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    permissions:
      contents: write   # job-scoped override (workflow default is contents: read) to push the regen commit
    steps:
      # Pinned to immutable SHAs because this job has `contents: write` (tags can be
      # re-pointed after creation). SHAs verified equal to v6 / v4 at PR time. The rest of
      # ci.yml intentionally uses tag refs per repo convention — only this privileged job is
      # hardened. persist-credentials:false avoids leaving the clone token in .git/config;
      # the push step below authenticates explicitly via PUSH_TOKEN.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vox-cli-bin
          path: target/debug
      - name: Ensure vox-cli executable
        run: chmod +x target/debug/vox
      - name: Regenerate committed SSOT artifacts
        shell: bash
        run: |
          set -uo pipefail
          # SOURCE OF TRUTH for this list: run_ssot_drift() in
          # crates/vox-cli/src/commands/ci/run_body_helpers/docs.rs — each generator it
          # verifies in read-only mode is re-run here with its --write flag. Keep in sync
          # when that function gains/loses a generator.
          VOX=./target/debug/vox
          for cmd in \
            "operations-sync --target all --write" \
            "command-sync --write" \
            "generate-plugin-catalog-docs" \
            "plugin-catalog-sync --write" \
            "plugin-surface-sync --write" \
            "plugin-skill-parity --write" \
            "gui-version-sync --write" \
            "capability-sync --write" \
            "gui-surface-coverage --write" \
            "gui-surface-registry --write"; do
            echo "::group::vox ci $cmd"
            # Best-effort: a generator that errors (not just rewrites) is surfaced as a
            # warning but does not fail the job — the ssot-drift gate still verifies it.
            # $cmd is deliberately unquoted so its words split into subcommand + flags.
            # shellcheck disable=SC2086
            $VOX --quiet ci $cmd || echo "::warning::regenerator failed: vox ci $cmd"
            echo "::endgroup::"
          done
      - name: Commit regenerated artifacts to the PR branch (only if drift)
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
          # PAT (preferred) makes the push re-trigger CI; github.token is the fallback.
          # Passed via env (not inline ${{ }}) to avoid expression injection in the run block.
          PUSH_TOKEN: ${{ secrets.SSOT_AUTOREGEN_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "SSOT artifacts already fresh — nothing to commit."
            exit 0
          fi
          echo "Regeneration changed:"; git diff --name-only
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # NO [skip ci]: the regenerated commit must be re-verified by the gate. The
          # generators are deterministic, so the re-triggered run regenerates identically,
          # finds no diff, and does not commit again — the loop terminates.
          git commit -m "chore(ssot): auto-regenerate drifted SSOT artifacts (deterministic; ci.yml ssot-autoregen)"
          # Explicit one-shot HTTPS token auth (checkout used persist-credentials:false, so no
          # credentials linger in .git/config for later steps). GITHUB_REPOSITORY is set by Actions.
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${PR_HEAD_REF}"

  guards-fast:
    name: Guards (fast)
    needs: setup
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: vox-cli-bin
          path: target/debug
      - name: Ensure vox-cli executable
        run: chmod +x target/debug/vox
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Crate version inheritance (no hardcoded versions)
        run: |
          if grep -rnE '^version\s*=\s*"[^"]+"' crates/*/Cargo.toml; then
            echo "::error::Found hardcoded versions in crate Cargo.toml files. Use 'version.workspace = true'."
            exit 1
          fi

      - name: Line endings (forward-only)
        run: ./target/debug/vox --quiet ci line-endings

      - name: Workspace manifest resolves (fix-forward guard)
        run: ./target/debug/vox --quiet ci manifest

      - name: Format Check
        # Per-manifest, NOT `cargo fmt --all`: the latter passes every crate's
        # target root to one rustfmt process, overflowing the Windows
        # CreateProcess command-line limit (os error 206) on this large
        # workspace. The per-manifest form keeps each invocation tiny and stays
        # identical on Linux/macOS/Windows runners. Local writer: `vox run
        # scripts/fmt.vox`. See AGENTS.md "Formatting Rust (Windows-safe)".
        run: |
          fail=0
          for m in crates/*/Cargo.toml; do
            cargo fmt --manifest-path "$m" -- --check || fail=1
          done
          if [ "$fail" != 0 ]; then
            echo "::error::rustfmt found unformatted files — run 'vox run scripts/fmt.vox' to fix"
            exit 1
          fi

      - name: Install cargo-deny + cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit

      - name: Warm cargo-deny advisory DB (shared volume)
        run: mkdir -p /cache/advisory-db && cargo deny fetch

      - name: Dependency licenses + advisories (cargo-deny)
        run: cargo deny check

      - name: RustSec advisories (cargo-audit)
        run: cargo audit

      - name: Install cargo-shear + cargo-outdated (informational)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-shear,cargo-outdated

      - name: Unused dependency scan (cargo-shear, non-blocking)
        continue-on-error: true
        run: cargo shear

      - name: Outdated crates report (cargo-outdated, non-blocking)
        continue-on-error: true
        run: cargo outdated --workspace

      - name: Retired symbol documentation guard
        run: ./target/debug/vox --quiet ci retired-symbol-check

      # contracts-index, exec-policy, scientia contracts, plugin-catalog run inside ssot-drift.
      - name: SSOT drift bundle (operations-verify, sql-surface + query-all --all, capability-sync, nested guards)
        run: ./target/debug/vox --quiet ci ssot-drift

      - name: Determinism Audit
        run: ./target/debug/vox --quiet ci determinism-audit

      - name: Dependency Sprawl Check
        run: ./target/debug/vox --quiet ci dep-sprawl --cap 25

      - name: Plugin Dependency Boundary (cdylib plugins must not link the spine)
        run: ./target/debug/vox --quiet ci plugin-dep-boundary

      - name: No cdylib plugin as a compile-time dependency (D-2)
        run: ./target/debug/vox --quiet ci no-plugin-cdylib-as-compile-dep

      # Builds every current-platform plugin cdylib (default/CPU features), then loads each
      # through the host loader to assert its embedded ABI version matches the host. Catches a
      # plugin drifting from VOX_PLUGIN_ABI_VERSION (e.g. an SDK/ABI bump that wasn't rebuilt).
      - name: Plugin ABI parity (build + load every plugin)
        run: ./target/debug/vox --quiet ci plugin-abi-parity --build

      - name: Dynamic Workspace Health Audit
        run: ./scripts/windows/vox-dev.ps1 run --interp scripts/quality/audit-workspace-health.vox

      - name: Telemetry-Driven Architectural Audit
        run: ./scripts/windows/vox-dev.ps1 run --interp scripts/quality/audit-telemetry.vox

      - name: Secrets SSOT parity + secret direct-read guard
        shell: bash
        run: |
          set -euo pipefail
          ./target/debug/vox --quiet ci secrets-parity
          # Meaningful diff scope on clean checkouts (default `git diff HEAD` scans nothing in CI).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=256
            export VOX_SECRET_GUARD_GIT_REF="origin/${{ github.base_ref }}...HEAD"
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE" ]; then
              export VOX_SECRET_GUARD_GIT_REF="HEAD~1...HEAD"
            else
              export VOX_SECRET_GUARD_GIT_REF="${{ github.event.before }}...${{ github.sha }}"
            fi
          fi
          ./target/debug/vox --quiet ci secret-env-guard
          export VOX_SECRETS_REQUIRE_COMPAT_SUNSET=1
          export VOX_SECRETS_CUTOVER_PHASE=enforce
          ./target/debug/vox --quiet ci secrets-cutover-gates

      - name: OpenClaw + scaling policy SSOT (not in ssot-drift bundle)
        run: |
          ./target/debug/vox --quiet ci openclaw-contract
          ./target/debug/vox --quiet ci scaling-audit verify

      - name: Vox script check (clean-build-artifacts reference automation)
        run: ./target/debug/vox --quiet check scripts/clean-build-artifacts.vox

      - name: Vox script corpus check (all scripts/**/*.vox pass vox check)
        shell: bash
        run: |
          set -euo pipefail
          VOX_BIN="./target/debug/vox"
          failed=0
          while IFS= read -r f; do
            if ! "$VOX_BIN" check "$f" 2>&1; then
              echo "FAIL: $f"
              failed=$((failed + 1))
            fi
          done < <(find scripts -name "*.vox" | sort)
          if [ "$failed" -gt 0 ]; then
            echo "ERROR: $failed script(s) failed vox check. All scripts/**/*.vox must pass."
            exit 1
          fi
          echo "OK: all scripts/**/*.vox pass vox check."

      - name: Workflow scripts allowlist
        run: ./target/debug/vox --quiet ci workflow-scripts

      - name: Doc inventory matches generator (Rust)
        run: ./target/debug/vox --quiet ci doc-inventory verify

      - name: Docs — no stale `tanstack_start.rs` compiler path
        shell: bash
        run: |
          set -euo pipefail
          if rg -n "crates/vox-compiler/src/codegen_ts/tanstack_start\\.rs" docs/src; then
            echo "docs must not reference removed tanstack_start.rs; use route_manifest / vox_client / scaffold"
            exit 1
          fi

      - name: Docs — no ghost references to retired HTMX / Pico / TanStack-virtual-routes (G.73)
        # Audit item G.73: retired surfaces must not appear in normative docs.
        # Allowlist: the audit-findings doc and archive/ may reference them for historical context.
        shell: bash
        run: |
          set -euo pipefail
          RETIRED_HITS=$(rg -in \
            "\bhtmx\b|picocss|pico\.css|tanstack.*virtual.route" \
            docs/src \
            --glob "*.md" \
            --ignore-file .voxignore \
            -l \
            | grep -v 'docs/src/archive/' \
            | grep -v 'comprehensive-audit-findings' \
            || true)
          if [ -n "$RETIRED_HITS" ]; then
            echo "Retired surface references found in normative docs:"
            echo "$RETIRED_HITS"
            echo "Move HTMX/Pico/TanStack-virtual-routes content to docs/src/archive/ or remove."
            exit 1
          fi
          echo "No ghost retired-surface references in normative docs."

      - name: Web TS codegen — forbidden legacy RPC shims in sources
        shell: bash
        run: |
          set -euo pipefail
          if rg -n "createServerFn\\(" crates/vox-compiler/src/codegen_ts; then
            echo "createServerFn must not appear in vox-codegen-ts sources"
            exit 1
          fi

      - name: Normative docs — @query is GET (no POST /api/query claims)
        shell: bash
        run: |
          set -euo pipefail
          if rg -n "POST /api/query" docs/src/reference docs/src/api docs/src/architecture docs/src/how-to; then
            echo "docs must not describe @query as POST /api/query"
            exit 1
          fi

  lints:
    name: Lints (clippy + rustdoc + TOESTUB-scoped + hakari + grammar)
    needs: setup
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: vox-cli-bin
          path: target/debug
      - name: Ensure vox-cli executable
        run: chmod +x target/debug/vox
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Rustdoc (deny warnings)
        run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps

      - name: Lint Check (Clippy)
        # Deny all lints (`-D warnings`) EXCEPT a small set of cosmetic/subjective
        # style lints that fire broadly across the workspace under the pinned
        # toolchain and add churn without correctness value:
        #   - items_after_test_module   — `mod tests` placement (purely cosmetic)
        #   - collapsible_match         — nested `if let`/`match` readability preference
        #   - collapsible_if            — `if x { if let .. }` cannot collapse without
        #                                 edition-2024 let-chains; flattening via tuple
        #                                 patterns would change side-effect ordering
        #   - should_implement_trait    — e.g. inherent `from_str` vs the `FromStr` trait
        #   - doc_overindented_list_items / doc_lazy_continuation — rustdoc markdown nits
        # Every correctness/suspicious/perf lint remains denied.
        #
        # vox-gui is excluded for the same reason as cross-platform-check.yml's
        # `cargo check`: its Tauri `generate_context!()` needs the built frontend
        # (`frontendDist = "ui/dist"`) at compile time, which this job does not
        # produce. The full vox-gui build (incl. the pnpm frontend) is covered by
        # release-gui.yml, so exclude it here rather than make the merge gate
        # depend on stale on-runner `ui/dist` state.
        run: >-
          cargo clippy --workspace --all-targets --exclude vox-gui --
          -D warnings
          -A clippy::items_after_test_module
          -A clippy::collapsible_match
          -A clippy::collapsible_if
          -A clippy::should_implement_trait
          -A clippy::doc_overindented_list_items
          -A clippy::doc_lazy_continuation

      # Scoped TOESTUB: enforce-warn mode — all 23 detectors, Warnings+ block.
      # This aligns with the pre-commit tdd-guard (enforce-strict on skeleton
      # rules) and pre-push toestub-scoped, giving one coherent severity model:
      # every detector runs at its authored severity; callers choose min-severity.
      - name: TOESTUB (scoped)
        run: ./target/debug/vox --quiet ci toestub-scoped --mode enforce-warn

      - name: Architecture / Code Drift Guard (TOESTUB)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1 || true
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "^docs/src/architecture/"; then
            echo "Architecture docs changed. Running full crates TOESTUB..."
            ./target/debug/vox --quiet ci toestub-scoped crates --mode enforce-warn
          else
            echo "No architecture docs changed. Skipping full strict TOESTUB."
          fi

      - name: Toolchain SSoT Drift Guard
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_RUST=$(grep -oP 'rust:\s*"\K[^"]+' contracts/toolchain/workspace-toolchain.v1.yaml)
          ACTUAL_RUST_TOOLCHAIN=$(grep -oP 'channel\s*=\s*"\K[^"]+' rust-toolchain.toml)
          ACTUAL_CARGO=$(grep -oP '^rust-version\s*=\s*"\K[^"]+' Cargo.toml)
          
          if [[ "$EXPECTED_RUST" != "$ACTUAL_RUST_TOOLCHAIN" ]]; then
            echo "Drift detected: SSoT wants Rust $EXPECTED_RUST but rust-toolchain.toml has $ACTUAL_RUST_TOOLCHAIN"
            exit 1
          fi
          
          # Cargo.toml rust-version usually only specifies major.minor, not patch.
          # We check if it matches the prefix.
          if [[ ! "$EXPECTED_RUST" == "$ACTUAL_CARGO"* ]]; then
            echo "Drift detected: SSoT wants Rust $EXPECTED_RUST but Cargo.toml rust-version is $ACTUAL_CARGO"
            exit 1
          fi
          
          echo "Toolchain SSoT Parity Verified."

      # Workspace-wide pattern drift check (6 rules: reqwest_bypass, vox_path_literal,
      # timeout_literal, serde_default_dup, version_string, bearer_header).
      # Previously pre-push only; now also in CI so pushes without lefthook installed
      # don't bypass it.
      - name: Workspace drift check (vox-drift-check)
        run: cargo run -p vox-drift-check --quiet -- . --severity warning --fail-on warning

      - name: Verify Hakari (Workspace Dependency Determinism)
        run: cargo hakari generate --diff

      - name: Grammar export check (EBNF/GBNF/Lark/JSON-Schema non-empty)
        run: ./target/debug/vox --quiet ci grammar-export-check

  compiler-gates:
    name: Compiler gates (WebIR + projection + golden examples + benches)
    needs: setup
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: vox-cli-bin
          path: target/debug
      - name: Ensure vox-cli executable
        run: chmod +x target/debug/vox
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Test inventory snapshot drift gate
        # Keep contracts/reports/test-inventory.v1.json in lockstep with the
        # scanner output. This is a blocking check and should run after vox-cli
        # builds so docs-only changes still validate deterministically.
        run: ./target/debug/vox ci test-inventory --check contracts/reports/test-inventory.v1.json

      - name: SPA scaffold manifest idempotency
        run: cargo nextest run -p vox-cli --test scaffold_spa_manifest_idempotent

      - name: Eval benchmark matrix contract + vox-cli GPU compile smoke
        run: |
          ./target/debug/vox --quiet ci eval-matrix verify
          ./target/debug/vox --quiet ci eval-matrix run --milestone m3-dei-contracts
          # GPU compile smoke = the actual GPU crate (the candle-cuda plugin), not
          # `vox-cli --features gpu` (no such feature). `check` without the `cuda`
          # feature compiles the plugin against CPU candle, so no CUDA toolchain needed.
          cargo check -p vox-plugin-mens-candle-cuda

      - name: WebIR structural validate gate (TS codegen path)
        env:
          VOX_WEBIR_VALIDATE: "1"
        run: cargo nextest run -p vox-compiler --test web_ir_lower_emit_test --run-ignored ignored-only --no-capture

      - name: Projection parity gate (WebIR + AppContract + RuntimeProjection)
        env:
          VOX_RUNTIME_PROJECTION_INCLUDE_HOST_PROBE: "0"
        run: cargo nextest run -p vox-compiler --test projection_parity_test

      - name: Golden examples strict-parse gate (A.13 — all examples/*.vox must parse)
        # A.13: VOX_EXAMPLES_STRICT_PARSE=1 must be the default in CI.
        # Uses the vox-compiler test suite which already has a strict-parse integration test.
        env:
          VOX_EXAMPLES_STRICT_PARSE: "1"
        run: cargo nextest run -p vox-compiler --test golden_examples_strict_parse --no-capture 2>&1
        # Gate enforcement: The build fails if any golden example contains syntax errors or unhandled tokens.

      - name: Golden @test function runner (CR-D3 — vox test round-trip)
        # Runs every @test fn in examples/golden/**/*.vox through the eval layer.
        # Validates that the `vox test` command surface works end-to-end on golden examples.
        run: cargo nextest run -p vox-integration-tests --test golden_vox_test_runner --no-capture 2>&1

      - name: AgentOS ACI schema + guardrail integration gate
        run: cargo nextest run -p vox-integration-tests --test agentos_aci_bench --no-capture 2>&1

      - name: Compiler pipeline benchmarks compile-smoke (CR-E1 gate)
        # Verifies benchmark code compiles cleanly; timing baselines are captured
        # by the separate nightly benchmark job.  `--no-run` prevents wall-clock
        # variability from inflating CI times.
        run: cargo bench -p vox-compiler --no-run

      - name: Golden examples fmt idempotency gate (A.12)
        shell: bash
        run: |
          set -euo pipefail
          find examples/golden -name "*.vox" -type f -print0 | while IFS= read -r -d '' f; do
            ./target/debug/vox --quiet fmt "$f"
          done
          if ! git diff --exit-code examples/golden/; then
            echo "vox fmt is not idempotent or examples have unformatted changes."
            exit 1
          fi

  tests:
    name: Tests (nextest + llvm-cov + doctests)
    needs: setup
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: vox-cli-bin
          path: target/debug
      - name: Ensure vox-cli executable
        run: chmod +x target/debug/vox
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Repository SSOT + MCP smoke
        run: |
          cargo nextest run -p vox-repository --lib
          cargo nextest run -p vox-orchestrator --lib -E 'test(detect_layout_node_workspaces)'
          cargo nextest run -p vox-orchestrator-mcp --lib
          cargo check -p vox-git

      - name: Mesh transport + workflow-runtime + CLI feature matrix slice
        run: |
          cargo nextest run -p vox-populi --features transport,mens
          cargo nextest run -p vox-workflow-runtime
          cargo check -p vox-cli --features mesh,workflow-runtime

      - name: Orchestrator slim build (news-publish off, no populi-transport → minimal default)
        run: cargo check -p vox-orchestrator --no-default-features --features runtime,mcp-native,toestub-gate

      - name: Arch-check (layer + fan-in + LoC + orphan + docstring)
        # Invocation delegated to scripts/arch-check.vox (SSOT).
        # Layer rule strict; the others warn-only by default. Source of truth:
        # docs/src/architecture/layers.toml.
        run: ./target/debug/vox --quiet run scripts/arch-check.vox

      # Conditional coverage: llvm-cov instrumentation adds significant wall-clock
      # time and is meaningless on docs-only PRs.  Run plain nextest when no Rust
      # crates changed; full llvm-cov nextest otherwise.
      # On push:main setup always sets rust_changed=true so coverage always runs.
      - name: Run Tests — llvm-cov nextest (Rust changed)
        if: needs.setup.outputs.rust_changed == 'true'
        env:
          INSTA_UPDATE: unseen
        run: |
          set -euo pipefail
          junit_cfg="${RUNNER_TEMP}/vox-nextest-junit.toml"
          printf '%s\n' '[profile.ci.junit]' 'path = "junit.xml"' >"${junit_cfg}"
          cargo llvm-cov nextest --workspace --profile ci --tool-config-file "vox-ci:${junit_cfg}"

      - name: Run Tests — plain nextest (docs-only change, no coverage overhead)
        if: needs.setup.outputs.rust_changed != 'true'
        env:
          INSTA_UPDATE: unseen
        run: |
          set -euo pipefail
          junit_cfg="${RUNNER_TEMP}/vox-nextest-junit.toml"
          printf '%s\n' '[profile.ci.junit]' 'path = "junit.xml"' >"${junit_cfg}"
          cargo nextest run --workspace --profile ci --tool-config-file "vox-ci:${junit_cfg}"

      # Slow test partition — runs the three #[ignore = "slow; …"] tests explicitly.
      # These are excluded from the workspace nextest step above to keep CI wall-clock
      # under 30 min.  Uses an exact filter so none of the other 250+ intentionally-
      # ignored tests are swept in.  max-threads=1 is enforced by [test-groups.slow] in
      # .config/nextest.toml; the CI profile slow-timeout terminates after 3×180s.
      - name: Run slow test partition (arch-check, scientia timeout, codegen bundle)
        if: needs.setup.outputs.rust_changed == 'true'
        run: |
          cargo nextest run \
            -E 'test(arch_check_live_workspace_smoke_and_description_rule) or test(timeout_kills_long_running_child) or test(generated_ai_fixture_bundle_passes_cargo_check)' \
            --run-ignored ignored-only \
            --profile ci

      # Phase 5 — Test-tier budget check (warn-only until budgets file is updated post Phase 2+3).
      # Reads the nextest JUnit elapsed time and compares against contracts/budgets/test-tier-budgets.v1.yaml.
      # Does NOT re-run tests; no-op if budgets file is absent.
      # continue-on-error: true until tightened budgets land (Phase 5 follow-up).
      - name: Test-tier timing budget check (nextest full tier)
        if: always() && needs.setup.outputs.rust_changed == 'true'
        continue-on-error: true
        run: |
          junit="target/nextest/ci/junit.xml"
          if [ -f "${junit}" ]; then
            ./target/debug/vox ci tier-budget-check \
              --junit "${junit}" \
              --profile full
          else
            echo "::notice title=Tier budget check skipped::JUnit artifact not found at ${junit}"
          fi

      - name: Runtime governance report + warn-only checks (non-blocking)
        if: always()
        shell: bash
        run: |
          set +e
          junit_path="target/nextest/ci/junit.xml"
          report_path="target/nextest/ci/runtime-report.json"
          baseline_path="target/nextest/ci/runtime-baseline.json"

          if [ ! -f "${junit_path}" ]; then
            echo "::notice title=Runtime governance skipped::JUnit artifact not found at ${junit_path}; skipping runtime report and warn-mode governance checks."
            exit 0
          fi

          mkdir -p "$(dirname "${report_path}")"

          ./target/debug/vox ci test-runtime-report --junit "${junit_path}" --json --top 20 > "${report_path}"
          report_status=$?
          if [ ${report_status} -ne 0 ]; then
            echo "::warning title=Runtime report generation failed::test-runtime-report exited with status ${report_status}; skipping downstream warn-mode checks."
            exit 0
          fi

          ./target/debug/vox ci flake-budget --report-json "${report_path}" --max-candidates 20 --mode warn
          flake_status=$?
          if [ ${flake_status} -ne 0 ]; then
            echo "::warning title=Flake budget warn-mode check errored::flake-budget exited with status ${flake_status}."
          fi

          ./target/debug/vox ci ignored-test-age --mode enforce
          ignored_status=$?
          if [ ${ignored_status} -ne 0 ]; then
            echo "::error title=Ignored test governance::ignored-test-age enforce mode failed (bare #[ignore] or missing owner/sunset in #[ignore = \"…\"])."
            exit ${ignored_status}
          fi

          if [ -f "${baseline_path}" ]; then
            ./target/debug/vox ci runtime-regress --baseline "${baseline_path}" --current "${report_path}" --mode warn
            regress_status=$?
            if [ ${regress_status} -ne 0 ]; then
              echo "::warning title=Runtime regress warn-mode check errored::runtime-regress exited with status ${regress_status}."
            fi
          else
            echo "::notice title=Runtime regress skipped::No stable baseline artifact at ${baseline_path}; runtime-regress is not run in this workflow."
          fi

          exit 0

      - name: Upload insta snapshots (review and commit after first run)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: insta-snapshots
          path: |
            crates/vox-integration-tests/tests/snapshots/
            crates/vox-compiler/tests/snapshots/
          if-no-files-found: ignore

      - name: Upload nextest JUnit (CI profile)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nextest-junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

      - name: Upload nextest runtime report (CI governance input)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nextest-runtime-report
          path: target/nextest/ci/runtime-report.json
          if-no-files-found: ignore

      - name: vox-db replication feature (compile + embedded sync smoke skips without creds)
        run: cargo nextest run -p vox-db --features replication -E 'test(sync_embedded_replica_smoke)'

      # Doctests use Rust's built-in harness only; cargo-nextest does not execute them.
      # Keep this as `cargo test --workspace --doc` until a verified nextest doctest path exists.
      - name: Doc tests (cargo test --workspace --doc; not nextest)
        run: cargo test --workspace --doc

      - name: Line coverage report (summary, LCOV, gates enforce)
        if: needs.setup.outputs.rust_changed == 'true'
        run: |
          set -euo pipefail
          cargo llvm-cov report --text --summary-only
          cargo llvm-cov report --json --summary-only --output-path target/llvm-cov-summary.json
          cargo llvm-cov report --lcov --output-path target/llvm-cov-lcov.info
          ./target/debug/vox --quiet ci coverage-gates --summary-json target/llvm-cov-summary.json --mode enforce

      - name: Upload LLVM coverage artifacts
        if: (success() || failure()) && needs.setup.outputs.rust_changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: llvm-cov
          path: |
            target/llvm-cov-summary.json
            target/llvm-cov-lcov.info

  audits:
    name: Audits (TOESTUB-full + build-timings + feature-matrix + completion + mens-gate)
    needs: setup
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: vox-cli-bin
          path: target/debug
      - name: Ensure vox-cli executable
        run: chmod +x target/debug/vox
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: TOESTUB contracts — suppression schema + ledger parse
        run: cargo run -p vox-code-audit --bin validate-toestub-contracts

      - name: Safety inventory baseline (committed contracts/reports/safety-inventory)
        run: ./target/debug/vox ci safety-inventory --check contracts/reports/safety-inventory/baseline.v1.json

      - name: Hardcoded values audit gate
        run: node tools/hardcoded-values-audit.mjs .vox/audit/ci-gate --ci-gate contracts/reports/hardcoded-baseline-count.txt

      - name: Completion quality audit + gates (LLM premature-completion SSOT)
        run: |
          ./target/debug/vox --quiet ci completion-audit
          ./target/debug/vox --quiet ci completion-gates --mode enforce

      - name: Detector rule SSOT — F1 score gate (contracts/code-audit/rules.v1.yaml)
        run: |
          ./target/debug/vox --quiet ci detect-rules-bench \
            --rules contracts/code-audit/rules.v1.yaml \
            --fixtures-root contracts/code-audit/fixtures \
            --min-f1 0.70

      - name: TOESTUB full crates/ — syn parse failure budget (JSON envelope)
        env:
          VOX_TOESTUB_MAX_RUST_PARSE_FAILURES: 3
        run: |
          set -euo pipefail
          cargo run -p vox-code-audit -q --bin toestub -- --mode audit --format json --min-severity info crates \
            | ./target/debug/vox --quiet ci toestub-budget

      - name: vox-cli build timings (default + GPU/stub + per-crate lanes; wall-clock)
        env:
          VOX_BENCHMARK_TELEMETRY: "1"
          # H.79: enforce soft build budget caps — fails if any lane exceeds budgets.json
          VOX_BUILD_TIMINGS_BUDGET_FAIL: "1"
        run: ./target/debug/vox --quiet ci build-timings --crates

      - name: vox-cli feature matrix + no vox_orchestrator imports
        run: ./target/debug/vox --quiet ci feature-matrix && ./target/debug/vox --quiet ci no-vox-orchestrator-import

      - name: Workspace-wide all-features check (A.4)
        run: cargo check --workspace --all-features

      - name: Optional CUDA feature compile (Oratio + Populi Candle, when nvcc exists)
        run: ./target/debug/vox --quiet ci cuda-features

      - name: Mens corpus mix (strict required sources)
        run: |
          ./target/debug/vox --quiet run --interp scripts/ci/corpus_prep.vox
          ./target/debug/vox --quiet mens corpus mix --config mens/config/mix.yaml

      - name: Populi CI gate matrix (single manifest)
        run: ./target/debug/vox --quiet ci mens-gate --profile ci_full

  # Single required-status check for branch protection. Keep this job's `name:`
  # identical to the existing required check ("Check, Build, and Test (Rust)")
  # so branch-protection settings carry over without admin action.
  ci-summary:
    name: Check, Build, and Test (Rust)
    # gui-playwright-smoke is now a tiered (post-merge/`full-ci`) job, so it is
    # intentionally NOT a required-gate dependency.
    needs: [guards-fast, lints, compiler-gates, tests, audits]
    if: always()
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 2
    steps:
      - name: All required jobs succeeded
        run: |
          set -euo pipefail
          fail=0
          for r in \
            "${{ needs.guards-fast.result }}" \
            "${{ needs.lints.result }}" \
            "${{ needs.compiler-gates.result }}" \
            "${{ needs.tests.result }}" \
            "${{ needs.audits.result }}"; do
            if [ "$r" != "success" ]; then fail=1; fi
          done
          exit $fail

  visualizer-ingest-smoke:
    name: Visualizer ingest unit (pnpm + tsx)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install + run ingest tests
        run: |
          cd apps/experimental/visualizer
          pnpm install
          pnpm run test:ingest

  web-vite-build-smoke:
    name: Web Vite build smoke (pnpm)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Vite production build (full_stack_minimal)
        env:
          VOX_WEB_VITE_SMOKE: "1"
        run: cargo nextest run -p vox-integration-tests --test web_vite_smoke_test --run-ignored ignored-only --no-capture

  vox-vscode-extension:
    name: VS Code extension (compile + lint)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: npm ci + compile (includes MCP + activation parity) + lint
        run: |
          cd apps/editor/vox-vscode
          npm ci
          npm run compile
          npm run lint

  mesh-compose-config:
    name: Validate examples/mesh-compose.yml
    # `docker compose config` only parses/validates the YAML (no daemon, no DinD),
    # so a GitHub-hosted runner — which ships Docker Compose v2 — is the right host.
    # The self-hosted `docker`-labelled runner container lacks the compose plugin
    # (`docker compose` → exit 127), which previously hard-failed this required check.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: docker compose config (mesh example)
        run: docker compose -f examples/mesh-compose.yml config

  docker-vox-image-smoke:
    name: Docker build smoke (default + mesh)
    # Tier: heavy (~30m). Run post-merge (push to main) + on PRs labelled
    # `full-ci`; skip routine PR pushes (not a required check).
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: [self-hosted, linux, x64, docker]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: docker build default image
        run: docker build -t vox:ci-smoke .
      # Blessed doc name: vox:ci-mesh-worker (same image as historical vox:ci-mesh); see vox-cross-platform-runbook.md
      - name: docker build mesh worker image (mesh + script-execution)
        run: docker build --build-arg VOX_CLI_FEATURES=populi,script-execution -t vox:ci-mesh -t vox:ci-mesh-worker .

  # Chromium/CDP (chromiumoxide): requires Chrome or Chromium on the runner (browser pool).
  # Canonical crate is `vox-plugin-browser` (historical `vox-browser` crate removed).
  vox-browser-cdp-smoke:
    name: vox-plugin-browser CDP smoke (Chromium)
    # Tier: heavy (~15m). Post-merge + `full-ci` label only.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: [self-hosted, linux, x64, browser]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-browser-smoke-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-browser-smoke-
            ${{ runner.os }}-cargo-

      # Prefer nextest for ignored-only integration tests when present; compile-check so the lane
      # stays meaningful until CDP tests land on `vox-plugin-browser`.
      - name: CDP smoke (ignored tests or compile fallback)
        env:
          VOX_BROWSER_NO_SANDBOX: "1"
        shell: bash
        run: |
          set -euo pipefail
          LIST="$(cargo nextest list -p vox-plugin-browser --lib --run-ignored ignored-only 2>/dev/null || true)"
          if [ -z "${LIST//[$'\t\r\n ']}" ]; then
            echo "::notice::No ignored lib tests in vox-plugin-browser; running compile-only CDP smoke."
            cargo check -p vox-plugin-browser
          else
            cargo nextest run -p vox-plugin-browser --lib --run-ignored ignored-only --no-capture
          fi

  gui-playwright-smoke:
    name: GUI Playwright golden route (full_stack_minimal)
    # Tier: heavy (~25m). Post-merge + `full-ci` label only.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: [self-hosted, linux, x64, browser]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      # Typecheck the hand-authored GUI frontend (tsc --noEmit). The GUI build
      # is `vite build` (esbuild, no type errors), so without this a missing
      # property / undefined component (e.g. the Icon.plus crash that blanked the
      # whole app) ships undetected. Fails fast, before the heavier golden route.
      - name: GUI frontend typecheck (tsc --noEmit)
        run: |
          cd crates/vox-gui/ui
          pnpm install --prefer-offline
          pnpm typecheck

      # Registry-driven visual-audit sweep: screenshots every GUI surface (derived from
      # SURFACE_REGISTRY, so new surfaces are covered automatically) and asserts no error-
      # boundary trip / uncaught error / console error. Reuses the deps installed above and
      # only pulls Chromium (cached on this browser runner), so it costs seconds — and runs
      # before the heavier Rust golden route so a broken surface fails fast.
      - name: GUI visual-audit sweep (Playwright)
        run: |
          cd crates/vox-gui/ui
          pnpm exec playwright install chromium
          pnpm exec playwright test --project=chromium --workers=4

      - name: Upload GUI visual-audit screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gui-visual-audit
          path: |
            crates/vox-gui/ui/e2e/screens
            crates/vox-gui/ui/playwright-report
          if-no-files-found: ignore

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-gui-playwright-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-gui-playwright-
            ${{ runner.os }}-cargo-

      - name: Install Playwright deps + Chromium
        run: |
          cd crates/vox-integration-tests
          pnpm install --prefer-offline
          pnpm exec playwright install chromium

      - name: Golden route (ignored integration test)
        env:
          VOX_GUI_PLAYWRIGHT: "1"
        run: cargo nextest run -p vox-integration-tests --test playwright_golden_route_test --run-ignored ignored-only --no-capture

  all-features-matrix:
    name: All-Features Check (${{ matrix.crate }})
    # Tier: heavy (~30 crates × 10-15m). Post-merge + `full-ci` label only —
    # the single biggest per-PR load. Not a required check.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: [self-hosted, linux, x64, docker]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        crate:
          - vox-compiler
          - vox-codegen
          - vox-cli
          - vox-actor-runtime
          - vox-db
          - vox-db-types
          - vox-secrets
          - vox-orchestrator
          - vox-vcs
          - vox-populi
          - vox-ml-cli
          - vox-gamify
          - vox-oratio
          - vox-schola
          - vox-skills
          - vox-scientia-ingest
          - vox-doc-pipeline
          - vox-mcp-registry
          - vox-package
          - vox-primitives
          - vox-config
          - vox-crypto
          - vox-code-audit
          - vox-openclaw-runtime
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-matrix-${{ matrix.crate }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-matrix-${{ matrix.crate }}-
            ${{ runner.os }}-cargo-
      - name: Check with all features
        run: cargo check -p ${{ matrix.crate }} --all-features

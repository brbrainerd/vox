# actionlint configuration — https://github.com/rhysd/actionlint
# Declares this repo's custom self-hosted runner labels so actionlint does not flag
# `runs-on: [self-hosted, linux, x64, docker|browser]` as unknown-label errors.
# (self-hosted, linux, x64, arm, arm64 are built-in; docker/browser are ours.)
self-hosted-runner:
  labels:
    - docker
    - browser

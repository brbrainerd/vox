# Dependabot configuration.
#
# Keeps dependencies current across the Rust workspace, GitHub Actions, and the
# TypeScript/npm packages. Cargo minor+patch updates are grouped into a single PR
# ("rust-deps") to cut noise; major bumps land as individual PRs so they can be
# reviewed in isolation. npm entries are only declared for directories that
# actually contain a package manifest.
version: 2

updates:
  # Rust workspace (single virtual manifest at the root).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      rust-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by the workflows in .github/workflows.
  # Grouped for the same reason as npm below: an action bump touches up to 28
  # workflow files at once, and one PR per action serialises them all behind the
  # single required check.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # npm packages (one entry per directory that has a package.json AND is built
  # or tested by a workflow -- an unbuilt manifest only generates noise).
  #
  # Every npm entry groups minor+patch into one PR per directory, mirroring the
  # cargo "rust-deps" group above. Ungrouped, a single week produced 14 open PRs
  # against a merge gate that admits roughly one run at a time.
  - package-ecosystem: "npm"
    directory: "/clients/runtime-web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/clients/runtime-types"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/apps/editor/vox-vscode"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/apps/experimental/visualizer"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/crates/vox-integration-tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Vox Axis (the going-forward GUI). 40 dependencies, embedded into every
  # vox-gui build via tauri.conf.json's frontendDist and exercised by four
  # workflows -- it had no coverage at all while the retiring vox-vscode had five.
  - package-ecosystem: "npm"
    directory: "/crates/vox-gui/ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # 2.6.1 -> 3.6.0 silently removes the keyboard focus ring from every
      # button. tailwind-merge v3 targets Tailwind v4, where `outline-2` sets
      # the width AND implies `outline-style: solid`, so collapsing it with a
      # bare `outline` is correct there. This package pins tailwindcss ^3.4.19,
      # where they are separate core plugins (node_modules/tailwindcss/src/
      # corePlugins.js: outlineStyle:2458, outlineWidth:2471) -- so v3 drops
      # `focus-visible:outline` and the 2px width applies to a style of `none`.
      # Found by A/B over 1457 real class strings from src/; exactly one output
      # differed, and it was Button.tsx:52/:70, the shared button. tailwind-merge
      # declares no peerDependency on tailwindcss, so nothing warns, and no test
      # asserts on merged class output. Closed as PR #495.
      # REMOVE THIS ENTRY as part of the Tailwind v4 migration, not before --
      # the two versions are a matched pair. See
      # docs/superpowers/plans/2026-09-05-p8-tailwind-v4-migration.md (Task 8).
      - dependency-name: "tailwind-merge"

  # Documentation site (Astro). Built by docs-quality.yml and the link checker.
  - package-ecosystem: "npm"
    directory: "/docs-astro"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # 0.38 -> 0.41 (a "minor" bump under 0.x semver, so it lands in the
      # group above by default) declares `peerDependencies: { astro: "^7.0.2" }`.
      # This repo pins astro ^6.0.1. Grouped with five otherwise-safe updates,
      # it broke the whole group: "Cannot read properties of undefined
      # (reading 'name')" in @astrojs/markdown-satteri's isSatteriProcessor,
      # confirmed by checking the declared peer directly (verified on PR #485).
      # Remove this entry only alongside a deliberate, verified astro 7 migration.
      - dependency-name: "@astrojs/starlight"
      # TEMPORARY, paired with the astro 6 -> 7 upgrade that retires it.
      # 0.10.0 -> 0.11.0 swapped its `@astrojs/mdx` dep from ^5.0.4 to ^7.0.0,
      # and mdx 7 declares `peerDependencies: { astro: "^7.0.0" }`. On our
      # astro ^6 that resolves anyway (pnpm warns, does not fail) and then dies
      # at bundle time: `"chunkToString" is not exported by
      # astro/dist/runtime/server/index.js, imported by @astrojs/mdx/dist/server.js`
      # -- an astro 7 runtime API. Measured absent in BOTH 6.1.9 and 6.4.8.
      # This shipped to main and broke `pnpm build` for the whole docs site;
      # pinning back to 0.10.0 restores it (931 pages, exit 0).
      # DO NOT leave this here indefinitely: astro 7.3.1 is stable, and the
      # astro 6 -> 7 upgrade retires BOTH this entry and the @astrojs/starlight
      # one above (starlight 0.41 declares astro ^7.0.2). Remove both together
      # as part of that upgrade.
      - dependency-name: "starlight-llms-txt"

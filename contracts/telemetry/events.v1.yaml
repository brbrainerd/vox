    description: "D3 — Socrates confidence fusion decision."

  - id: orch.routing.tier
    constant: METRIC_TYPE_MODEL_TIER_ROUTE
    owner_crate: vox-orchestrator
    sensitivity: S1
    description: "D1 — Model tier routing decision (Economy / Standard / Strong)."

  - id: orch.plan.mode_decision
    constant: METRIC_TYPE_PLAN_MODE_DECISION
    owner_crate: vox-orchestrator
    sensitivity: S1
    description: "D2 — Plan-mode vs. ReAct mode decision."

  - id: orch.hitl.interrupt
    constant: METRIC_TYPE_HITL_INTERRUPT
    owner_crate: vox-orchestrator
    sensitivity: S1
    description: "D9 — HITL interrupt; human-in-the-loop escalation triggered."

  - id: orch.risk.score
    constant: METRIC_TYPE_RISK_SCORE
    owner_crate: vox-orchestrator
    sensitivity: S1
    description: "D5 — Risk matrix score event."

  - id: orch.privacy.route_decision
    constant: METRIC_TYPE_PRIVACY_ROUTE_DECISION
    owner_crate: vox-orchestrator
    sensitivity: S1

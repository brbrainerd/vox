# ─────────────────────────────────────────────────────────────────────────────
# blind_spots — failure modes the workspace cares about that emit NO event
# today. Each entry is a tracked gap. When a metric_type is added to address
# one, move the entry here into `metric_types` above and delete it from this
# list.
# ─────────────────────────────────────────────────────────────────────────────
blind_spots:
  - failure_mode: plugin_load_failure
    description: "vox-plugin-host fails to load a cdylib plugin (missing symbol, ABI mismatch, panic at init)."
    owner_crate: vox-plugin-host
    proposed_metric_type: plugin.load_failure
    notes: "Error paths exist in actor-runtime/src/builtins/mod.rs but no record_event! call."

  - failure_mode: sandbox_timeout
    description: "vox-scientia / actor-runtime sandbox terminated a child process after timeout."
    owner_crate: vox-actor-runtime
    proposed_metric_type: sandbox.timeout_kill
    notes: "agent_exec_time tracks durations but not timeout-terminated runs."

  - failure_mode: cache_miss
    description: "LLM-provider response cache lookup missed (currently only hits are tracked via cache_read_input_tokens)."
    owner_crate: vox-orchestrator-mcp
    proposed_metric_type: orch.cache.miss
    notes: "Asymmetry with cache_read_input_tokens on ModelCallEvent — miss rates are computed offline today."

  - failure_mode: task_cancellation
    description: "A task was explicitly cancelled mid-execution (user interrupt, parent timeout, etc.)."
    owner_crate: vox-orchestrator
    proposed_metric_type: orch.task.cancelled
    notes: "No ErrorEvent fires on cancel today; cancellation paths are invisible in research_metrics."

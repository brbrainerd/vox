    owner_crate: vox-orchestrator
    sensitivity: S1
    description: "D6 — Circuit breaker trip; doom-loop detected. Reasons: NoProgress, SameError, ToolThrash, NgramOverlap, SemanticDrift."

  - id: orch.socrates.fusion
    constant: METRIC_TYPE_SOCRATES_FUSION
    owner_crate: vox-orchestrator

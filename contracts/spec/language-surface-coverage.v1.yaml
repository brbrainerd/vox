  # are pre-declared as `todo` with a planned fixture name; later Sequencing
  # Steps (Tasks 4-9 of this plan) each flip their own row to `status:
  # covered` in the same commit that lands the fixture below, per this
  # file's "same PR" policy. Do not flip these to `covered` ahead of the
  # fixture landing -- a ledger claiming coverage it doesn't have is exactly
  # the failure mode this file exists to prevent. ---

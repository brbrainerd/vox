x-vox-version: 1
schema_version: 2
description: >
  Status-bar tile catalog and layout schema for the vox-gui shell. The tiles
  render in BottomStatusBar (they were originally a top HUD; the name is kept
  for config compatibility). Runtime configs are validated client-side via
  useHudTiles.ts and persisted under gui.hud.tiles.v1 (see
  shell-persistence.v1.yaml). v1 configs are migrated forward on read.

tile_kinds:
  - active_agents
  - queue_depth
  - budget_burn
  - mesh_peers
  - active_model
  - openrouter_spend
  - pending_approvals
  - vram_total
  - session_spend
  - build_version

data_bindings:
  active_agents:
    source: orchestrator_status
    field: agent_count
  queue_depth:
    source: orchestrator_status
    field: queue_depth
  budget_burn:
    source: orchestrator_status
    field: budget_burn_usd
  mesh_peers:
    source: orchestrator_status
    field: peers.length
  active_model:
    source: transport
    method: get_active_model
  openrouter_spend:
    source: transport
    method: get_llm_spend
  pending_approvals:
    source: orchestrator_status
    field: approvals_pending
  vram_total:
    source: orchestrator_status
    field: total_vram_gb
  session_spend:
    source: transport
    method: get_llm_spend
  build_version:
    source: transport
    method: get_build_info

tile_shape:
  id: string # must match a tile_kinds entry
  kind: string # one of tile_kinds
  enabled: boolean

# Bar-level display options. Deliberately excluded: budget cap values (owned by
# VoxConfig / `vox config set` — the caps the budget guard enforces; a second
# editor here would fork that SSOT), freshness thresholds (derived from daemon
# event cadence), and tile->data bindings (this file is their SSOT).
options_shape:
  density: string          # labeled | compact
  show_freshness: boolean  # the live/poll/offline pill
  spend_poll_seconds: int  # 10..3600, cadence for get_llm_spend

config_shape:
  version: 2
  tiles:
    - tile_shape
  options:
    - options_shape

default_options:
  density: labeled
  show_freshness: true
  spend_poll_seconds: 60

default_profile:
  version: 2
  tiles:
    - id: active_agents
      kind: active_agents
      enabled: true
    - id: queue_depth
      kind: queue_depth
      enabled: true
    - id: budget_burn
      kind: budget_burn
      enabled: true
    - id: mesh_peers
      kind: mesh_peers
      enabled: true
    - id: active_model
      kind: active_model
      enabled: true
    - id: openrouter_spend
      kind: openrouter_spend
      enabled: true
    - id: pending_approvals
      kind: pending_approvals
      enabled: true
    - id: vram_total
      kind: vram_total
      enabled: false
    - id: session_spend
      kind: session_spend
      enabled: false
    - id: build_version
      kind: build_version
      enabled: false
  options:
    density: labeled
    show_freshness: true
    spend_poll_seconds: 60

# Gamify Economy contract v1 — numeric reward/tuning SSOT.
#
# This file externalizes the NUMERIC economy constants that were previously
# baked directly into `crates/vox-gamify/src/reward_policy.rs` and
# `crates/vox-gamify/src/streak.rs`. The hard-coded values in those modules
# remain the in-code fallback default (the canonical SSOT default); this file
# is overlaid ON TOP of those defaults by `economy::load_economy`. Any key
# omitted here keeps its hard-coded default, so a partial or absent file is
# always safe and behavior-preserving.
#
# The shipped values below are IDENTICAL to the current hard-coded defaults.
# A regression test (reward_policy / economy module) asserts this equality so
# the file is provably consumed and behavior is preserved.
x-vox-version: 1
version: 1
title: Vox Gamify Economy v1
description: >
  Single data-file source of truth for the gamify reward table and the scalar
  tuning constants (anti-grind taper, streak bonus, novelty, trust tiers,
  daily streak XP). Overlays onto in-code defaults; missing keys fall back.

# ── Scalar tuning constants ───────────────────────────────────────────────
# Mirrors reward_policy.rs constants and the streak.rs daily-bonus formula.
tuning:
  # Anti-grind tiered decay (reward_policy::apply_policy).
  # After GRIND_TAPER_END occurrences in a session, taper to 0.1x; past
  # grind_zero_threshold the reward is fully suppressed.
  grind_taper_end: 30
  grind_zero_threshold: 31
  # Tiered grind caps: (full_cap, half_cap). Below full_cap → 1.0x; between
  # full_cap and half_cap → 0.5x; up to grind_taper_end → 0.1x.
  grind_caps_high_frequency: [8, 14] # mcp_tool_called, message_sent, etc.
  grind_caps_default: [15, 25]
  # Novelty bonus applied to the first occurrence of each event type.
  novelty_factor: 1.5
  # Streak bonus: +streak_bonus_per_day per day, capped at streak_bonus_cap_days.
  streak_bonus_per_day: 0.02
  streak_bonus_cap_days: 25
  # Learning-mode crystal jitter modulus (deterministic 0..jitter_modulus-1).
  learning_jitter_modulus: 4
  # Daily login streak XP bonus (streak::calculate_bonus): base*streak capped.
  daily_streak_base_bonus: 10
  daily_streak_bonus_cap: 100

# ── Trust-tier reward multipliers ─────────────────────────────────────────
# Mirrors reward_policy::trust_tier_multiplier.
trust_tier_multipliers:
  novice: 0.5
  linked: 1.0
  proven: 1.2
  master: 1.5

# ── Reward table ──────────────────────────────────────────────────────────
# Per-event base rewards. Overlays onto reward_policy::base_reward(); any event
# omitted here keeps its hard-coded default. Fields: xp, crystals, lumens
# (default 0), grant_shield (default false). Only entries that differ from a
# bare (xp, crystals) need lumens/grant_shield.

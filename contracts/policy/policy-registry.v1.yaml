      # FIX — use a pure-Rust crate or vox-crypto
      [dependencies]
      chacha20poly1305 = "0.10"
      # or: vox-crypto = { path = "crates/vox-crypto" }
  default_enabled: true
  protected: false
  origin: builtin
- id: code-audit/vox/effect/missing-net-decl
  domain: code-audit-rule
  title: Effect Missing Net Declaration Detector
  group: Language rules / Vox idioms
  description: Detects public or endpoint functions in Vox files that perform HTTP or network calls without declaring `@uses(net)` on the function.
  severity: warn
  blocking: false
  runs_on:
  - pre-commit
  - pre-push
  - ci
  source:
    kind: pattern
    ref: contracts/code-audit/rules.v1.yaml#vox/effect/missing-net-decl
    detail: |-
      // VIOLATION — pub fn calls http.get but lacks @uses(net)
      pub fn fetch_prices(symbol: str) -> List[Price] {
          http.get("/prices/" + symbol)  // network call not declared!
      }

      // FIX — add @uses(net) before the function
      @uses(net)
      pub fn fetch_prices(symbol: str) -> List[Price] {
          http.get("/prices/" + symbol)
      }
  default_enabled: true
  protected: false
  origin: builtin
- id: code-audit/vox/effect/pure-violated
  domain: code-audit-rule
  title: Pure Function Impure Call Detector
  group: Language rules / Vox idioms
  description: Detects `@pure fn` declarations in Vox files that contain impure builtin calls such as HTTP, file I/O, database, random, logging, or concurrency primitives.
  severity: warn
  blocking: false
  runs_on:
  - pre-commit
  - pre-push
  - ci
  source:
    kind: pattern
    ref: contracts/code-audit/rules.v1.yaml#vox/effect/pure-violated
    detail: |-
      // VIOLATION — @pure fn contains an impure side-effect call
      @pure
      fn format_amount(amount: f64) -> str {
          log.info("formatting")  // IMPURE: logging is a side effect
          "$" + amount.to_string()
      }

      // FIX — remove the side-effect call
      @pure
      fn format_amount(amount: f64) -> str {
          "$" + amount.to_string()
      }
  default_enabled: true
  protected: false
  origin: builtin
- id: code-audit/vox/llm/direct-provider-call
  domain: code-audit-rule
  title: LLM Direct Provider Call Detector
  group: Language rules / Vox idioms
  description: Detects direct HTTP calls to known LLM provider hostnames that bypass populi.* builtins.
  severity: error
  blocking: true
  runs_on:
  - pre-commit

  - pre-commit
  - pre-push
  - ci
  source:
    kind: pattern
    ref: contracts/code-audit/rules.v1.yaml#vox/secret/env-get-shape
    detail: |-
      // VIOLATION — reading secret-shaped env var directly
      let api_key = env.get("OPENAI_API_KEY")

      // FIX — use the Clavis secret manager
      let api_key = vox_secrets::resolve_secret(SecretId::OpenAiApiKey)?
  default_enabled: true

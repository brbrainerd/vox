- id: code-audit/ai-laziness
  domain: code-audit-rule
  title: AI Laziness Patterns
  group: Language rules / AI-laziness
  description: 'Catches subtle AI cop-outs: placeholder string returns, ''implement later'' comments, mock-named functions shipped to prod, custom-type default returns, conditional stubs, assertion-only bodies, and early-return-only bodies.'
  severity: warn
  blocking: false
  runs_on:
  - pre-commit
  - pre-push
  - ci
  source:
    kind: pattern
    ref: contracts/code-audit/rules.v1.yaml#ai-laziness
    detail: |-
      // VIOLATION — AI laziness pattern: placeholder return or 'implement later' comment
      fn calculate_tax(amount: f64, region: &str) -> f64 {
          // TODO: implement tax calculation
          0.0  // placeholder
      }

      // FIX — real implementation; scope down if full implementation is out of scope
      fn calculate_tax(amount: f64, region: &str) -> f64 {
          let rate = TAX_RATES.get(region).copied().unwrap_or(0.0);
          (amount * rate * 100.0).round() / 100.0
      }
  default_enabled: true
  protected: false
  origin: builtin

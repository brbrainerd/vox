  - pre-push
  - ci
  source:
    kind: pattern
    ref: contracts/code-audit/rules.v1.yaml#handler/panicking-builtin
    detail: |-
      // VIOLATION — .unwrap() inside @handler crashes the whole actor on None/Err
      @handler
      fn on_payment(msg: PaymentMsg) -> Result<(), Err> {
          let record = db.find(msg.id).unwrap();  // panics if not found → kills actor
          Ok(())
      }

      // FIX — propagate with ? so the handler returns Err gracefully
      @handler
      fn on_payment(msg: PaymentMsg) -> Result<(), DbError> {
          let record = db.find(msg.id)?;
          Ok(())
      }

  source:
    kind: pattern
    ref: contracts/code-audit/rules.v1.yaml#arch/workspace_drift
    detail: |-
      # VIOLATION — sub-crate Cargo.toml using path/version directly (workspace drift)
      [dependencies]
      serde = { version = "1", features = ["derive"] }  # bad: duplicates root version
      tokio = { path = "../../tokio" }                   # bad: use workspace = true

      # FIX — inherit from workspace
      [dependencies]
      serde = { workspace = true }
      tokio = { workspace = true }
  default_enabled: true
  protected: false
  origin: builtin
- id: code-audit/control-flow/option-combinator-opportunity
  domain: code-audit-rule
  title: Option Combinator Opportunity Detector
  group: Language rules / General
  description: Detects `match` over an `Option` that can be replaced with `.map(...)` or `.unwrap_or(...)` combinators.
  severity: info
  blocking: false
  runs_on:
  - pre-commit
  - pre-push
  - ci
  source:
    kind: pattern
    ref: contracts/code-audit/rules.v1.yaml#control-flow/option-combinator-opportunity
    detail: |-
      // VERBOSE — two-arm match over Option
      let display_name = match user.nickname {
          Some(n) => n.to_uppercase(),
          None => "Anonymous".to_string(),
      };

      // IDIOMATIC — use Option combinator
      let display_name = user.nickname
          .map(|n| n.to_uppercase())
          .unwrap_or_else(|| "Anonymous".to_string());
  default_enabled: true
  protected: false
  origin: builtin
- id: code-audit/control-flow/question-mark-opportunity
  domain: code-audit-rule
  title: Question Mark Opportunity Detector
  group: Language rules / General
  description: Detects `match` over a `Result` that can be replaced with the `?` operator.
  severity: info
  blocking: false
  runs_on:
  - pre-commit
  - pre-push
  - ci
  source:
    kind: pattern
    ref: contracts/code-audit/rules.v1.yaml#control-flow/question-mark-opportunity
    detail: |-
      // VERBOSE — manual match on Result for error propagation
      fn load_config(path: &str) -> Result<Config, Error> {
          let content = match std::fs::read_to_string(path) {
              Ok(s) => s,
              Err(e) => return Err(e.into()),
          };
          // ...
      }

      // IDIOMATIC — use the ? operator
      fn load_config(path: &str) -> Result<Config, Error> {
          let content = std::fs::read_to_string(path)?;
          // ...
      }
  default_enabled: true
  protected: false
  origin: builtin

  description: Detects near-duplicate code blocks within the same file
  severity: warn
  blocking: false
  runs_on:
  - pre-commit
  - pre-push
  - ci
  source:
    kind: pattern
    ref: contracts/code-audit/rules.v1.yaml#dry-violation
    detail: |-
      // VIOLATION — near-duplicate function bodies (copy-paste)
      fn validate_email(s: &str) -> bool {
          let s = s.trim();
          s.contains('@') && s.len() > 3 && !s.starts_with('@')
      }
      fn validate_login(s: &str) -> bool {
          let s = s.trim();
          s.contains('@') && s.len() > 3 && !s.starts_with('@')  // identical body!
      }

      // FIX — extract the shared logic
      fn is_valid_email_format(s: &str) -> bool {
          let s = s.trim();
          s.contains('@') && s.len() > 3 && !s.starts_with('@')
      }
      fn validate_email(s: &str) -> bool { is_valid_email_format(s) }
      fn validate_login(s: &str) -> bool { is_valid_email_format(s) }
  default_enabled: true
  protected: false

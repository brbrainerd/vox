  origin: builtin
- id: code-audit/vox/workflow/non-deterministic-builtin
  domain: code-audit-rule
  title: Workflow Non-Deterministic Builtin Detector
  group: Language rules / Vox idioms
  description: Detects calls to non-deterministic builtins inside workflow blocks or workflow functions in Vox source files. Workflows must be deterministic for replay safety.
  severity: error
  blocking: true
  runs_on:
  - pre-commit
  - pre-push
  - ci
  source:
    kind: pattern
    ref: contracts/code-audit/rules.v1.yaml#vox/workflow/non-deterministic-builtin
    detail: |-
      // VIOLATION — time.now() inside a @workflow body
      @workflow fn process_order(id: str) {
          let started_at = time.now()  // non-deterministic!
      }

      // FIX — pass timestamp as input parameter
      @workflow fn process_order(id: str, started_at: str) {
          // use started_at from caller
      }
  default_enabled: true
  protected: false
  origin: builtin

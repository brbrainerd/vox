    bug_class: type-error
    difficulty: easy
    scope: single-file
    detection_mode: static
    mens_training_eligible: false
    fixed_training_eligible: true
    repair_pair_eligible: true
    files:
      buggy: "problems/001-type-return-mismatch/buggy.vox"
      fixed: "problems/001-type-return-mismatch/fixed.vox"
      meta:  "problems/001-type-return-mismatch/meta.toml"


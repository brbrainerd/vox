# CI policy.
ci:
  minimum_viable:
    count: 15                             # 3 per class minimum to land harness
    distribution_required: true
  rate_measurement:
    temperature: 0.0
    seed: 42
    attempts_per_fixture: 5
    scoring: "majority-success"           # >= 3 of 5 attempts passing = fixture passed
    per_file_budget_attempts: 3           # vox repair's existing default
    project_iteration_budget: 10          # outer loop attempts

# Council ratification log (D13, 2026-05-15).
council_ratification_log:
  - id: repair-corpus-iteration-budget
    decision: "10 outer attempts per project (vox repair . retry budget)."
    ratified_at: "2026-05-15"
    rationale: "Aligned with vox-cli/src/commands/repair.rs existing 3-attempt-per-file × ~3 files cap."
  - id: repair-corpus-cost-ceiling
    decision: "$1.50 per project median across panel."
    ratified_at: "2026-05-15"
    rationale: >
      Subordinate to CR-L0's $5/spec ceiling; a single CR-L0 spec may invoke
      project-scope repair once or twice during its outer agent loop.
  - id: repair-corpus-training-eligibility
    decision: >
      buggy.vox files are never MENS-training-eligible. fixed.vox files are
      eligible as standalone positive examples. (buggy, fixed) pairs are
      eligible for repair fine-tuning only (separate pipeline from MENS general).
    ratified_at: "2026-05-27"
    rationale: >
      Training on buggy code as a positive example would degrade model quality.
      The repair pair is a supervised (input→output) signal, not a standalone
      positive example.

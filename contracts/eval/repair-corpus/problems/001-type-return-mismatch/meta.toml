id = "001"
title = "Return type mismatch: annotated int but returns str"
description = """
Function status_code is annotated to return int but every branch
returns a string literal ("ok" / "fail"). The fix is to return integer
values (0 / 1) instead.
"""
bug_class = "type-error"
difficulty = "easy"
scope = "single-file"
detection_mode = "static"
expected_diagnostics = ["vox/types/type-mismatch"]

ci:
  minimum_viable:
    count: 15                             # 3 wave-1 + 9 wave-2 + 3 wave-3 to land harness
    wave_distribution_required: true
  rate_measurement:
    temperature: 0.0
    seed: 42
    attempts_per_fixture: 5
    scoring: "majority-success"
    plan_loop_iteration_budget: 5         # plan_loop.rs default; tunable per fixture
    cost_ceiling_per_plan_usd: 0.75       # subordinate to CR-L0's $5/spec ceiling

council_ratification_log:
  - id: plan-fidelity-wave-definition
    decision: >
      Wave 1 = single-file edits; Wave 2 = multi-file with decorator
      discipline (matches [CR-D1] usage); Wave 3 = cross-cutting
      (effects/workflow purity/retirement migration).
    ratified_at: "2026-05-15"
    rationale: "Preserves existing [CR-D1] 'Wave 2' semantics; renaming would re-open the April approval."
  - id: plan-fidelity-source
    decision: >
      Harvest from orchestrator session transcripts (post-P2.1 telemetry) +
      hand-curate for quality. Author-from-scratch reserved for filling
      wave-distribution gaps if harvested transcripts skew toward one wave.
    ratified_at: "2026-05-15"
    rationale: "Real transcripts produce realistic plans; gaps filled by hand."
  - id: plan-fidelity-training-eligibility
    decision: >
      Fixture TOML files are training_eligible = true (task descriptions + success
      criteria, no buggy code). Agent attempt transcripts from measurement runs must
      NOT enter MENS general training without human review; they are supervised
      (task→plan→outcome) signals suitable only for plan-fidelity fine-tuning.
    ratified_at: "2026-05-27"
    rationale: >
      Parallel policy to repair-corpus training-eligibility guard. Plan-fidelity
      fixtures describe good tasks; the agent's attempts (successful or failed)
      are a different pipeline from general positive-example training.

id = "plan-004-refactor-loop"
wave = "wave_2"
description = "Extract a duplicated validation into a helper fn."
max_steps = 4
max_cost_usd = 0.75

prompt = """
Two @endpoint mutation fns each duplicate a 4-line validation
sequence (empty-check + length-cap-check returning Error variants).
Extract the duplicated logic into a single helper `validate_title(s:
str) to Result[str, TodoError]` and call it from both endpoints. The
endpoint signatures must not change.
"""

[[steps]]
step = 1
verb = "scan"
description = "Locate the duplicated validation in both endpoints."

[[steps]]
step = 2
verb = "extract"
description = "Add the helper fn."

[[steps]]
step = 3
verb = "callsite-update"
description = "Replace duplicated blocks with calls to the helper."

[[steps]]
step = 4
verb = "verify"
description = "vox check passes and the existing @test blocks still run."

[success_criteria]
vox_check_passes = true
helper_fn_added = true
duplicate_logic_removed = true
endpoint_signatures_unchanged = true

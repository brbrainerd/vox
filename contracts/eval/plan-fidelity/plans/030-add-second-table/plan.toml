id = "plan-030-add-second-table"
wave = "wave_2"
description = "Add a second @table type to a project that already has one."
max_steps = 4
max_cost_usd = 0.75

prompt = """
The base has `@table type User { id: str, name: str }`. Add a second
`@table type Note { id: str, body: str }`. Do not modify the existing
User table.

Vox conventions to honor (the base source already follows them):
  - `len(s)` (builtin), not `s.len()`.
  - `Error(VariantName(payload))` for ADT errors, not `Err(...)`.
  - `Ok(x)` / `Error(...)` are the Result constructors.
  - Variant constructors are referenced bare.
"""

[[steps]]
step = 1
verb = "scan"
description = "Read the existing @table type User."

[[steps]]
step = 2
verb = "write"
description = "Append the new @table type Note."

[[steps]]
step = 3
verb = "verify"
description = "vox check passes."

[[steps]]
step = 4
verb = "verify-tests"
description = "Existing @test blocks still run clean."

[success_criteria]
vox_check_passes = true
second_table_added = true
existing_table_unchanged = true

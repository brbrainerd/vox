id = "plan-014-add-auth-endpoint"
wave = "wave_2"
description = "Add a second bearer-authed query @endpoint alongside an existing one."
max_steps = 4
max_cost_usd = 0.75

prompt = """
The base file defines a single `@endpoint(kind: query) @auth(scheme:
bearer) fn get_todo(...)` plus a `Todo` @table. Add a sibling
endpoint
`@endpoint(kind: query) @auth(scheme: bearer) fn list_todos() to List[Todo]`
that returns an empty `List[Todo]` placeholder (`return []`). Do not
modify the existing endpoint or the table.

Vox conventions to honor (the base source already follows them):
  - `len(s)` (builtin), not `s.len()`.
  - `Error(VariantName(payload))` for ADT errors, not `Err(...)`.
  - `Ok(x)` / `Error(...)` are the Result constructors.
  - Variant constructors are referenced bare (e.g. `Missing("...")`),
    not as `TodoError.Missing(...)`.
  - ADTs use `type X = | A | B(field: T)` syntax.
"""

[[steps]]
step = 1
verb = "scan"
description = "Read the existing endpoint and @table to mirror style."

[[steps]]
step = 2
verb = "add"
description = "Append the new `list_todos` endpoint with matching decorators."

[[steps]]
step = 3
verb = "verify"
description = "vox check passes."

[[steps]]
step = 4
verb = "verify-tests"
description = "Existing @test blocks still run clean."

[success_criteria]
vox_check_passes = true
new_endpoint_added = true
auth_decorator_present = true
existing_endpoint_unchanged = true

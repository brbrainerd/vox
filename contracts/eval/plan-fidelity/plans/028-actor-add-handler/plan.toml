id = "plan-028-actor-add-handler"
wave = "wave_2"
description = "Add a new handler to an existing actor."
max_steps = 4
max_cost_usd = 0.75

prompt = """
The base has an `actor ChatRoom` with `on join(user: str) to str` and
`on leave(user: str) to str`. Add a third handler
`on send_msg(user: str, text: str) to str` that returns
`"msg:" + user + ":" + text`. Do not change existing handler bodies.

Vox conventions to honor (the base source already follows them):
  - `len(s)` (builtin), not `s.len()`.
  - `Error(VariantName(payload))` for ADT errors, not `Err(...)`.
  - `Ok(x)` / `Error(...)` are the Result constructors.
  - Variant constructors are referenced bare.
"""

[[steps]]
step = 1
verb = "scan"
description = "Read the existing actor declaration."

[[steps]]
step = 2
verb = "write"
description = "Append the `on send_msg` handler inside the actor body."

[[steps]]
step = 3
verb = "verify"
description = "vox check passes."

[[steps]]
step = 4
verb = "verify-tests"
description = "Existing @test blocks still run clean."

[success_criteria]
vox_check_passes = true
handler_added = true
existing_handlers_unchanged = true

# vox:skip
id = "plan-fidelity-012-add-health-check-query-endpoint"
training_eligible = true
wave = 2                                  # multi-file, decorator coverage

[input]
goal = """
Add `@query fn health_check() to str` to `src/api.vox`. The function body must \
return the string `"ok"`. No authentication is required. \
Add `@test fn test_health_check_returns_ok` to `tests/api_test.vox` \
(create the file if it does not exist) that asserts `health_check() is "ok"`. \
Run `vox check --strict && vox test --filter=test_health_check_returns_ok`.
"""
preconditions = """
`src/api.vox` exists with at least one other endpoint function and compiles clean. \
`tests/api_test.vox` may or may not exist. \
`vox check --strict` passes at HEAD. No `health_check` function exists yet.
"""

[plan_expected_shape]
min_steps = 3
max_steps = 6
must_include_tasks = ["add-endpoint", "add-test", "verify-compile"]
must_include_decorator_calls = ["@query", "@test"]

[success_criteria]
command = "vox check --strict && vox test --filter=test_health_check_returns_ok"
expected_exit = 0
file_must_contain = [
  { path = "src/api.vox", regex = "@query" },
  { path = "src/api.vox", regex = "fn health_check" },
  { path = "src/api.vox", regex = "\"ok\"" },
  { path = "tests/api_test.vox", regex = "test_health_check_returns_ok" },
]

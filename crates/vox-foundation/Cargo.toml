[package]
name = "vox-foundation"
description = "Utility umbrella: primitives (ids/backoff/agentos-mutation), protocol (daemon wire types), and tracing-init (tracing_subscriber presets). Consolidates vox-primitives, vox-protocol, and vox-tracing-init."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
workspace-hack = { workspace = true }

[lints]
workspace = true

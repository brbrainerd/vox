[package]
name = "vox-orchestrator-mcp"
description = "MCP (Model Context Protocol) tool layer for vox-orchestrator. Extracted in 2026-05-08 reorg Phase 4."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gui-visual-review"
path = "src/bin/gui-visual-review.rs"
required-features = ["gui-visual-review"]

[features]
default = ["toestub-gate", "json-schema"]
# Mirrors the parent orchestrator features. The crate is always compiled with
# axum/rmcp/schemars (mcp-native is the whole point), so those are not optional.
news-publish = [
    "dep:vox-publisher",
    "vox-orchestrator/news-publish",
    "vox-publisher/scientia-reddit",
    "vox-publisher/scientia-youtube",
    "vox-publisher/scholarly-external-jobs",
]
toestub-gate = ["vox-orchestrator/toestub-gate"]
json-schema = ["vox-orchestrator/json-schema"]
populi-transport = ["vox-orchestrator/populi-transport", "vox-populi/transport"]
# Per-model token estimation (tiktoken-rs) for context-window compaction.
# Mirrors vox-orchestrator/token-counting; shipping binaries opt in.
token-counting = ["vox-orchestrator/token-counting"]
oratio-rerank = ["dep:vox-speech"]
gui-visual-review = []
# Chromium CDP browser automation (`vox_browser_*`, ~1.1k LoC). OFF by default so
# `cargo check -p vox-orchestrator-mcp` skips the heaviest optional MCP surface.
# Shipping binaries (vox-cli mcp-server, vox-orchestrator-d, vox-gui) opt back in.
heavy-browser = []
# `vox harness eval`'s eval-gate golden tasks (`eval_gate_agent_loop_terminates_check`
# in chat_tools/chat/agent_loop.rs) need a real wiremock server at runtime, outside
# `cargo test`. OFF by default so plain consumers of this crate (vox-server, vox-gui,
# ...) never link a mock-HTTP-server crate; `vox-cli` opts in explicitly.
eval-gate = ["dep:wiremock"]

[dependencies]
vox-orchestrator-driver = { workspace = true }
vox-orchestrator = { path = "../vox-orchestrator", default-features = false, features = ["runtime"] }
vox-research-shim = { workspace = true, features = ["runtime", "gamify"] }
# T2.2: shared daemon-ensure helper (spawn/ping/auth `vox-orchestrator-d`) so
# the stdio MCP server's tool-call path routes through the same daemon the
# GUI uses, instead of booting a private ServerState. Only the `orchestrator`
# feature's module (`daemon_ipc::orchestrator_daemon_ensure`) is used here.
vox-cli-core = { workspace = true, features = ["orchestrator"] }

# MCP-stack deps (always compiled when this crate is in the build)
axum = { workspace = true, default-features = false, features = ["http1", "json", "tokio", "ws"] }
axum-extra = { workspace = true, features = ["typed-header"] }
rmcp = { workspace = true, features = [
    "server",
    "client",
    "transport-io",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
schemars = { workspace = true, features = ["derive"] }
tower-http = { workspace = true, features = ["cors"] }

# Workspace deps the moved code references
vox-compiler.workspace = true
vox-codegen.workspace = true
vox-codegen-ts.workspace = true
vox-grammar-export.workspace = true
vox-mcp-registry.workspace = true
vox-capability-registry.workspace = true
vox-openai.workspace = true
vox-project-scaffold.workspace = true
vox-skills.workspace = true
vox-openclaw-runtime.workspace = true
vox-plugin-host.workspace = true
vox-skill-discovery.workspace = true
vox-plugin-types.workspace = true
vox-similarity.workspace = true
vox-plugin-catalog.workspace = true
vox-orchestrator-types.workspace = true

vox-db.workspace = true
vox-redact.workspace = true
vox-scientia.workspace = true
vox-search = { workspace = true }  # tantivy/web-scrape gated graph-wide via vox-cli heavy-retrieval (WS2-T3)
vox-config.workspace = true
vox-graph-reader.workspace = true
vox-repository = { workspace = true, features = ["json-schema"] }
vox-package.workspace = true
vox-gamify.workspace = true
vox-corpus = { workspace = true, features = ["database"] }
vox-secrets.workspace = true
vox-telemetry.workspace = true
vox-bounded-fs.workspace = true
vox-jsonschema-util.workspace = true
vox-foundation.workspace = true
vox-mesh-types.workspace = true
vox-research-events.workspace = true
vox-crypto.workspace = true
vox-actor-runtime.workspace = true
vox-code-audit.workspace = true
vox-lsp.workspace = true
vox-populi = { workspace = true }
tower-lsp-server = { workspace = true }
vox-http-client.workspace = true
vox-publisher = { workspace = true, optional = true, default-features = false }
vox-speech = { workspace = true, optional = true, features = ["compiler-rerank"] }

# Standard deps
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml.workspace = true
toml = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
anyhow.workspace = true
futures-util = { workspace = true }
async-stream.workspace = true
parking_lot = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
regex = { workspace = true }
glob.workspace = true
ignore = { workspace = true }
walkdir.workspace = true
sha2 = { workspace = true }
sha3 = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
blake3.workspace = true
base64.workspace = true
rand.workspace = true
governor = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
tempfile.workspace = true
xxhash-rust = { workspace = true }
tiktoken-rs = { workspace = true }
dirs = { workspace = true }
which = { workspace = true }
crossbeam-queue = { workspace = true }
globset = { workspace = true }
workspace-hack = { workspace = true }
# Optional, gated by the `eval-gate` feature (default OFF): the eval-gate
# check function purpose-built for `vox harness eval`
# (`eval_gate_agent_loop_terminates_check` in chat_tools/chat/agent_loop.rs)
# stands up a wiremock server at runtime, in normal (non-`#[cfg(test)]`)
# code, so `vox-cli`'s eval gate binary can call it outside `cargo test`.
# NOT a plain dependency: linking a mock-HTTP-server crate into every
# consumer of this crate (vox-server, vox-gui, ...) by default would corrupt
# the dependency manifest's signal value for anyone auditing prod deps.
# `vox-cli` opts in explicitly via `features = [..., "eval-gate"]`.
wiremock = { workspace = true, optional = true }

[build-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_yaml = { workspace = true }

[dev-dependencies]
vox-plugin-api = { workspace = true }
tower = { workspace = true, features = ["util"] }
serial_test.workspace = true
jsonschema.workspace = true
# Unconditionally available under `cargo test` regardless of the `eval-gate`
# feature (existing tests in agent_loop.rs/local_health.rs use it); the
# feature-gated optional [dependencies] entry above is only what makes it
# reachable from non-test code (the eval-gate check functions).
wiremock.workspace = true

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
# Mirror the workspace `clippy::all = "warn"` baseline, with one per-rule
# override: `collapsible_if` is allowed locally. This crate has ~80 instances
# dominated by tool-dispatch `match` arms (chat_tools / dispatch.rs / llm_bridge)
# that would only become marginally clearer when collapsed; the dispatch surface
# is a planned restructuring target — not a per-site mechanical edit. Tracking
# debt — see `docs/src/architecture/rust-warning-audit-backlog-2026.md`.
all = { level = "warn", priority = -1 }
collapsible_if = "allow"
collapsible_match = "allow"

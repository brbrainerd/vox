[plugin]
id = "skill-memory"
name = "Vox Memory Skill"
version = "0.1.0"
description = "Agent-facing skill for memory and context management."
license = "Apache-2.0"

[plugin.host]
min-vox-version = "0.5.0"

[plugin.payload]
kind = "skill"
format-version = 1
skill-md = "memory.skill.md"

[plugin.payload.tools]
exposes = ["vox_memory_store", "vox_memory_recall", "vox_memory_search", "vox_memory_log", "vox_memory_list_keys", "vox_knowledge_query", "vox_session_create", "vox_session_list", "vox_session_info", "vox_session_compact", "vox_session_cleanup"]

[package]
name = "vox-gamify"
description = "Gamification layer for Vox — companions, quests, battles, and free AI integration"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["vox", "gamification", "ai", "games"]
categories = ["game-development", "development-tools"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
reqwest = { workspace = true }
vox-http-client = { workspace = true }
vox-openai = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures-util = { workspace = true }
async-stream = { workspace = true }
thiserror = { workspace = true }
owo-colors = { workspace = true }
bytes = { workspace = true }
rand = { workspace = true }
chrono = { workspace = true }
vox-db = { workspace = true, features = ["host-integration"] }
vox-config = { workspace = true, features = ["llm-egress"] }
vox-llm-egress = { workspace = true }
vox-actor-runtime = { workspace = true }
vox-secrets = { workspace = true }
turso = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
vox-bounded-fs = { workspace = true }
tracing = { workspace = true }
vox-mesh-types = { workspace = true }
schemars = { workspace = true }
xxhash-rust = { workspace = true }
workspace-hack = { version = "0.6", path = "../workspace-hack" }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true


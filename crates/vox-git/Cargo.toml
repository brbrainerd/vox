[package]
name = "vox-git"
description = "Pure-Rust Git bridge for Vox — bidirectional sync using gix (no C, no libgit2)"
version.workspace = true
edition.workspace = true

[features]
default = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
vox-bounded-fs = { workspace = true }
anyhow.workspace = true
tokio = { workspace = true }
# gix: pure Rust Git implementation — no C, no libgit2.
# Used for all low-level Git object / ref / transport operations.
gix = { workspace = true, default-features = false, features = [
    "blocking-network-client",
    "blocking-http-transport-reqwest",
    "progress-tree",
    "revision",
    "sha1",
] }
workspace-hack = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = { workspace = true }

[lints]
workspace = true


[package]
name = "vox-plugin-webhook"
version.workspace = true
edition.workspace = true
publish = false
description = "Webhook plugin: HTTP listener with HMAC signature verification (GitHub, generic; GitLab deprecated)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vox-plugin-api   = { workspace = true }
vox-config       = { workspace = true }
vox-http-client  = { workspace = true }
abi_stable       = { workspace = true }
anyhow           = { workspace = true }
async-trait      = { workspace = true }
axum             = { workspace = true, features = ["macros"] }
data-encoding    = { workspace = true }
ed25519-dalek    = { workspace = true }
reqwest          = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
sha2             = { workspace = true }
sha3             = { workspace = true }
thiserror        = { workspace = true }
tokio            = { workspace = true, features = ["rt-multi-thread", "sync", "net", "time"] }
tracing          = { workspace = true }

[lints]
workspace = true

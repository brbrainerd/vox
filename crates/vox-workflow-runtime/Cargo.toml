[package]
name = "vox-workflow-runtime"
description = "Interpreted workflow execution MVP (local + mens activity hooks)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Default features mirror the host-build profile: SQL-backed tracker, the
# DB-backed scheduled-runner, and mens. Mobile cross-compile uses
# `--no-default-features` (optionally re-adding `mens` if the device wants
# to participate in a mesh; today mobile doesn't).
default = ["mens", "sql"]
# `sql` enables the VoxDbTracker + scheduled-runner modules that depend on
# vox-db (which pulls in SQLite and therefore can't cross-compile to mobile).
sql = ["dep:vox-db"]
# `mens` now spans two planes: `vox-mesh-transport` (iroh) serves Noop /
# Snapshot / Join / Heartbeat, and `vox-populi/transport` (HTTP) still serves
# Dispatch / Wait, which the mesh cannot execute. Phase 6 drops the latter.
mens = [
    "dep:vox-populi",
    "vox-populi/transport",
    "dep:vox-mesh-transport",
    "dep:iroh",
]
test-support = []

[dependencies]
vox-config = { workspace = true }
anyhow = { workspace = true }
base64 = "0.22"
blake3 = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
vox-compiler = { workspace = true }
vox-db = { workspace = true, optional = true }
vox-mesh-transport = { workspace = true, optional = true }
iroh = { workspace = true, optional = true }
vox-populi = { workspace = true, optional = true }
vox-runtime = { path = "../vox-runtime" }
vox-journal = { path = "../vox-journal" }
workspace-hack = { version = "0.6", path = "../workspace-hack" }

[dev-dependencies]
vox-compiler = { workspace = true }
jsonschema = { workspace = true, default-features = false, features = ["resolve-file"] }

[lints]
workspace = true

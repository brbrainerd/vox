# vox-plugin-catalog SSOT
#
# Every first-party Vox plugin and distribution bundle is declared here.
# After editing: `cargo build -p vox-plugin-catalog` validates the file.
# Regenerate the human-readable docs with:
#     vox ci generate-plugin-catalog-docs
#
# See: docs/src/architecture/plugin-system-redesign-2026.md
# See: docs/src/reference/plugin-catalog.md

# ── Hardware / ML plugins ──────────────────────────────────────────────────────

[[plugin]]
id = "nvml-probe"
payload-kind = "code"
description = "Probes NVIDIA GPUs via NVML for device count, names, memory, utilization, temperature."
status = "stable"
extension-points = ["HardwareProbe"]
requires-tag = "nvidia-gpu"
default-source = "local:crates/vox-plugin-nvml-probe"
bundled-in = ["vox-ml", "vox-dev"]

[[plugin]]
id = "mens-candle-cuda"
payload-kind = "code"
description = "ML training backend using Candle with CUDA acceleration."
status = "beta"
extension-points = ["MlBackend"]
requires-tag = "nvidia-gpu"
# Ships as a release asset of vox's own repo, not a separate plugin repo --
# see install_from_catalog's FIRST_PARTY_PLUGIN_REPO check. No version or
# sha256 pinned here: both derive at install time from the running binary's
# version and that release's checksums.txt.
default-source = "github:vox-foundation/vox"
bundled-in = ["vox-ml", "vox-dev"]

[[plugin]]
id = "mens-candle-metal"
payload-kind = "code"
description = "ML training backend using Candle with Metal acceleration."
status = "beta"
extension-points = ["MlBackend"]
requires-tag = "apple-silicon"
# Same first-party release-asset model as mens-candle-cuda above.
default-source = "github:vox-foundation/vox"
bundled-in = ["vox-ml-metal", "vox-dev"]

# ── Audio / speech ─────────────────────────────────────────────────────────────

[[plugin]]
id = "oratio"
payload-kind = "code"
description = "Audio capture + speech-to-text (Candle Whisper). Extracted from vox-speech in Unit 4."
status = "beta"
extension-points = ["AudioCapture", "SpeechToText"]
default-source = "github:vox-foundation/vox-plugin-oratio"
bundled-in = ["vox-dev"]

# ── Cloud / mesh ───────────────────────────────────────────────────────────────
# Cloud sync (vox-plugin-cloud / CloudSync) is deferred — not in the default catalog.
# The crate remains at crates/vox-plugin-cloud for future extraction work.

[[plugin]]
id = "populi-mesh"
payload-kind = "composite"
description = "Populi mesh transport (HTTP control plane, A2A dispatch) + agent skill."
status = "alpha"
extension-points = ["MeshDriver"]
exposes-tools = ["vox_populi_local_status", "vox_orchestrator_status", "vox_submit_task"]
default-source = "github:vox-foundation/vox-plugin-populi-mesh"
bundled-in = ["vox-mesh", "vox-server", "vox-dev"]

# ── Skill plugins ──────────────────────────────────────────────────────────────
#
# execution-api and stub-check removed 2026-05-08: no crate exists for either;
# placeholder entries with bundled-in=[] provided no value and pointed to non-existent repos.
# Restore if/when the actual plugin crates are created.

[[plugin]]
id = "skill-compiler"
payload-kind = "skill"
description = "Agent-facing skill describing the Vox compiler tools."
status = "stable"
exposes-tools = ["vox_validate_file", "vox_run_tests", "vox_check_workspace"]
default-source = "github:vox-foundation/vox-plugin-skill-compiler"
bundled-in = ["vox-fullstack", "vox-ml", "vox-dev"]

[[plugin]]
id = "skill-git"
payload-kind = "skill"
description = "Agent-facing skill describing Vox git integration tools."
status = "stable"
exposes-tools = ["vox_my_files", "vox_claim_file", "vox_transfer_file", "vox_check_file_owner"]
default-source = "github:vox-foundation/vox-plugin-skill-git"
bundled-in = ["vox-fullstack", "vox-dev"]

[[plugin]]
id = "skill-memory"
payload-kind = "skill"
description = "Agent-facing skill for memory and context management."
status = "stable"
exposes-tools = ["vox_memory_store", "vox_memory_recall", "vox_memory_search", "vox_memory_log", "vox_memory_list_keys", "vox_knowledge_query", "vox_session_create", "vox_session_list", "vox_session_info", "vox_session_compact", "vox_session_cleanup"]
default-source = "github:vox-foundation/vox-plugin-skill-memory"
bundled-in = ["vox-fullstack", "vox-edge", "vox-server", "vox-dev"]

[[plugin]]
id = "skill-orchestrator"
payload-kind = "skill"
description = "Agent-facing skill for task submission, status, budget, multi-agent coordination."
status = "stable"
exposes-tools = ["vox_submit_task", "vox_task_status", "vox_orchestrator_status", "vox_complete_task", "vox_fail_task", "vox_cancel_task", "vox_rebalance", "vox_queue_status", "vox_lock_status", "vox_budget_status", "vox_agent_events"]
default-source = "github:vox-foundation/vox-plugin-skill-orchestrator"
bundled-in = ["vox-fullstack", "vox-server", "vox-mesh", "vox-dev"]

[[plugin]]
id = "skill-rag"
payload-kind = "skill"
description = "Agent-facing skill for retrieval-augmented generation."
status = "beta"
exposes-tools = ["vox_visual_rag_query"]
default-source = "github:vox-foundation/vox-plugin-skill-rag"
bundled-in = ["vox-fullstack", "vox-dev"]

[[plugin]]
id = "skill-testing"
payload-kind = "skill"
description = "Agent-facing skill for test-runner integration."
status = "stable"
exposes-tools = ["vox_run_tests", "vox_test_all"]
default-source = "github:vox-foundation/vox-plugin-skill-testing"
bundled-in = ["vox-fullstack", "vox-dev"]

[[plugin]]
id = "skill-testing-validate"
payload-kind = "skill"
description = "Agent-facing skill for test validation diagnostics."
status = "stable"
exposes-tools = ["vox_validate_file", "vox_validate_source"]
default-source = "github:vox-foundation/vox-plugin-skill-testing-validate"
bundled-in = ["vox-fullstack", "vox-dev"]

[[plugin]]
id = "skill-v0"
payload-kind = "skill"
description = "Generate React/Vox UI components from text prompts (v0.dev-style synthesis)."
status = "deprecated"
exposes-tools = ["vox_generate_code", "vox_write_file"]
default-source = "github:vox-foundation/vox-plugin-skill-v0"
bundled-in = ["vox-fullstack", "vox-edge"]

# ── Infrastructure ─────────────────────────────────────────────────────────────

[[plugin]]
id = "webhook"
payload-kind = "code"
description = "Inbound webhook HTTP listener with HMAC signature verification (GitHub, generic; GitLab deprecated)."
status = "stable"
extension-points = ["HttpListener"]
default-source = "local:crates/vox-plugin-webhook"
bundled-in = ["vox-server", "vox-dev"]

[[plugin]]
id = "browser"
payload-kind = "code"
description = "Chrome DevTools Protocol browser automation via chromiumoxide."
status = "alpha"
extension-points = ["BrowserAutomation"]
default-source = "github:vox-foundation/vox-plugin-browser"
bundled-in = ["vox-dev"]

[[plugin]]
id = "runtime-wasm"
payload-kind = "code"
description = "Skill-runtime plugin: wasmtime-based WASI sandbox (default for pure-compute skills). Faster cold start than containers, no external daemon."
status = "beta"
extension-points = ["SkillRuntime"]
default-source = "local:crates/vox-plugin-runtime-wasm"
bundled-in = ["vox-fullstack", "vox-edge", "vox-dev"]

[[plugin]]
id = "runtime-container"
payload-kind = "code"
description = "Skill-runtime plugin: Docker and Podman backends for sandboxed skill execution."
status = "alpha"
extension-points = ["SkillRuntime"]
default-source = "local:crates/vox-plugin-runtime-container"
bundled-in = ["vox-server"]

[[plugin]]
id = "publication"
payload-kind = "code"
description = "RSS/Atom ingest with semantic dedup; multi-platform publish (Reddit, YouTube, scholarly feeds)."
status = "alpha"
extension-points = ["Publication"]
default-source = "local:crates/vox-plugin-publication"
bundled-in = []

# ── Optional components (companion binaries, NOT cdylib plugins) ─────────────────
#
# A component is a first-party Vox executable that ships alongside the host
# binary but is installed on demand. Unlike [[plugin]] entries it is not loaded
# by the plugin host and implements no extension-point trait. CLI-only users
# never fetch these.

[[component]]
id = "gui"
binary = "vox-gui"
description = "Vox Native GUI — a Tauri desktop app for browsing surfaces, running commands, and the Scientia dashboard."
status = "beta"
default-source = "github:vox-foundation/vox"

[component.requires]
os = ["windows", "macos", "linux"]
arch = ["x86_64", "aarch64"]

# ── Distribution bundles ────────────────────────────────────────────────────────

[[bundle]]
id = "vox-base"
description = "Bare host binary, no plugins."
status = "stable"
plugins = []

[[bundle]]
id = "vox-fullstack"
description = "Default developer experience with all built-in skill plugins."
status = "stable"
plugins = [
    "skill-compiler", "skill-testing", "skill-testing-validate", "skill-memory",
    "skill-git", "skill-orchestrator", "skill-rag", "skill-v0",
    "runtime-wasm",
]

[[bundle]]
id = "vox-ml"
description = "Fullstack plus ML/GPU code plugins (NVIDIA CUDA stack)."
status = "beta"
extends = "vox-fullstack"
plugins = ["mens-candle-cuda", "nvml-probe"]

[[bundle]]
id = "vox-ml-metal"
description = "Fullstack plus ML/GPU code plugins (Apple Metal stack)."
status = "beta"
extends = "vox-fullstack"
plugins = ["mens-candle-metal"]

[[bundle]]
id = "vox-mesh"
description = "Server-side mesh deployment."
status = "alpha"
extends = "vox-base"
plugins = ["populi-mesh", "skill-orchestrator"]

[[bundle]]
id = "vox-server"
description = "Headless backend deployment: orchestrator + mesh, no GUI/ML."
status = "beta"
extends = "vox-base"
plugins = ["populi-mesh", "skill-orchestrator", "skill-memory", "webhook", "runtime-container"]

[[bundle]]
id = "vox-edge"
description = "Edge / on-device deployment: lightweight runtime + local skills, no cloud or mesh."
status = "beta"
extends = "vox-base"
plugins = ["skill-compiler", "skill-memory", "skill-v0", "runtime-wasm"]

[[bundle]]
id = "vox-dev"
description = "Contributor / power-user development environment: fullstack + ML + mesh + audio."
status = "stable"
extends = "vox-fullstack"
plugins = [
    "mens-candle-cuda", "nvml-probe", "mens-candle-metal",
    "populi-mesh", "oratio",
    "browser", "webhook",
]

[[bundle]]
id = "vox-mobile"
description = "Mobile-optimized deployment: lightweight skill runtime for iOS/Android (React Native / Expo). Planned for v0.8."
status = "alpha"
extends = "vox-base"
plugins = []

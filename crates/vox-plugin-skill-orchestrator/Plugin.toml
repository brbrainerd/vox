[plugin]
id = "skill-orchestrator"
name = "Vox Orchestrator Skill"
version = "0.1.0"
description = "Agent-facing skill for task submission, status, budget, multi-agent coordination."
license = "Apache-2.0"

[plugin.host]
min-vox-version = "0.5.0"

[plugin.payload]
kind = "skill"
format-version = 1
skill-md = "orchestrator.skill.md"

[plugin.payload.tools]
exposes = ["vox_submit_task", "vox_task_status", "vox_orchestrator_status", "vox_complete_task", "vox_fail_task", "vox_cancel_task", "vox_rebalance", "vox_queue_status", "vox_lock_status", "vox_budget_status", "vox_agent_events"]

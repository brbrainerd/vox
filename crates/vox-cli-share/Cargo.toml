[package]
name = "vox-cli-share"
description = "Public-URL tunneling for `vox share` (LAN / Cloudflare / localhost.run / Tailscale), extracted from vox-cli."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-std", "macros", "rt-multi-thread"] }
async-trait = { workspace = true }
axum = { workspace = true, features = ["http1", "json", "tokio", "ws"] }
hyper-util = { workspace = true }
reqwest = { workspace = true, features = ["multipart"] }
rand = { workspace = true }
form_urlencoded = "1.2.2"
base64 = { workspace = true }
dirs = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
sha2 = { workspace = true }
which = { workspace = true }
vox-config = { workspace = true }
vox-http-client = { workspace = true }

[lints]
workspace = true

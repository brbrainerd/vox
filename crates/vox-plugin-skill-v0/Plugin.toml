[plugin]
id = "skill-v0"
name = "Vox v0 Skill"
version = "0.1.0"
description = "Generate React/Vox UI components from text prompts (v0.dev-style synthesis)."
license = "Apache-2.0"

[plugin.host]
min-vox-version = "0.5.0"

[plugin.payload]
kind = "skill"
format-version = 1
skill-md = "v0.skill.md"

[plugin.payload.tools]
exposes = ["vox_generate_code", "vox_write_file"]

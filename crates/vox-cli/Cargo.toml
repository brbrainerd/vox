vox-compiler = { workspace = true }
vox-codegen = { workspace = true }
vox-rn-codegen = { workspace = true }
vox-graph-reader = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
miette = { workspace = true }
anyhow = { workspace = true }
cargo_metadata = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true, features = ["multipart"] }
vox-http-client = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
strsim = { workspace = true }
sha2.workspace = true
tokio = { workspace = true, features = ["io-std"] }
vox-cli-core = { workspace = true }
vox-cli-ci = { workspace = true }
vox-cli-share = { workspace = true }
vox-cli-research = { workspace = true }
vox-cli-review = { workspace = true, optional = true }
vox-cli-contracts = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
vox-package = { workspace = true }

vox-eval = { workspace = true }
vox-container = { workspace = true }
vox-wasm-engine = { workspace = true, optional = true }
vox-deploy-codegen = { workspace = true }
# Non-optional: `harness::live_eval::build_eval_server_state` (Task 5, `--live` golden corpus)
# needs `vox_skills::new_registry_arc`/`SkillRegistry` directly, and vox-orchestrator-mcp already
# pulls this crate in unconditionally (its own `vox-skills.workspace = true` is not optional), so
# making it non-optional here adds no new build weight.
vox-skills = { workspace = true }
vox-openclaw-runtime = { workspace = true, optional = true }
vox-skill-discovery = { workspace = true, optional = true }
vox-gamify = { workspace = true, optional = true }
vox-config = { workspace = true }
vox-secrets = { workspace = true }
vox-oauth-pkce = { workspace = true }
vox-db = { workspace = true, features = ["host-integration", "legacy-import"] }
vox-sql = { workspace = true, features = ["postgres", "mysql"] }
vox-research-events = { workspace = true }
vox-term             = { path = "../vox-term" }
# `vox-scientia::ro_crate::MainEntity` is the input shape for the replay
# handler; not pulled in via the producers crate.
vox-scientia = { workspace = true }
# Lean by default (qdrant-vector + tavily). The heavy tantivy full-text + web-scrape
# stacks are gated behind the `heavy-retrieval` feature (off by default; shipped
# release binaries enable it). See WS2-T3.
vox-search = { workspace = true }
# `vox-plugin-publication` is intentionally NOT a direct dep here. The CLI
# routes `db/publication/ingest.rs` through `vox-plugin-host`'s ABI surface
# (the `Publication` extension point on `VoxPlugin`) to keep the heavy
# `feed-rs` / `vox-publisher` transitive deps out of the default CLI build.
# Scholarly / DB-backed jobs only; Reddit/YouTube adapter code stays out of default CLI compile.
vox-publisher = { workspace = true, features = ["scholarly-external-jobs"] }
vox-doc-inventory = { workspace = true }
vox-code-audit = { workspace = true, optional = true }
vox-drift-check = { workspace = true }
# vox-drift-check uses vox-code-audit types; make it available for drift_check.rs
# (also already pulled in by optional features above; this avoids feature-gate conditional)

toml = { workspace = true }
vox-doc-pipeline = { path = "../vox-doc-pipeline" }
vox-research-shim = { workspace = true, features = ["runtime", "gamify"] }
vox-orchestrator = { workspace = true }
vox-orchestrator-driver = { workspace = true }
# Shipping MCP server: keep the full default tool surface (news/scientia/visus/browser).
# The crate's own default drops these for fast standalone iteration; binaries opt back in.
vox-orchestrator-mcp = { workspace = true, features = ["news-publish", "gui-visual-review", "heavy-browser", "eval-gate"] }
vox-plugin-api = { workspace = true }
vox-plugin-types = { workspace = true }
vox-plugin-catalog = { workspace = true }
toml_edit = { workspace = true }
vox-plugin-host = { workspace = true }
# Needed to construct ROption / RString when dispatching into plugin extension
# trait methods (e.g. the Publication.ingest_tick signature).
abi_stable = { workspace = true }
# `mens`, NOT `mens-train`. vox-cli's only use of this is `vox ci spoke-check`
# (run_body_helpers/guards.rs), which reads domain_profiles + spoke_validate —
# both pure serde. `mens-train` additionally pulls mens-candle-qlora and
# mens-hf-hub (candle-core, candle-nn, qlora-rs, safetensors, tokenizers,
# hf-hub) into every default `vox` build for no benefit: `vox mens train` is a
# passthrough that execs the separate vox-ml-cli binary (see main.rs), so
# vox-cli gains zero command surface from the training stack.
vox-populi = { workspace = true, features = ["mens"] }
vox-mesh-types = { workspace = true }
vox-workflow-runtime = { workspace = true, optional = true }

vox-repository = { workspace = true }
# F1: `vox audit effort` subcommand handler composes the effort-audit pipeline
# (range → walk → judge → emit) + orchestrator model selection.
vox-effort-audit = { workspace = true }
# D3: `vox audit effort-route` subcommand handler composes the effort-route
# pipeline (load → bucket → cluster → route → emit) + orchestrator model selection.
vox-effort-route = { workspace = true }
vox-project-scaffold = { workspace = true }
vox-tauri-codegen = { workspace = true }
turso = { workspace = true }
owo-colors = { workspace = true }
comfy-table = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
glob = { workspace = true }
# `external_review_replay::extract_external_review_rows` is behind `database`; CLI `corpus review-export` needs it.
vox-corpus = { workspace = true, features = ["database", "ast-extract"] }

vox-actor-runtime = { workspace = true }
# Task 12 (free-tier onboarding doctor diagnostic): `EgressError::RateLimited` is the
# real, already-distinct error shape a resolved dispatch produces on a 429 (see
# `vox_llm_egress::EgressError` + `vox_actor_runtime::llm::chat::map_egress_error`,
# which already classifies it as `error_class = "rate-limited"`). `llm_routing.rs`
# needs the type directly to classify it into a doctor `Check`.
vox-llm-egress = { workspace = true }
vox-foundation = { workspace = true }
vox-scaling-policy = { workspace = true }
vox-bounded-fs = { workspace = true, features = ["async"] }
vox-jsonschema-util = { workspace = true }
vox-constrained-gen = { workspace = true }
rand = { workspace = true }

uuid = { workspace = true, features = ["v4"] }
vox-mcp-registry = { path = "../vox-mcp-registry" }
vox-capability-registry = { path = "../vox-capability-registry" }
rmcp = { workspace = true, optional = true, features = ["server", "client", "transport-io"] }
axum = { workspace = true, features = ["http1", "json", "tokio", "ws"] }
vox-grammar-export = { workspace = true }
axum-extra = { workspace = true, features = ["typed-header"] }
notify = { workspace = true }
tokio-stream = { workspace = true, optional = true }

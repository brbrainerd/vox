[package]
name = "vox-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Vox command-line interface: compile, run, bundle, and workspace diagnostics."
# `cargo run -p vox-cli` without `--bin` (binaries: `vox`, `vox-compilerd`, `vox-ml-cli` when `mens-base`).
default-run = "vox"

[package.metadata.wix]
upgrade-guid = "81F3E1E5-8B6D-484F-B19F-8CA168016428"
path-guid = "5B1C6196-857D-409A-8758-BD4CE99BE7BB"
license = false

[package.metadata.deb]
maintainer = "Vox Foundation <contact@vox-foundation.org>"
copyright = "2026, Vox Foundation"
depends = "$auto"

[[bin]]
name = "vox"
path = "src/main.rs"

[[bin]]
name = "vox-compilerd"
path = "src/bin/vox-compilerd.rs"



[features]
# `script-execution` (native `vox run --mode script` lane) is default-on: it is
# lightweight (xxhash cache + OS sandbox helpers, no WASM runtime) and is the
# common dev/CI path. The heavy Wasmtime WASI lane lives behind `script-wasi`
# (see below) so a normal `cargo build -p vox-cli` does NOT pay ~5 min / ~69
# crates of wasmtime+cranelift just to run native scripts.
default = ["keyring-store", "script-execution"]
# OS credential store for `vox login` / `vox auth connect` vault persistence.
# Disable on headless CI builds where no keyring daemon is available.
keyring-store = ["dep:keyring"]
# Fast fuzzy ranking for command catalog, MCP tool picker, dashboard palette.
# Uses nucleo-matcher (same scorer as Helix/Zed). Adds ~300KB to binary.
fuzzy-search = ["dep:nucleo"]
# `vox oratio` / `vox speech` (Speech-to-Code). Currently a marker feature: the
# command delegates to the vox-ml-cli binary as a subprocess (see
# Commands::Oratio in src/lib.rs), so it doesn't link the Candle Whisper stack
# (vox-speech's `stt-candle`) into vox-cli directly. Reserved for a future
# in-process wire-up — see the `#[ignore]`d
# feature_sets_include_populi_oratio_lane test (sunset 2026-08-01) for that
# tracked decision; don't add real deps here without revisiting it.
oratio = []
# Native MCP server runtime previously in vox-mcp binary
mcp-server = [
    "vox-orchestrator/populi-transport",
    "vox-orchestrator-mcp/populi-transport",
    "dep:rmcp",
]
# Enables Arca telemetry replay and persistent DB features (shared with vox-corpus).
database = ["vox-corpus/database"]
# Heavy on-disk retrieval: tantivy full-text index + web-scrape (scraper/html2text).
# OFF by default to keep the CLI lean — resolver-2 feature unification means this
# single switch turns tantivy on across every vox-search instance in the graph
# (vox-orchestrator / vox-research-shim / vox-orchestrator-mcp included). Shipped release
# binaries enable this so end users keep full `vox search`. See WS2-T3.
heavy-retrieval = ["vox-search/tantivy-lexical", "vox-search/web-scrape"]




# Native inline `vox run --mode script` compilation (codegen-rust -> cargo) plus
# the content-addressed script cache and OS sandbox helpers (landlock/win32job).
# Lightweight; default-on. Does NOT include the WASM runtime.
script-execution = [
    "dep:xxhash-rust",
    "dep:landlock",
    "dep:win32job",
]
# WASI isolation lane (`vox run --isolation wasm`, `vox wasm ...`): Wasmtime JIT
# + cranelift + WASI. HEAVY (~69 crates, ~5 min from a warm base). Opt-in.
script-wasi = [
    "script-execution",
    "dep:vox-wasm-engine",
    "dep:wasmtime",
    "dep:wasmtime-wasi",
]
# Axum inference server (`vox mens serve`) + REST execution API; implies `script-execution`.
execution-api = ["script-execution", "dep:tokio-stream"]
# TOESTUB + `commands::diagnostics` (`vox stub-check` shim, architect/clean/compact, Codex persistence in stub_check).
# Implies `completion-toestub`: stub_check::mod unconditionally calls
# status_writer::code_audit_results, which is gated behind that feature.
stub-check = [
    "dep:vox-code-audit",
    "vox-gamify",
    "completion-toestub",
]
# Gamification event emission from otherwise non-gamify code paths
# (telemetry_spool, pipeline, ars::registry) — those sites are behind
# `#[cfg(feature = "vox-gamify")]`. `vox-gamify` is an optional dependency
# referenced only as `dep:vox-gamify`, so Cargo does NOT synthesize an implicit
# feature of that name; without this explicit declaration those three cfgs were
# permanently false (dead code). Named to match the existing cfgs, i.e. exactly
# the implicit feature Cargo would have created had `dep:` not been used.
# Every feature that pulls the crate in (`stub-check`, `extras-ludus`) enables
# this, so the event hooks light up whenever vox-gamify is actually linked.
vox-gamify = ["dep:vox-gamify"]
# Merge `vox-code-audit` victory-claim / premature-done heuristics into `vox ci completion-audit` (CI enables this).
completion-toestub = ["dep:vox-code-audit", "vox-cli-ci/completion-toestub"]
# No-op reserved flag: legacy `vox mens` agent/dei/chat/learn and `runtime/info/status` referred to `vox-dei` (still do not add `vox-dei` as a dependency; see `vox ci no-vox-dei-import`).
# Dashboard UX is the VS Code extension (see `docs/src/reference/cli.md`).
# Native Tauri 2 GUI (replaces dashboard SPA)
gui = []
# OpenClaw / skill registry (`openclaw`); ARS runtime types live in `vox-openclaw-runtime`; `vox-skills` is the marketplace registry.
ars = ["dep:vox-openclaw-runtime", "dep:vox-skill-discovery"]
# Ludus gamification CLI (`commands::extras::ludus`); implies `vox-gamify` (uses `vox-db`).
extras-ludus = ["vox-gamify", "dep:vox-code-audit"]
# Ludus terminal HUD over the in-process orchestrator bulletin (`vox ludus hud`).
ludus-hud = ["extras-ludus"]
# Terminal live event dashboard: `vox live` + `commands::live` (in-process `vox-orchestrator` demo bus).
live = []
# Manage the DEI (Distributed Execution Intelligence) orchestrator.
dei = []
# DEI training and AI operations (mens).
mens-dei = ["dei", "database"]
# Interpreted workflow journal + activities.
workflow-runtime = ["mens-dei", "dep:vox-workflow-runtime"]
# BYOK / config slices in `mens status`, extended `vox doctor`, scope checks (`vox_eval`).
codex = []

# GitHub CodeRabbit batch PRs (`vox review coderabbit …`).
# The implementation lives in the vox-cli-review crate; this feature just pulls it in
# (it carries vox-forge/blake3/vox-code-audit, so those are no longer vox-cli's concern).
coderabbit = [
    "dep:vox-cli-review",
]
# Stub for non-functional inference server when refactoring or debugging.
# Enables all social platform adapters for publication and diagnostics.
scientia-social = [
    "vox-publisher/scientia-reddit",
    "vox-publisher/scientia-twitter",
    "vox-publisher/scientia-linkedin",
    "vox-publisher/scientia-mastodon",
    "vox-publisher/scientia-bluesky",
    "vox-publisher/scientia-discord",
    "vox-publisher/scientia-opencollective",
    "vox-publisher/live-api-canary",
    "vox-orchestrator/news-publish",
]
broken_inference_stub = []


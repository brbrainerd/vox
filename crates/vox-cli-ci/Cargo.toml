[package]
name = "vox-cli-ci"
description = "CI guard checks extracted from vox-cli (runner-policy-check, line-endings, …)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
chrono = { workspace = true }
vox-bounded-fs = { workspace = true }
vox-doc-pipeline = { workspace = true }
vox-jsonschema-util = { workspace = true }
vox-compiler = { workspace = true }
vox-git = { workspace = true }
vox-config = { workspace = true }
vox-http-client = { workspace = true }
vox-secrets = { workspace = true }
owo-colors = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "process", "fs", "io-util", "time"] }
glob = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
walkdir = { workspace = true }
vox-cli-core = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

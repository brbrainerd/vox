[package]
name = "vox-secrets"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Clavis: central secret resolution and OS-keyring vault, from the Vox project."
readme = "README.md"

[features]
default = ["secrets-vox-vault"]
secrets-infisical = []
secrets-vault = []
# Clavis vault backend (turso-backed). ON by default: turning it off replaces the
# vault backend with a loud `BackendUnavailable` stub, it does NOT silently fall
# back to env-only. Only turn it off for crates that never touch the vault
# (e.g. vox-config), to keep `turso_core` off their scoped-build critical path.
secrets-vox-vault = ["dep:turso"]

[dependencies]
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
keyring = { workspace = true }
tracing = { workspace = true }
vox-bounded-fs = { workspace = true }
turso = { workspace = true, optional = true }
aho-corasick = { workspace = true }
vox-crypto = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "rt-multi-thread"] }
blake3 = { workspace = true }
aes-gcm = { workspace = true }
strum = { workspace = true, features = ["derive"] }
hex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

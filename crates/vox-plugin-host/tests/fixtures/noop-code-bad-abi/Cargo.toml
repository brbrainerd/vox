# Empty `[workspace]` makes this fixture a self-contained workspace root, so it
# builds standalone regardless of where the repo is checked out (e.g. from a git
# worktree nested under the main repo). See the noop-code fixture for details.
[workspace]

[package]
name = "vox-plugin-noop-code-bad-abi"
version = "0.1.0"
edition = "2024"
publish = false
description = "Test fixture: a code plugin with a deliberately wrong ABI version for rejection tests."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vox-plugin-api = { path = "../../../../vox-plugin-api" }
abi_stable = "0.11"

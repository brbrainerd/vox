# Empty `[workspace]` makes this fixture a self-contained workspace root, so it
# builds standalone regardless of where the repo is checked out. Without it,
# `cargo build` from a git worktree nested under the main repo resolves the main
# `Cargo.toml` as the workspace and rejects this package (its worktree path is
# not in the main repo's `workspace.exclude`). See vox-plugin-host loader tests.
[workspace]

[package]
name = "vox-plugin-noop-code"
version = "0.1.0"
edition = "2024"
publish = false
description = "Test fixture: a no-op code plugin used by vox-plugin-host loader tests."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vox-plugin-api = { path = "../../../../vox-plugin-api" }
abi_stable = "0.11"

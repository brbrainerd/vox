description = "Trait seam between vox-cli (provides impls) and vox-cli-ci (consumes them), plus shared check-manifest types. Sync, no tokio — keep the floor low."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
vox-config = { workspace = true }
vox-bounded-fs = { workspace = true }
vox-jsonschema-util = { workspace = true }
workspace-hack = { version = "0.6", path = "../workspace-hack" }

[lints]
workspace = true

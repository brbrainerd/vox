[package]
name = "vox-graph-reader"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Read-only BFS traversal, path-finding, and cross-manifest comparison for Vox Graph graph.json exports"

[dependencies]
serde_json = { workspace = true }
serde = { workspace = true }
petgraph = { workspace = true }
leiden-rs = { workspace = true }
tree-sitter = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }
walkdir = { workspace = true }
ignore = { workspace = true }
blake3 = { workspace = true }
syn = { workspace = true, features = ["full", "visit", "clone-impls"] }
lcov-parser = "0.6.0"
workspace-hack = { version = "0.6", path = "../workspace-hack" }

[features]
default = ["tree-sitter-grammars"]
tree-sitter-grammars = ["dep:tree-sitter", "dep:tree-sitter-rust", "dep:tree-sitter-typescript", "dep:tree-sitter-python"]

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

[package]
name = "vox-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Codegen + WebIR + vox_ir extracted from vox-compiler. Consumes analysis types from vox-compiler."
publish = false

[features]
default = []
# Declared (never enabled here) so the `#[cfg(feature = "standalone")]` guards in
# the `#[path]`-embedded vox-codegen-ts/src/mod.rs are known cfgs, not unexpected.
# Embedded build always takes the `not(feature = "standalone")` branch.
standalone = []

[dependencies]
hex = { workspace = true }
vox-compiler = { workspace = true }
vox-tauri-codegen = { workspace = true }
workspace-hack = { version = "0.6", path = "../workspace-hack" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
sha3 = { workspace = true }
flate2 = "1.1.9"
bzip2 = { workspace = true }
zstd = { workspace = true }
miette = { workspace = true }
vox-secrets = { workspace = true }
# Not `workspace = true`: Cargo rejects a member overriding `default-features`
# to `false` when the root `workspace.dependencies.vox-sql` entry leaves it
# implicitly `true` ("`default-features = false` cannot override workspace's
# `default-features`"). `path = "../vox-cli-core"` in vox-langtool/Cargo.toml
# is the in-tree precedent for this same override shape.
vox-sql = { path = "../vox-sql", default-features = false, features = ["postgres", "mysql"] }
vox-config = { workspace = true }
vox-deploy-codegen = { workspace = true }
prettyplease = { workspace = true }
syn = { workspace = true, features = ["full"] }
walkdir.workspace = true
vox-repository.workspace = true
anyhow.workspace = true

[dev-dependencies]
insta = "1"
proptest = { workspace = true }
tempfile = { workspace = true }
# Phase 1 closure test (`tests/durability_compiles.rs`) needs to `use` the
# runtime symbols that codegen emits string references to, so that a rename
# or removal breaks the test compile. Test-only — production codegen does
# not link the runtime.
vox-workflow-runtime = { workspace = true }

[lints]
workspace = true

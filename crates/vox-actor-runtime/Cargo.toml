[package]
name = "vox-actor-runtime"
description = "Process-oriented runtime: actors, mailboxes, supervision, scheduling, LLM/Mens activity primitives."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
## Enables [`crate::db`] — global **Codex** (`vox_db::VoxDb`) connection using `VOX_DB_*` (canonical) with legacy `TURSO_*` fallback.
database = ["dep:vox-db"]

[dependencies]
tokio = { workspace = true }
vox-bounded-fs = { workspace = true }
tokio-stream = { workspace = true }
async-stream = { workspace = true }
vox-openai = { workspace = true }
vox-llm-egress = { workspace = true }
futures-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
vox-config = { workspace = true, features = ["llm-egress"] }
vox-orchestrator-types.workspace = true
vox-foundation.workspace = true
vox-secrets = { workspace = true }
vox-plugin-host = { workspace = true }
vox-skills.workspace = true
vox-openclaw-runtime = { workspace = true }
vox-db = { workspace = true, optional = true }
vox-telemetry = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
vox-http-client = { workspace = true }
# Static-tier scraping (Scrape.* builtins): HTML parse + CSS select + readability text.
scraper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
csv = { workspace = true }
glob = { workspace = true }
which = "8"
xxhash-rust = { workspace = true }
blake3 = { workspace = true }
rust_decimal = { workspace = true }
workspace-hack = { version = "0.6", path = "../workspace-hack" }
tracing-subscriber = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
regex = { workspace = true }
bytes = { workspace = true }
anyhow = { workspace = true }
vox-shell-stdlib-types = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console"] }

[lints]
workspace = true

[dev-dependencies]
serial_test = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }

[package]
name = "vox-db"
description = "Codex / VoxDb facade: schema migrations, store ops, Turso/libSQL access for the Vox workspace."
version.workspace = true
edition.workspace = true

[dependencies]
vox-ast = { workspace = true }
vox-config.workspace = true
vox-db-types = { workspace = true }
vox-orchestrator-types = { workspace = true }
vox-plugin-types = { workspace = true }
async-trait = "0.1.89"
turso = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
sha3 = { workspace = true }
bincode = { workspace = true }
vox-secrets = { workspace = true }
vox-repository = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
blake3 = { workspace = true }
data-encoding = { workspace = true }
keyring = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
vox-mesh-types = { workspace = true }
vox-telemetry = { workspace = true }
workspace-hack = { workspace = true }

[features]
default = ["local"]
local = []
replication = []

[dev-dependencies]
regex = { workspace = true }
tempfile = { workspace = true }
vox-test-harness = { path = "../vox-test-harness" }
# Test-only: arca_compiler_table_parity builds HIR via vox-compiler and emits DDL
# via vox-codegen to assert vox-db's table emit matches. Dev-deps don't link into
# the shipped lib, so vox-db's runtime decoupling from the compiler is preserved.
vox-compiler = { workspace = true }
vox-codegen = { workspace = true }

[[test]]
name = "sync_embedded_replica_integration"
path = "tests/sync_embedded_replica_integration.rs"
required-features = ["replication"]

[lints]
workspace = true


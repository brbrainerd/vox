[package]
name = "vox-forge"
description = "Platform-agnostic Git forge API for Vox — GitHub, Gitea, Forgejo (GitLab deprecated)"
version.workspace = true
edition.workspace = true

[features]
default = []
# Enable GitHub forge implementation.
github = []
# DEPRECATED (2026-06-03): GitLab is no longer a supported forge target.
# The implementation is retained for now but emits a runtime deprecation
# warning and will be removed in a future release. Do not enable for new work.
gitlab = []
# Enable Gitea/Forgejo implementation (API-compatible).
gitea = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow.workspace = true
tokio = { workspace = true }
async-trait = "0.1.89"
# Pure-Rust HTTP + TLS. No OpenSSL, no C.
reqwest = { workspace = true }
vox-http-client = { workspace = true }
workspace-hack = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }

[package]
name = "vox-eval"
description = "Evaluation metrics for model outputs and Vox code samples: deterministic scoring heuristics (format/safety/quality/parse) + MENS CompileVerdict. Not the interpreter — the `--interp` evaluator lives in vox-compiler/src/eval/."
version.workspace = true
edition.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
regex = { workspace = true }
tempfile = { workspace = true }
log = "0.4"
workspace-hack = { workspace = true }
xxhash-rust = { workspace = true }

[lints]
workspace = true


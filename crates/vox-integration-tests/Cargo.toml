[package]
name = "vox-integration-tests"
description = "Cross-crate integration test harness (test-only L5)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dev-dependencies]
serial_test = { workspace = true }
tempfile = { workspace = true }
insta = { workspace = true }
vox-test-harness = { path = "../vox-test-harness" }
tokio = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
jsonschema = { workspace = true, default-features = false, features = ["resolve-file"] }
wiremock = { workspace = true }
# Force deadpool's `rt_tokio_1` feature (see root Cargo.toml).
deadpool = { workspace = true }
tower-lsp-server = { workspace = true }
vox-config = { workspace = true }
vox-repository = { workspace = true }
vox-orchestrator = { workspace = true }
# Integration tests exercise the full MCP tool surface (news/scientia/visus).
vox-orchestrator-mcp = { workspace = true, features = ["news-publish", "gui-visual-review", "heavy-browser"] }
vox-compiler = { workspace = true }
vox-codegen = { workspace = true }
vox-lsp = { workspace = true }
vox-bounded-fs = { workspace = true }
vox-actor-runtime = { workspace = true }
vox-workflow-runtime = { workspace = true }
vox-deploy-codegen = { workspace = true }
vox-skills = { workspace = true }
vox-plugin-api = { workspace = true }
vox-cli = { workspace = true }
vox-scaling-policy = { workspace = true }
vox-secrets = { workspace = true }
vox-speech = { workspace = true }


# Windows UAC installer-detection elevates any .exe whose name contains "install".
# Rename the test binary so it doesn't trigger that heuristic.
[[test]]
name = "skill_deploy_test"
path = "tests/skill_install_test.rs"

[lints]
workspace = true

[dependencies]
pulldown-cmark = "0.13"
walkdir.workspace = true
workspace-hack = { workspace = true }


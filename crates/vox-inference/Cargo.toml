[package]
name = "vox-inference"
description = "MENS inference (Mn-T2): multi-backend dispatcher — Candle CPU/CUDA/Metal, llama.cpp RPC, Ollama — for heterogeneous model execution. Backends implemented; no in-tree consumers yet."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }
vox-hf-layout = { workspace = true }
vox-quantize = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokenizers = { workspace = true }
tracing = { workspace = true }
vox-mesh-types = { workspace = true }
vox-package = { workspace = true }
workspace-hack = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }

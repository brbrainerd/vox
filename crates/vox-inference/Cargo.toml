[package]
name = "vox-inference"
description = "MENS Inference (WIP/Mn-T2): dispatcher and device-specific backends for heterogeneous model execution. Pre-integration — no in-tree consumers yet; see mesh-mens-distributed-training-and-execution-plan-2026.md."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
vox-mesh-types = { workspace = true }
vox-package = { workspace = true }
workspace-hack = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

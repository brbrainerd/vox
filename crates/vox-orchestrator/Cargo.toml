[package]
name = "vox-orchestrator"
description = "Multi-agent file-affinity task router. Queue/lock/oplog in vox-orchestrator-queue; MCP protocol tools in vox-orchestrator-mcp."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = [
    "toestub-gate",
    "runtime",
    "json-schema",
    "jj",
    "corpus-db",
    "http-server",
]
# HTTP server routes (axum). Enabled by vox-orchestrator-d and vox-cli
# routes that serve JSON over TCP. Not needed by library consumers.
http-server = ["dep:axum"]
# Pre-call token counting via tiktoken-rs. Needed for context-window
# management and pre-flight cost estimates. Off by default in this library
# crate (kept lean for --no-default-features / non-LLM consumers); the real
# daemon binary (vox-orchestrator-d) explicitly re-enables it via its
# Cargo.toml dependency features (both its direct `vox-orchestrator` dep and
# its `vox-orchestrator-mcp` dep, since the latter pulls in `vox-orchestrator`
# with `default-features = false`) so production builds get real per-model
# tokenization instead of the whitespace-count fallback in
# `context/token_optimization.rs`.
token-counting = ["dep:tiktoken-rs"]
# In-process corpus DB integrations. Enabled by default; --no-default-features
# disables to allow compiling without database dependencies.
corpus-db = ["vox-corpus/database"]
# Exposes test-only override seams (e.g. `route_policy::set_test_privacy_override`)
# as `pub` instead of `#[cfg(test)]`-gated, so `vox-orchestrator-mcp`'s own test
# suite (which depends on this crate as an ordinary, non-`cfg(test)` dependency)
# can drive them. Never enabled by a shipping binary's default features.
test-support = []
# Populi HTTP mesh client (`vox-populi` transport).
populi-transport = ["dep:vox-populi", "vox-populi/transport", "dep:aes-gcm", "dep:vox-mesh-transport", "dep:iroh"]
# `vox-speech` speech-to-text / refinement tools.
oratio-rerank = ["dep:vox-speech"]
# `vox-publisher` syndication / scientia surfaces.
news-publish = [
    "dep:vox-publisher",
    "vox-publisher/scientia-reddit",
    "vox-publisher/scientia-youtube",
    "vox-publisher/scholarly-external-jobs",
]
# JSON Schema generation for repository types (consumed by vox-orchestrator-mcp).
json-schema = ["vox-repository/json-schema"]
runtime = ["vox-actor-runtime", "vox-populi/mens", "lsp"]
toestub-gate = ["vox-code-audit", "vox-lsp", "lsp"]
# LSP diagnostic integration (tower-lsp-server types). Enabled transitively by toestub-gate and runtime.
lsp = ["dep:tower-lsp-server"]
system-metrics = ["dep:sysinfo"]
# In-process jj VCS actor via vox-vcs. Forwards to vox-vcs's `jj` feature
# (pulls jj-lib). On by default; `--no-default-features` chains through to a
# lean build with no jj-lib. All jj_lib:: calls are confined to vox-vcs.
jj = ["vox-vcs/jj", "runtime"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
vox-http-client.workspace = true
globset = { workspace = true }
toml = { workspace = true }
vox-package.workspace = true
vox-gamify = { workspace = true }
dirs = { workspace = true }
parking_lot = { workspace = true }
futures-util = { workspace = true }
sysinfo = { workspace = true, optional = true }
sha3 = { workspace = true }
xxhash-rust = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
tiktoken-rs = { workspace = true, optional = true }
hex = { workspace = true }
getrandom = "0.2"
vox-crypto.workspace = true
vox-foundation.workspace = true

# Optional dependencies behind feature flags
vox-actor-runtime = { workspace = true, optional = true }
vox-code-audit = { workspace = true, optional = true }
vox-lsp = { workspace = true, optional = true }
tower-lsp-server = { workspace = true, optional = true }
vox-db.workspace = true
turso = { workspace = true }
# Lean by default (qdrant-vector + tavily); tantivy/web-scrape are turned on
# graph-wide by vox-cli's `heavy-retrieval` feature (WS2-T3). Code paths here use
# the feature-agnostic execution.tantivy_doc_lines field (empty when tantivy is off).
vox-search = { workspace = true }
vox-orchestrator-types.workspace = true
vox-orchestrator-queue.workspace = true
vox-config.workspace = true
vox-repository.workspace = true
# In-process VRAM telemetry for the advisory VRAM-fit scoring signal (Task 2.6).
# Same-workspace rlib call (not the dylib plugin ABI) — see
# `vox-plugin-nvml-probe/src/lib.rs` module doc.
vox-plugin-nvml-probe = { workspace = true }
vox-populi = { path = "../vox-populi", optional = true, default-features = false }
vox-publisher = { workspace = true, optional = true, default-features = false }
async-trait = { workspace = true }
anyhow.workspace = true
serde_yaml.workspace = true
vox-speech = { workspace = true, optional = true, features = ["compiler-rerank"] }
regex = { workspace = true }
vox-corpus = { workspace = true }
# In-process VCS backend. The single home for jj_lib:: calls; the orchestrator's
# `jj` feature forwards to vox-vcs/jj. Lean by default so --no-default-features
# chains through.
vox-vcs = { path = "../vox-vcs", default-features = false }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true }
walkdir.workspace = true
vox-bounded-fs.workspace = true
aes-gcm = { workspace = true, optional = true }
rand.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
vox-secrets.workspace = true
vox-skills = { workspace = true }
vox-skill-runtime = { workspace = true }

vox-research-events.workspace = true
vox-telemetry.workspace = true
vox-mesh-types.workspace = true
vox-mesh-transport = { workspace = true, optional = true }
iroh = { workspace = true, optional = true }
vox-mesh-policy = { workspace = true }
blake3.workspace = true
crossbeam-queue = { workspace = true }
workspace-hack = { version = "0.6", path = "../workspace-hack" }
axum = { workspace = true, features = ["tokio", "http1", "json"], optional = true }
glob.workspace = true
ignore = { workspace = true }
rand_distr = { workspace = true }
async-stream.workspace = true

# Daemon binary moved to crates/vox-orchestrator-d/ in 2026-05-08 reorg Phase 4.

[build-dependencies]
serde_yaml = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
proptest = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
tracing-test = { workspace = true }
vox-actor-runtime = { workspace = true }
vox-test-harness = { path = "../vox-test-harness" }
axum = { workspace = true, features = ["tokio", "http1", "json"] }
tokio = { workspace = true, features = ["full", "test-util"] }
jsonschema = { workspace = true, default-features = false }
tower = { workspace = true, features = ["util"] }
# WAT→WASM for the mesh bundle-execution test (synthesize a real WASI module).
wat = "1.220"
wiremock = { workspace = true }

[[test]]
name = "skill_runtime_inproc"

[[test]]
name = "mesh_ai_fixture_relay"
required-features = ["populi-transport"]

[lints]
workspace = true


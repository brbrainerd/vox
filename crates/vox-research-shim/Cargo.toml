[package]
name = "vox-research-shim"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "DEI research pipeline and model-selection sub-systems (extracted from vox-orchestrator as an A-12 wedge crate)."

[features]
## Enable live LLM inference calls (disabled in test/stub builds).
runtime = ["scientia-claims"]
## Route claim extraction through `vox-scientia::claim_extractor` before LLM cascade.
scientia-claims = ["dep:vox-scientia"]
## Enable Populi news-publish routing in the mesh subscriber.
news-publish = []
## Optional Ludus/mesh kudos for SCIENTIA research milestones (never gates publication).
gamify = ["dep:vox-gamify"]

[dependencies]
vox-orchestrator = { workspace = true }
vox-orchestrator-types = { workspace = true }
vox-actor-runtime = { workspace = true }
vox-secrets = { workspace = true }
vox-config = { workspace = true }
vox-db = { workspace = true }
vox-research-events = { workspace = true }
vox-search = { workspace = true }  # tantivy/web-scrape gated graph-wide via vox-cli heavy-retrieval (WS2-T3)
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
workspace-hack = { workspace = true }
vox-scientia = { workspace = true, optional = true }
vox-gamify = { workspace = true, optional = true }

[dev-dependencies]
jsonschema = { workspace = true, default-features = false }
tempfile = { workspace = true }
vox-scientia = { workspace = true }

[lints]
workspace = true

[package]
name = "vox-runtime"
version.workspace = true
edition = "2024"
description = "Umbrella runtime crate for Vox — declares the RuntimeProfile (Desktop vs Mobile) + lifecycle traits + VoxConfig that downstream runtime crates (vox-workflow-runtime, vox-actor-runtime) and the uniffi-bindgen-react-native bridge consume. Foundation for `@vox/runtime-rn` on device."
license = "Apache-2.0"
publish = false

[lib]
# cdylib + staticlib so this crate is linkable as a native library from
# Android / iOS via uniffi-bindgen-react-native; rlib so workspace crates
# can depend on it the normal way. See docs/src/architecture/mobile-rn-expo-implementation-spec-2026.md §10.4.
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }

# NOTE: workspace-hack is deliberately NOT a dep of this crate.
# It transitively pulls in `gix` -> `reqwest` -> `native-tls` -> `openssl-sys`,
# which can't cross-compile to mobile (`aarch64-linux-android`,
# `aarch64-apple-ios`) without vendoring OpenSSL source. The workspace-hack
# unification is a host-build performance optimization; mobile targets opt
# out so they can ship.

[dev-dependencies]
serde_json = { workspace = true }

[package]
name = "vox-shell-stdlib-types"
description = "Shared data types for the Vox shell stdlib surface (std.fs.*, std.csv). L0 — zero workspace deps. Consumed by vox-compiler (interp path) and vox-actor-runtime (codegen path) to break the compiler↔runtime cycle."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
workspace-hack = { version = "0.6", path = "../workspace-hack" }

[lints]
workspace = true

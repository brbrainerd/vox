# `packages` is not required by pnpm 10+, which is what every workflow now
# pins. It is kept because pnpm 9 treats the mere existence of this file as
# declaring a workspace and dies with "packages field missing or empty"
# without it — so this one line keeps a stray pnpm 9 (a contributor's global
# install, an old container) from failing confusingly.
packages:
  - '.'

# pnpm 11 reads settings from this file; the `pnpm` field in package.json is
# ignored once this file exists. The overrides below MUST mirror
# package.json#pnpm.overrides — without them pnpm silently drops the floor and
# resolves esbuild below the pinned minimum.
overrides:
  esbuild: '>=0.28.1'

# esbuild ships a postinstall that fetches its platform binary. pnpm 11 blocks
# dependency build scripts unless they are explicitly allowed; without this the
# binary is never materialized and `pnpm build` fails with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  esbuild: true

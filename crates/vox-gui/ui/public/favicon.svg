<svg width="64" height="64" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Vox Axis favicon — static brass tile + white gimbal mark (does NOT theme-switch;
       this is the brand constant outside the themed app). Geometry mirrors the in-app
       AxisMark and the committed icon master. -->
  <defs>
    <linearGradient id="axisTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c69a5b"/>
      <stop offset="48%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="196" ry="196" fill="url(#axisTile)"/>
  <g stroke="#fafafa" fill="none" stroke-linecap="round">
    <circle cx="512" cy="512" r="292" stroke-opacity="0.5" stroke-width="24"/>
    <ellipse cx="512" cy="512" rx="292" ry="116" stroke-opacity="0.85" stroke-width="30" transform="rotate(34 512 512)"/>
    <ellipse cx="512" cy="512" rx="292" ry="116" stroke-opacity="0.85" stroke-width="30" transform="rotate(-34 512 512)"/>
  </g>
  <line x1="512" y1="236" x2="512" y2="872" stroke="#fafafa" stroke-width="46" stroke-linecap="round"/>
  <polygon points="512,140 466,244 558,244" fill="#fafafa"/>
  <circle cx="512" cy="512" r="54" fill="#18181b"/>
  <circle cx="512" cy="512" r="54" fill="none" stroke="#fafafa" stroke-width="22"/>
</svg>

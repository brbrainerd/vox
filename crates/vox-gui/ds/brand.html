<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Limes Brand Assets</title>
  <link rel="icon" type="image/svg+xml" href="./icons/axis-mark.svg" />
  <link rel="stylesheet" href="./styles.css" />
  <style>
    body { margin: 0; padding: 40px; background: var(--color-bg-base); min-height: 100vh; box-sizing: border-box; }
    .label { color: var(--color-text-muted); font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; margin: 0 0 12px; }
    .panel { margin-bottom: 40px; }
    .lockup-wrap { padding: 24px 28px; border: 1px solid var(--color-border-subtle); border-radius: 16px; background: var(--color-overlay-subtle); display: inline-block; }
    svg text { font-family: 'Cinzel', Georgia, serif; }
  </style>
</head>
<body>
  <div class="panel">
    <p class="label">brand lockup · on basalt surface</p>
    <div class="lockup-wrap">
      <svg width="380" height="88" viewBox="0 0 380 88" role="img" aria-label="Vox Axis">
        <g transform="translate(8 12) scale(0.64)" fill="none" stroke="#d4af37">
          <circle cx="50" cy="50" r="40" stroke-width="7"/>
          <path d="M50 12 V88 M12 50 H88" stroke-width="9" stroke-linecap="round"/>
          <circle cx="50" cy="50" r="9" stroke-width="7"/>
          <path d="M50 6 l6 10 h-12 z M50 94 l6 -10 h-12 z M6 50 l10 6 v-12 z M94 50 l-10 6 v-12 z" fill="#d4af37" stroke="none"/>
        </g>
        <text x="84" y="46" font-weight="600" font-size="30" letter-spacing="6" fill="#fafafa">VOX AXIS</text>
        <text x="86" y="66" font-weight="600" font-size="10" letter-spacing="5.5" fill="#4a9e8f">OPERATOR CONSOLE</text>
      </svg>
    </div>
  </div>

  <div class="panel">
    <p class="label">splash · surveyor's grid hero</p>
    <svg width="480" height="320" viewBox="0 0 480 320" role="img" aria-label="Vox Axis">
      <rect x="0" y="0" width="480" height="320" rx="28" fill="#0c0e10"/>
      <g stroke="#4a9e8f" stroke-width="1" opacity="0.10">
        <path d="M60 0 V320 M180 0 V320 M300 0 V320 M420 0 V320"/>
        <path d="M0 60 H480 M0 140 H480 M0 220 H480 M0 300 H480"/>
      </g>
      <g transform="translate(240 132)"><g transform="scale(0.9) translate(-50 -50)" fill="none" stroke="#d4af37">
        <circle cx="50" cy="50" r="40" stroke-width="6"/>
        <path d="M50 12 V88 M12 50 H88" stroke-width="8" stroke-linecap="round"/>
        <circle cx="50" cy="50" r="9" stroke-width="6"/>
        <path d="M50 6 l6 10 h-12 z M50 94 l6 -10 h-12 z M6 50 l10 6 v-12 z M94 50 l-10 6 v-12 z" fill="#d4af37" stroke="none"/>
      </g></g>
      <text x="240" y="246" text-anchor="middle" font-weight="600" font-size="30" letter-spacing="9" fill="#fafafa">VOX AXIS</text>
      <line x1="170" y1="266" x2="310" y2="266" stroke="#d4af37" stroke-width="1"/>
      <text x="240" y="288" text-anchor="middle" font-weight="600" font-size="10" letter-spacing="6" fill="#8b949a">SURVEYOR OF AGENTS</text>
    </svg>
  </div>
</body>
</html>

[package]
name = "vox-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Native Tauri GUI for Vox"
build = "build.rs"

[features]
gui = []
default = ["gui"]

[dependencies]
vox-cli = { workspace = true }
vox-cli-core = { workspace = true }
vox-foundation = { workspace = true }
vox-orchestrator = { workspace = true }
vox-orchestrator-mcp = { workspace = true }
vox-repository = { workspace = true }
vox-package-types = { workspace = true }
vox-config = { workspace = true }
vox-db = { workspace = true }
vox-gamify = { path = "../vox-gamify" }
vox-secrets = { workspace = true }
vox-search = { workspace = true }
toml = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
tauri = { workspace = true }
tauri-plugin-shell = { version = "2" }
rmp-serde = "1.1"
serde_bytes = "0.11"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
turso = { workspace = true }
base64 = { workspace = true }
[build-dependencies]
vox-build-meta = { workspace = true }
tauri-build = { version = "2", features = [] }

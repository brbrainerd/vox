[package]
name = "vox-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Native Tauri GUI for Vox"
build = "build.rs"

[features]
gui = []
default = ["gui"]
# Desktop speech-to-text: pulls cpal/hound mic capture (via vox-ml-cli's
# `oratio-mic`) + the Oratio plugin host. Default-OFF to keep the stock GUI lean.
oratio = ["dep:vox-ml-cli", "dep:vox-plugin-host"]

[dependencies]
vox-cli = { workspace = true }
vox-cli-core = { workspace = true }
vox-git = { workspace = true }
vox-foundation = { workspace = true }
vox-orchestrator = { workspace = true }
# Shipping MCP server: keep the full default tool surface (news/scientia/visus).
vox-orchestrator-mcp = { workspace = true, features = ["news-publish", "gui-visual-review", "heavy-browser"] }
vox-repository = { workspace = true }
vox-package-types = { workspace = true }
vox-config = { workspace = true }
vox-db = { workspace = true }
vox-gamify = { path = "../vox-gamify" }
vox-secrets = { workspace = true }
vox-oauth-pkce = { workspace = true }
vox-http-client = { workspace = true }
vox-scientia = { workspace = true }
vox-publisher = { workspace = true }
chrono = { workspace = true }
vox-actor-runtime = { workspace = true }
vox-identity = { workspace = true }
vox-crypto = { workspace = true }
vox-search = { workspace = true, features = ["web-scrape"] }
vox-ml-cli = { workspace = true, optional = true, features = ["oratio-mic"] }
vox-plugin-host = { workspace = true, optional = true }
vox-speech = { workspace = true, features = ["stt-candle", "stt-sherpa", "compiler-rerank"] }
cpal = { workspace = true }
hound = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
toml = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
tauri = { workspace = true }
tauri-plugin-shell = { version = "2" }
tauri-plugin-dialog = { version = "2" }
rmp-serde = "1.1"
serde_bytes = "0.11"
portable-pty = { workspace = true }
vox-terminal-core = { path = "../vox-terminal-core" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
turso = { workspace = true }
base64 = { workspace = true }
dirs = { workspace = true }
ignore = { workspace = true }
similar = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tauri = { workspace = true, features = ["test"] }
wiremock = { workspace = true }

[build-dependencies]
vox-build-meta = { workspace = true }
tauri-build = { version = "2", features = [] }
serde_json = { workspace = true }

<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Axis (Vox Axis) app mark: a bold "A" whose two diagonal strokes read as crossed
       x/y axes. Palette matches the in-app glyph: brass -> amber -> zinc, to-br. -->
  <defs>
    <linearGradient id="axisTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c69a5b"/>
      <stop offset="48%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="axisStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#e7d3b1"/>
    </linearGradient>
  </defs>

  <!-- rounded tile -->
  <rect x="64" y="64" width="896" height="896" rx="196" ry="196" fill="url(#axisTile)"/>
  <!-- subtle inner ring (echoes ring-1 ring-brass/40) -->
  <rect x="92" y="92" width="840" height="840" rx="172" ry="172" fill="none"
        stroke="#f5deb3" stroke-opacity="0.28" stroke-width="8"/>

  <!-- the "A" / crossed axes -->
  <g fill="none" stroke="url(#axisStroke)" stroke-width="84"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- left leg / one axis -->
    <path d="M512 268 L300 760"/>
    <!-- right leg / other axis -->
    <path d="M512 268 L724 760"/>
    <!-- crossbar / shared origin line -->
    <path d="M386 566 L638 566"/>
  </g>
  <!-- axis end-caps: small ticks at the leg feet to reinforce the axis read -->
  <g fill="#fafafa" fill-opacity="0.92">
    <circle cx="300" cy="760" r="30"/>
    <circle cx="724" cy="760" r="30"/>
  </g>
</svg>

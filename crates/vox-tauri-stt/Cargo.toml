[package]
name = "vox-tauri-stt"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
authors = ["Bert Brainerd"]
repository = "https://github.com/vox-foundation/vox.git"
rust-version = "1.92"
description = "Speech-to-text bridge types + guest JS for desktop Tauri 2 apps (register the plugin in your app's src-tauri). Tauri is desktop-only; mobile uses the React Native target."
publish = false

[lib]
name = "vox_tauri_stt"
path = "src/lib.rs"

[features]
default = []
# Tauri 2 plugin (`init`) + `transcribe` command — enable from generated `src-tauri`.
tauri-plugin = ["dep:tauri"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { workspace = true, optional = true }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"

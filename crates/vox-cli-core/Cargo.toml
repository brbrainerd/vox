[package]
name = "vox-cli-core"
description = "Shared internals for the vox CLI binary (argv parsing helpers, exit-code policy)."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# `db` (default-on) enables the Ludus project-DB + gamification telemetry side
# channel in the LSP binary (cached_project_db + vox_gamify::lsp_telemetry).
# `--no-default-features` drops vox-db/vox-gamify entirely, leaving a pure
# lex/parse/typecheck language server — the form a minimal toolchain
# (e.g. vox-langtool) can embed without pulling persistence.
default = ["db", "orchestrator"]
db = ["dep:vox-db", "dep:vox-gamify", "dep:vox-repository"]
orchestrator = ["dep:vox-orchestrator", "dep:vox-orchestrator-driver"]

[dependencies]
vox-config = { workspace = true }
vox-db = { workspace = true, optional = true }
vox-gamify = { workspace = true, optional = true }
vox-repository = { workspace = true, optional = true }
vox-orchestrator = { workspace = true, optional = true }
vox-orchestrator-driver = { workspace = true, optional = true }
vox-foundation = { workspace = true }
vox-secrets = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
owo-colors = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true, features = ["io-std", "macros", "process", "rt", "rt-multi-thread", "signal", "sync"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
which = { workspace = true }

[dev-dependencies]
vox-bounded-fs = { workspace = true }
vox-jsonschema-util = { workspace = true }

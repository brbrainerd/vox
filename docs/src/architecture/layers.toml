# Workspace architectural source of truth — read by `vox-arch-check`.
# See docs/src/architecture/2026-05-08-workspace-reorg-design.md and
# docs/src/architecture/2026-05-08-naming-and-guards-design.md.
#
# Layers (descending — L5 may depend on L0..L4; L0 may depend only on L0):
#   0 — Pure types (data only, no async runtime, no DB)
#   1 — Primitives & utilities (incl. plugin-api type-only surface)
#   2 — Domain libraries (pure-data domain logic)
#   3 — Heavy runtimes (DBs, compilers, orchestrators, plugin-host)
#   4 — Concrete plugins (cdylib consumers — loaded, not compiled-into-L0..L3)
#   5 — Surfaces (binaries, integration)
#
# Per-crate fields:
#   layer             — required; integer 0..=5
#   kind              — "library" | "plugin" | "binary" | "test-only"; default "library"
#   max_dependents    — optional; warn if more in-tree consumers than this
#   max_loc           — optional; warn if src/**/*.rs total exceeds this
#   staleness_exempt  — optional bool; set true for intentionally stable crates that
#                       should not be flagged by Rule 6 even when unchanged across releases
#
# Within-layer deps are allowed. Lower→higher is an inversion (failure unless
# explicitly listed under [[known_inversions]]).
#
# Binary-tool exception: a `kind = "binary"` crate at any layer is a *tool*
# (e.g., vox-arch-check, vox-ml-cli, vox-orchestrator-d) consumed via
# `cargo run -p <name>` rather than as a library dep. Such crates are exempt
# from the orphan rule and from the convention that workspace surfaces sit at L5.
# Only product-shipped binaries (the user-visible CLI surface) live at L5.

# Optional: extra directory *names* (final path component) skipped when
# vox-arch-check walks the repo for Rule 9 + 11. Built-in skips always include
# target, .git, node_modules, .pnpm-store, __pycache__, .venv, .mypy_cache,
# .turbo, .next, .parcel-cache, .cargo — extras can only add, never remove.
[arch_check.walk_prune]
extra_skip_dir_names = [
    "example_vendor",
    "wt-skill-discovery-engine",
    ".claude",
    ".worktrees",
    ".clone",
    ".claire",
    "target_ci",
    "target-verify-mcp",
    "tmp",
    "graphify-out",
    "workspace",
    ".sccache",
    ".vox",
    ".agents"
]

[guards]
# Strictness per rule. Layer ordering is implicitly strict (override with
# the --warn-only CLI flag). The other seven default to warn.
fan_in            = "warn"
# Off: reported by Rule 13 as a trend, never as an absolute ceiling. Per-crate
# LoC is a weak proxy for both goals it served. Build cost is measured directly
# by blast_s (contracts/ci/crate-build-map.v1.json, gated by `vox ci
# crate-budget`); agent read/write ergonomics are a per-FILE property enforced
# by arch/god_object (Error at 500 non-blank lines). Measured 2026-08-31: 91% of
# workspace compile time is third-party, so per-crate first-party LoC could not
# have been a build-time lever. The number also bound nothing in practice —
# vox-orchestrator's budget was raised 55K -> 60K -> 70K and is still exceeded
# at ~85.5K. The `max_loc` values below are RETAINED as Rule 13's growth
# baseline: loc_delta skips any crate whose max_loc is None, so deleting them
# would disable growth detection too.
loc_budget        = "off"
orphan            = "error"  # promoted from warn post-Tier-A; no legitimate orphan libraries should exist
docstring         = "warn"
description       = "error"
where_things_live = "error"
# Rule 12: WTL / layers.toml / disk three-way parity.
wtl_parity        = "error"
# Rule 13: LoC delta regression. Warns when any budgeted crate has grown >15% vs last release tag.
loc_delta         = "warn"
# Rule 8: warns when a crate has no commits since the last CHANGELOG.md release date.
# Silence for individual crates with staleness_exempt = true.
staleness         = "warn"
# Rule 9: warns when a @generated-hash header in a file no longer matches content.
generated_file_drift = "warn"
# Rule 10: strict — crates must not directly depend on any of their listed forbidden deps.
forbidden_deps    = "error"
# NOTE: This key is a single global guard that covers ALL [[forbidden_pattern]] rules
# simultaneously (raw-git-exec, jj-lib-confined, raw-jj-exec,
# projection-bundle-ts-emit-boundary, projection-bundle-rust-emit-boundary,
# crate-allow-unsafe-code, no-capacitor-*, no-axum-*, no-rust-embed-*,
# no-hardcoded-shell-spawn, no-hardcoded-abs-path, no-hardcoded-dynlib-ext).
# It was promoted to "error" after a full tree sweep confirmed zero open
# violations for every rule (see Task 4.2 in the cross-platform parity plan).
# Adding a new [[forbidden_pattern]] rule with open violations while this is
# "error" will cause CI to fail immediately for that rule.
#
# 2026-06-19: briefly downgraded to "warn" during VoxMens Split B (28 violations,
# almost all TEST-code false-positives + 2 real raw-git in vox-cli graphify).
# Restored to "error" after: (a) adding per-rule `exempt_tests` (skips tests/ dirs
# + inline #[cfg(test)] blocks) on the unsafe/abs-path/dynlib/shell-spawn rules,
# (b) routing vox-cli graphify through vox_git, (c) annotating the cfg(windows)-gated
# voxup powershell spawn. Tree re-swept clean (0 violations). See ledger AGH-0008.
forbidden_pattern = "error"

# ── Rule 10: Forbidden direct dependencies ────────────────────────────────────
# vox-rule-pack and vox-code-audit must never directly depend on heavy search/
# vector crates. This keeps compile times neutral and the rule-pack zero-dep.
[[forbidden_deps]]
crate    = "vox-rule-pack"
forbidden = ["vox-search", "tantivy", "qdrant"]
reason   = "vox-rule-pack must remain zero heavy-dep; patterns live in YAML not embeddings"

[[forbidden_deps]]
crate    = "vox-code-audit"
forbidden = ["vox-search", "tantivy", "qdrant"]
reason   = "vox-code-audit detectors must not pull search/vector deps (build-time neutrality)"

[[forbidden_deps]]
crate    = "vox-telemetry-otlp"
forbidden = ["vox-orchestrator", "vox-cli", "vox-gui"]
reason   = "egress crate must not depend up into surfaces; surfaces register it, not vice-versa"


# ── Permitted inversions ──────────────────────────────────────────────────────
# Layer-check tolerates these specific lower-to-higher edges. Each entry
# documents WHY and what would be required to remove it.

[[known_inversions]]
from   = "vox-cli"
to     = "vox-orchestrator"
reason = "CLI ↔ orchestrator coupling is load-bearing for runtime/observability surfaces (vox status, vox attention, vox model *, vox dei, vox live). Shared Vox.toml bootstrap lives in vox-orchestrator-driver (re-exported from vox-cli-core). See build-time-log.md Phase 7 audit."

[[known_inversions]]
from   = "vox-orchestrator-mcp"
to     = "vox-orchestrator-driver"
reason = "MCP stdio host loads embedded orchestrator config via vox-orchestrator-driver::build_embedded_orchestrator_config (shared with vox-cli dei surfaces). Shim remains at vox-cli-core::orchestrator_driver for legacy CLI imports."

[[known_inversions]]
from   = "vox-ml-cli"
to     = "vox-cli"
reason = "Optional `mens-dei` workflow path shells out through `vox_cli::commands::build`, `build_service`, and `fs_utils` when `workflow-runtime` is disabled. Prefer extracting a shared L3 driver crate over tightening `vox-cli` deps."

[[known_inversions]]
from   = "vox-config"
to     = "vox-git"
reason = "vox-config::graphify (corpus-staleness check) calls only vox_git::read_only, the dependency-free raw-`git status --porcelain` shim in read_cmd.rs — it never touches the gix-backed GitBridge machinery that makes vox-git L3. read_only has no deps beyond std + thiserror, so it is itself L0/L1-shaped; it is just physically colocated with the heavier gix bridge. Pre-existing on main; never evaluated by this rule before 2026-07-03 because a missing-crates-in-layers.toml gap short-circuited the whole tool. Prefer extracting read_cmd.rs into a small L1 crate (e.g. vox-git-read) shared by vox-config and vox-git's other L3+ callers over tightening vox-config's layer."

# ── Rule 11 (P3-T7): Forbidden code patterns ─────────────────────────────────
# Forbid raw git invocations outside the concurrency-policy wrapper.
# See docs/src/architecture/git-concurrency-policy.md.
[[forbidden_pattern]]
name             = "raw-git-exec"
pattern          = 'Command::new\("git"\)'
file_glob        = "crates/**/*.rs"
exempt_files     = [
    "crates/vox-arch-check/src/main.rs",
    "crates/vox-arch-check/src/forbidden_patterns.rs",
    "crates/vox-orchestrator-mcp/src/git_tools.rs",
    "crates/vox-repository/src/repo_catalog/query.rs",
    "crates/vox-search/src/memory_hybrid.rs",
    "crates/vox-git/src/bridge.rs",
    # Sanctioned read-only raw-git helper (unified diffs / numstat gix cannot print).
    "crates/vox-git/src/read_cmd.rs",
    # Isolated per-test tempdir fixtures; no shared-repo concurrency risk.
    "crates/vox-effort-audit/tests/support/mod.rs",
    # Skill install: shallow-clones a user-supplied git URL into a fresh
    # tempfile::tempdir() (never a shared/working repo), with protocol
    # allowlisting, a stall guard, and CREATE_NO_WINDOW already applied.
    # vox-plugin-host is deliberately dependency-free (see module doc on
    # user_install.rs) — routing through GitExec would add an L3 dep edge
    # for a one-shot operation with no shared-repo concurrency risk.
    "crates/vox-plugin-host/src/user_install.rs",
    "crates/vox-orchestrator-mcp/src/git_exec.rs",
    "crates/vox-build-meta/src/lib.rs",
    "crates/vox-cli/src/commands/ci/data_storage_guard.rs",
    "crates/vox-cli-ci/src/install_hooks.rs",  # uses vox_git::read_only(); pattern match hits the comment only (moved from vox-cli in the PR-4 CI split)
    "crates/vox-cli/src/commands/ci/line_endings.rs",
    "crates/vox-cli-ci/src/line_endings.rs",
    "crates/vox-cli-ci/src/commit_lint.rs",
    "crates/vox-cli/src/commands/ci/pre_push.rs",
    "crates/vox-cli/src/commands/ci/run_body_helpers/guards.rs",
    "crates/vox-cli/src/commands/ci/watch_run.rs",
    "crates/vox-cli/src/commands/ci/workspace_artifacts/mod.rs",
    "crates/vox-cli/src/commands/diagnostics/doctor/checks_standard/toolchain.rs",
    "crates/vox-cli/src/commands/repo_upgrade.rs",
    "crates/vox-cli/src/commands/review/coderabbit/git.rs",
    "crates/vox-cli/src/commands/review/coderabbit/github/reviews/baseline.rs",
    "crates/vox-cli/src/commands/review/coderabbit/github/reviews/stack.rs",
    "crates/vox-cli/src/commands/review/coderabbit/github/reviews/submit_branch.rs",
    "crates/vox-cli/src/commands/review/coderabbit/github/reviews/worktree.rs",
    "crates/vox-cli/src/commands/review/coderabbit/historical_planner.rs",
    "crates/vox-cli-review/src/coderabbit/semantic_planner/collector.rs",  # moved from vox-cli in the vox-cli-review split
    "crates/vox-cli/src/commands/review/coderabbit/semantic_planner/submit.rs",
    "crates/vox-cli/src/commands/review/coderabbit/stack_planner/submit.rs",
    # Pre-existing, unaudited raw git-exec sites: never evaluated by this rule
    # before because a missing-crates-in-layers.toml gap short-circuited the
    # whole tool before it reached forbidden_pattern checks (fixed 2026-07-03).
    # Pending migration to vox_git::GitExec, not a newly introduced violation.
    "crates/vox-ml-cli/src/commands/mens/populi/train_arm.rs",  # `git rev-parse --short HEAD` for a training-run manifest stamp
    "crates/vox-plugin-host/src/user_install.rs",  # shallow-clone a plugin source URL into a temp dir (HITL-gated, user-initiated)
    "crates/vox-doc-pipeline/src/pipeline/lint.rs",
]
allow_annotation = "// vox-arch-check: allow git-exec"
reason           = "All git invocations must go through GitExec to honor the concurrency policy."

[[forbidden_pattern]]
name             = "jj-lib-confined"
pattern          = 'jj_lib::'
file_glob        = "crates/**/*.rs"
exempt_files     = [
    "crates/vox-vcs/src/jj_backend.rs",
]
allow_annotation = "// vox-arch-check: allow jj-lib"
reason           = "All jj-lib calls must live in vox-vcs so the unstable jj-lib API has one auditable blast radius."

[[forbidden_pattern]]
name             = "raw-jj-exec"
pattern          = 'Command::new\("jj"\)'
file_glob        = "crates/**/*.rs"
exempt_files     = [
    # Sanctioned dev-convenience CLI tool: `vox vcs` shells to jj for blame/heatmap/rebase
    # (annotate/merge), which are not yet exposed in-process by vox-vcs. All other jj usage
    # is in-process via vox-vcs::JjActor — the orchestrator must never spawn `jj` again.
    "crates/vox-cli/src/commands/vcs.rs",
]
allow_annotation = "// vox-arch-check: allow jj-exec"
reason           = "jj is used in-process via jj-lib (vox-vcs::JjBackend/JjActor); the only sanctioned subprocess jj is the `vox vcs` CLI tool (blame/rebase not yet in-process)."

# Emit boundary (ADR 036 / projection bundle): do not re-lower or re-project HIR outside
# `vox-codegen::projection_bundle` from TypeScript/Rust emitters — use `project_bundle_from_hir`.
[[forbidden_pattern]]
name             = "projection-bundle-ts-emit-boundary"
pattern          = '(?-u)\b(lower_hir_to_web_ir|project_web_from_core|project_app_contract|project_runtime_from_hir|project_shell_from_hir|project_required_capabilities)\s*\('
file_glob        = "crates/vox-codegen-ts/src/**/*.rs"
allow_annotation = "// vox-arch-check: allow-direct-projection"
reason           = "HIR projections for emit must go through projection_bundle (WebIR/AppContract/Runtime/Shell/RequiredCapabilities SSOT)."

[[forbidden_pattern]]
name             = "projection-bundle-rust-emit-boundary"
pattern          = '(?-u)\b(lower_hir_to_web_ir|project_web_from_core|project_app_contract|project_runtime_from_hir|project_shell_from_hir|project_required_capabilities)\s*\('
file_glob        = "crates/vox-codegen/src/codegen_rust/**/*.rs"
allow_annotation = "// vox-arch-check: allow-direct-projection"
reason           = "HIR projections for emit must go through projection_bundle (WebIR/AppContract/Runtime/Shell/RequiredCapabilities SSOT)."

# agy chokepoint: all Antigravity CLI spawns must go through AgyExec (kill_on_drop,
# CREATE_NO_WINDOW, arg sanitisation). Raw spawns bypass the credit-burn-on-orphan guard.
[[forbidden_pattern]]
name             = "raw-agy-exec"
pattern          = 'Command::new\("agy"\)'
file_glob        = "crates/**/*.rs"
exempt_files     = [
    "crates/vox-orchestrator-mcp/src/agy_exec.rs",
    "crates/vox-orchestrator-mcp/src/agy_doctor.rs",
]
allow_annotation = "// vox-arch-check: allow agy-exec"
reason           = "All agy CLI invocations must go through AgyExec (kill_on_drop guard prevents credit-burning orphans on timeout)."

# Crate-level `unsafe_code` allows — keep list short; prefer `EnvScratch`, scoped `#[allow]`, or `// vox-arch-check: allow crate unsafe_code`.
[[forbidden_pattern]]
name             = "crate-allow-unsafe-code"
exempt_tests     = true
pattern          = '#!\[allow\([^\]]*unsafe_code[^\]]*\)\]'
file_glob        = "crates/**/*.rs"
exempt_files     = [
    "crates/vox-test-harness/src/env_scratch.rs",
    "crates/vox-plugin-api/src/lib.rs",
    "crates/vox-lsp/tests/diagnostic_tests.rs",



    "crates/vox-populi/tests/ed25519_envelope.rs",
    "crates/vox-compiler/tests/mens_decorators.rs",
    "crates/vox-compiler/tests/reactive_smoke_test.rs",
    "crates/vox-compiler/tests/web_ir_environment_gates_test.rs",
    "crates/vox-compiler/tests/web_ir_lower_emit_test.rs",
    "crates/vox-integration-tests/tests/pipeline_env_test.rs",
    "crates/vox-integration-tests/tests/pipeline_test.rs",
    "crates/vox-integration-tests/tests/ts_emit_typecheck_test.rs",
    "crates/vox-orchestrator/tests/mesh_ai_fixture_relay.rs",
]
allow_annotation = "// vox-arch-check: allow crate unsafe_code"
reason           = "New crate-root `#![allow(unsafe_code)]` must be reviewed; centralize test env mutation or document FFI invariants instead of widening the surface."

# Tauri convergence (ADR 037): Capacitor and Axum-as-app surfaces are retired for
# generated desktop/mobile applications. Current call sites remain as explicit
# exemptions until the migration plan removes them task by task.
[[forbidden_pattern]]
name             = "no-capacitor-in-app-codegen"
pattern          = '@capacitor/'
file_glob        = "crates/vox-codegen/**/*.rs"
allow_annotation = "// vox-arch-check: allow capacitor-codegen"
reason           = "Generated app code must use @tauri-apps/* per ADR 037."

[[forbidden_pattern]]
name             = "no-cap-sync-in-cli"
pattern          = 'npx\s+cap\s+(sync|run|update)'
file_glob        = "crates/vox-cli/**/*.rs"
allow_annotation = "// vox-arch-check: allow cap-sync"
reason           = "`npx cap sync` is retired for app packaging; use Tauri mobile tooling per ADR 037."

[[forbidden_pattern]]
name             = "no-axum-in-generated-app-emit"
pattern          = 'axum::serve|axum::Router::new|axum::routing'
file_glob        = "crates/vox-codegen/src/codegen_rust/emit/**/*.rs"
exempt_files     = [
    "crates/vox-codegen/src/codegen_rust/emit/http.rs",
]
allow_annotation = "// vox-arch-check: allow axum-app-emit"
reason           = "Generated desktop/mobile applications must use Tauri; Axum emit is reserved for native-binary, dashboard, server, and daemon/API lanes."

[[forbidden_pattern]]
name             = "no-rust-embed-in-generated-cargo"
pattern          = 'rust-embed'
file_glob        = "crates/vox-codegen/src/codegen_rust/emit/**/*.rs"
exempt_files     = [
    "crates/vox-codegen/src/codegen_rust/emit/mod.rs",
]
allow_annotation = "// vox-arch-check: allow rust-embed-app-emit"
reason           = "Generated desktop/mobile applications bundle assets through Tauri `dist/`; rust-embed remains only for non-Tauri targets during migration."

[[forbidden_pattern]]
name             = "no-capacitor-deps-in-apps"
pattern          = '"@capacitor/'
file_glob        = "apps/**/package.json"
allow_annotation = "// vox-arch-check: allow capacitor-app-dep"
reason           = "Application package manifests use @tauri-apps/* per ADR 037."

# ── Cross-platform parity rules (warn until tree is clean — see
#    cross-platform-guarantees-audit-and-enforcement-2026-06-15.md, then promote in [guards]) ──
[[forbidden_pattern]]
name             = "no-hardcoded-shell-spawn"
exempt_tests     = true
pattern          = 'Command::new\(\s*"(cmd|cmd\.exe|powershell|pwsh|sh|bash)"'
file_glob        = "crates/**/*.rs"
exempt_files     = [
    "crates/vox-cli-core/src/fs_utils.rs",
    "crates/vox-cli/src/fs_utils.rs",
    "crates/vox-scientia/src/replay/sandbox.rs",
    "crates/vox-ml-cli/src/commands/mens/plugin_heal.rs",
]
allow_annotation = "// vox-arch-check: allow shell-spawn"
reason           = "Shell/PowerShell spawns must be cfg(windows)-gated or resolved via which::which(pwsh|powershell)."

[[forbidden_pattern]]
name             = "no-hardcoded-abs-path"
exempt_tests     = true
pattern          = '"(/(tmp|usr|etc|var|home|opt|bin|root)\b|[A-Za-z]:\\)'
file_glob        = "crates/**/*.rs"
exempt_files     = [
    # Vox DSL formatter golden — annotations inside raw-string Vox source would alter
    # the round-trip assertion; suppress via exempt_files instead.
    "crates/vox-compiler/src/fmt/mod.rs",
    # TOML test fixture — /etc paths are in raw-string TOML content, not Rust code.
    "crates/vox-repository/src/populi_toml.rs",
    # Code-audit detector files: these contain example/documentation path strings inside
    # Rust string literals (minimal_repro() methods). Using exempt_files here is
    # intentional — do NOT rely on annotation-in-string suppression for these files,
    # as that technique works only by coincidence of proximity and is misleading.
    "crates/vox-code-audit/src/detectors/magic_value.rs",
    "crates/vox-code-audit/src/detectors/scaling.rs",
    # Whole-file test module (included only via `#[cfg(test)] mod tests;` in
    # eval_gate/mod.rs) — the `exempt_tests` inline-block detector only covers
    # in-file `#[cfg(test)] mod { .. }` blocks, not a separate file pulled in
    # under a `#[cfg(test)]` mod declaration in the parent. `/tmp/...` literals
    # here are mock tool-call fixture args, never shipped.
    "crates/vox-ml-cli/src/commands/mens/eval_gate/tests.rs",
]
allow_annotation = "// vox-arch-check: allow abs-path"
reason           = "Hardcoded absolute paths break across OSes; use std::env::temp_dir()/dirs/Path::join."

[[forbidden_pattern]]
name             = "no-hardcoded-dynlib-ext"
exempt_tests     = true
pattern          = '"[^"]*\.(so|dll|dylib)"'
file_glob        = "crates/**/*.rs"
allow_annotation = "// vox-arch-check: allow dynlib-ext"
reason           = "Shared-lib suffix differs per OS (.so/.dll/.dylib); derive it from target, do not hardcode."

[[forbidden_pattern]]
name             = "no-literal-home-tilde"
exempt_tests     = true
# Anchored to a path constructor on purpose. The bare `"~/` form is 100% false
# positives on this tree: error-message text, a CARGO_HOME documentation default,
# and `strip_prefix("~/")` in the tilde-EXPANSION helper — i.e. it would flag its
# own fix. This form catches the real shape (PathBuf::from("~/...")), which never
# resolves because Rust does not expand `~`.
pattern          = '(PathBuf::from|Path::new)\(\s*"~/'
file_glob        = "crates/**/*.rs"
allow_annotation = "// vox-arch-check: allow home-tilde"
reason           = "Rust does not expand `~`; use dirs/home or vox_config::paths for the home directory."

[[forbidden_pattern]]
name             = "no-otlp-in-emitters"
pattern          = 'vox.telemetry.otlp'
file_glob        = "crates/**/Cargo.toml"
exempt_files     = [
    "crates/vox-telemetry-otlp/Cargo.toml",
    "crates/vox-cli/Cargo.toml",
    "crates/vox-gui/Cargo.toml",
]
allow_annotation = "# vox-arch-check: allow otlp-dep"
reason           = "vox-telemetry-otlp is L3 egress; only surface binaries (vox-cli, vox-gui) may depend on it. Domain crates emit via the L1 record_event! macro only."

